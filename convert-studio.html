<head>

<title>Convert Studio</title>
<meta name="description" content="Everyday unit converter: currency, length, area, weight, volume, temperature, fuel, data, lakh and crore, and more.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--h-font);
    background: var(--h-bg); color: var(--h-text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
  .spacer { flex: 1; }
  input, button { font: inherit; color: var(--h-text); }
  button {
    font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); cursor: pointer;
  }
  button:hover { background: var(--h-btn-hover); }
  #q {
    width: 260px; font-size: 13px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); outline: none;
  }
  #q:focus { border-color: var(--h-text2); }
  .hint { font-size: 12px; color: var(--h-muted); }

  main { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
  #cards { columns: 300px; column-gap: 16px; }
  .card {
    break-inside: avoid; margin-bottom: 16px; padding: 12px 14px 14px;
    background: var(--h-panel); border: 1px solid var(--h-border); border-radius: 10px;
  }
  .card h2 { font-family: var(--h-head); font-size: 14px; font-weight: 700; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { font-family: var(--h-font); font-weight: 400; font-size: 11px; color: var(--h-muted); }
  .rows { display: grid; gap: 5px; }
  .f { display: flex; align-items: center; border: 1px solid var(--h-btn-border); background: var(--h-btn); border-radius: 6px; min-width: 0; }
  .f:focus-within { border-color: var(--h-text2); }
  .f.src { box-shadow: inset 3px 0 0 var(--h-text); }
  .f input { border: 0; background: transparent; min-width: 0; width: 100%; padding: 6px 9px; outline: none; font-variant-numeric: tabular-nums; font-size: 14px; }
  .f .u {
    flex: none; width: 108px; padding: 0 9px; font-size: 12px; color: var(--h-muted); text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: copy;
  }
  .f .u:hover { color: var(--h-text); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .note { font-size: 12px; color: var(--h-muted); margin-top: 8px; line-height: 1.5; }
  .note.off { color: var(--h-amber); }
  .card.hide { display: none; }
  #none { display: none; text-align: center; color: var(--h-muted); padding: 40px; font-size: 14px; }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--h-accent); color: var(--h-on-accent); font-size: 13px; padding: 8px 14px; border-radius: 8px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 600px) { #q { width: 100%; } main { padding: 12px; } .hint { display: none; } }
</style>

<style id="hub-kit">
  :root {

    --h-font: "Mona Sans Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --h-head: "Hubot Sans Variable", var(--h-font);
    --h-bg: #f1efe9; --h-panel: #faf9f5; --h-panel2: #f4f2ec; --h-deep: #ebe8e1; --h-deep2: #e7e4dc;
    --h-border: #dedad0; --h-border2: #d3cec2; --h-btn: #ffffff; --h-btn-border: #cfcabe; --h-btn-hover: #f1eee6;
    --h-text: #18181b; --h-text2: #3f3f46; --h-muted: #6b675f; --h-muted2: #8f8a7f; --h-faint: #aaa59a; --h-code: #27272a;
    --h-accent: #18181b; --h-accent-h: #3f3f46; --h-accent2: #8f8a7f; --h-accent-bg: #e4e0d6; --h-on-accent: #ffffff; --h-strong: #09090b;
    --h-yellow: #8a5a00; --h-blue: #0b5cad; --h-blue2: #2f5597; --h-purple: #6b3fa0; --h-green2: #2e7d4f; --h-ok: #1a7f37;
    --h-green: #1a7f37; --h-red: #cf222e; --h-amber: #9a6700; --h-err-bg: #fde2e4; --h-err-bg2: #f5b8be; --h-err-text: #8b1a2b;
    --h-title-shadow: 0 2px 3px rgba(24, 24, 27, .16), 0 8px 22px rgba(24, 24, 27, .18);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --h-bg: #1e1f24; --h-panel: #26272e; --h-panel2: #2e2f37; --h-deep: #1b1c21; --h-deep2: #22232a;
    --h-border: #3a3b44; --h-border2: #3a3b46; --h-btn: #33343d; --h-btn-border: #4a4b55; --h-btn-hover: #41424d;
    --h-text: #e6e6e6; --h-text2: #b9bac2; --h-muted: #8a8b94; --h-muted2: #6f7078; --h-faint: #565761; --h-code: #d8dee9;
    --h-accent: #e6e6e6; --h-accent-h: #ffffff; --h-accent2: #8a8b94; --h-accent-bg: #3a3b44; --h-on-accent: #18181b; --h-strong: #ffffff;
    --h-yellow: #e8d3a8; --h-blue: #9ecbff; --h-blue2: #9db3d8; --h-purple: #c4a7e7; --h-green2: #a8d5b5; --h-ok: #8fd19e;
    --h-green: #3fb950; --h-red: #f85149; --h-amber: #e3b341; --h-err-bg: #5c1f2b; --h-err-bg2: #7a2938; --h-err-text: #ffb3c0;
    --h-title-shadow: 0 2px 3px rgba(0, 0, 0, .45), 0 8px 22px rgba(0, 0, 0, .5);
  }
  h1 { font-family: var(--h-head); font-weight: 800; font-stretch: 125%; letter-spacing: -.02em; text-shadow: var(--h-title-shadow); }
  h1 span, h1 em { text-shadow: inherit; color: var(--h-muted); }

  /* the theme slider: fixed top-right, no labels */
  .hub-theme { position: fixed; top: 14px; right: 16px; z-index: 9999; }
  .hub-theme button { all: unset; box-sizing: border-box; position: relative; display: block; width: 52px; height: 22px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #f1efe9, #c9c4b7 38%, #3f3f46 62%, #09090b); border: 1px solid var(--h-border2); touch-action: none; }
  .hub-theme button:focus-visible { outline: 2px solid var(--h-text); outline-offset: 3px; }
  .hub-theme i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); transition: left .4s cubic-bezier(.65, 0, .35, 1); }
  :root[data-theme="dark"] .hub-theme i { left: 32px; }
  .hub-theme.dragging i { transition: none; }
  .hub-theme.docked { position: static; flex: none; display: flex; align-items: center; margin-left: 6px; }
  [data-hub-theme-slot] { display: contents; }
  @media (prefers-reduced-motion: reduce) { .hub-theme i { transition: none; } }
  @media print { .hub-theme { display: none; } }
</style>

</head>
<body>
<header>
  <h1>Convert Studio</h1>
  <input id="q" type="search" placeholder="Find a unit, e.g. acre, mpg, crore" autocomplete="off">
  <span class="hint">Type in any box. Click a unit to copy.</span>
  <div class="spacer"></div>
  <button id="reset" title="Put every box back to its starting value">Reset</button>
  <span data-hub-theme-slot></span>
</header>
<main>
  <div id="cards"></div>
  <div id="none">Nothing matches that.</div>
</main>
<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = "convertStudio.values", RKEY = "convertStudio.rates";

  // Each unit converts to and from its group's base unit. `f` is a plain factor
  // (1 unit = f base); non-linear units give to/from functions instead.
  const lin = (sym, f, name) => ({ sym, name, to: v => v * f, from: b => b / f });
  const inv = (sym, k, name) => ({ sym, name, to: v => k / v, from: b => k / b });   // e.g. km/l ↔ l/100 km

  // ---- currency (live ECB rates, cached) ----
  const CUR = ["SEK", "INR", "USD", "EUR", "GBP", "NOK", "DKK", "CHF", "JPY", "AED"];
  const CUR_NAME = { SEK: "Swedish krona", INR: "Indian rupee", USD: "US dollar", EUR: "Euro", GBP: "British pound", NOK: "Norwegian krone", DKK: "Danish krone", CHF: "Swiss franc", JPY: "Japanese yen", AED: "UAE dirham" };
  let rates = null, rateLive = false;
  try { const r = JSON.parse(localStorage.getItem(RKEY)); if (r && r.rates && r.rates.SEK) rates = r; } catch {}
  const cur = c => ({ sym: c, name: CUR_NAME[c], to: v => rates && rates.rates[c] ? v / rates.rates[c] : NaN, from: b => rates && rates.rates[c] ? b * rates.rates[c] : NaN });

  // ---- pace: typed as m:ss ----
  const clock = s => { if (!Number.isFinite(s) || s <= 0 || s > 360000) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
  const unclock = t => { const p = t.trim().split(":").map(Number); if (p.some(n => !Number.isFinite(n))) return NaN; return p.reduce((a, n) => a * 60 + n, 0); };

  const GROUPS = [
    { id: "cur", name: "Currency", dp: 2, def: [0, "1000"], units: CUR.map(cur), note: true },
    { id: "num", name: "Big numbers", sub: "Indian and Western", def: [3, "1"], units: [
      lin("ones", 1), lin("thousand", 1e3), lin("lakh", 1e5), lin("million", 1e6), lin("crore", 1e7), lin("billion", 1e9), lin("trillion", 1e12) ] },
    { id: "len", name: "Length", def: [2, "1"], units: [
      lin("mm", .001, "millimetre"), lin("cm", .01, "centimetre"), lin("m", 1, "metre"), lin("km", 1000, "kilometre"),
      lin("in", .0254, "inch"), lin("ft", .3048, "foot feet"), lin("yd", .9144, "yard"), lin("mi", 1609.344, "mile"), lin("nmi", 1852, "nautical mile") ] },
    { id: "height", name: "Height", sub: "feet and inches", def: [0, "175"], units: [
      lin("cm", .01), lin("m", 1), { sym: "ft in", ftin: true, to: v => v, from: b => b } ] },
    { id: "area", name: "Area", def: [1, "100"], units: [
      lin("cm²", 1e-4, "square centimetre"), lin("m²", 1, "square metre sqm"), lin("ft²", .09290304, "square feet sqft"), lin("yd²", .83612736, "square yard"),
      lin("are", 100), lin("hectare", 1e4, "ha"), lin("acre", 4046.8564224), lin("km²", 1e6, "square kilometre"), lin("mi²", 2589988.110336, "square mile"),
      lin("cent", 40.468564224, "india land"), lin("gunta", 101.17141056, "guntha india land") ] },
    { id: "vol", name: "Volume", def: [1, "1"], units: [
      lin("ml", .001, "millilitre"), lin("l", 1, "litre liter"), lin("dl", .1, "decilitre"), lin("m³", 1000, "cubic metre"),
      lin("tsp", .00492892159375, "teaspoon"), lin("tbsp", .01478676478125, "tablespoon"), lin("cup (US)", .2365882365), lin("fl oz (US)", .0295735295625, "fluid ounce"),
      lin("pint (US)", .473176473), lin("gal (US)", 3.785411784, "gallon"), lin("gal (UK)", 4.54609, "imperial gallon"), lin("ft³", 28.316846592, "cubic feet") ] },
    { id: "wt", name: "Weight", def: [2, "1"], units: [
      lin("mg", 1e-6, "milligram"), lin("g", .001, "gram"), lin("kg", 1, "kilogram kilo"), lin("tonne", 1000, "ton metric"),
      lin("oz", .028349523125, "ounce"), lin("lb", .45359237, "pound"), lin("stone", 6.35029318, "st"), lin("tola", .0116638038, "india gold"), lin("troy oz", .0311034768, "gold silver") ] },
    { id: "temp", name: "Temperature", dp: 1, def: [0, "20"], units: [
      { sym: "°C", name: "celsius", to: v => v, from: b => b }, { sym: "°F", name: "fahrenheit", to: v => (v - 32) * 5 / 9, from: b => b * 9 / 5 + 32 },
      { sym: "K", name: "kelvin", to: v => v - 273.15, from: b => b + 273.15 } ] },
    { id: "spd", name: "Speed", def: [0, "100"], units: [
      lin("km/h", 1, "kmh kph"), lin("m/s", 3.6), lin("mph", 1.609344, "miles per hour"), lin("knot", 1.852, "kn") ] },
    { id: "pace", name: "Pace", sub: "type as 5:30", def: [0, "5:30"], units: [
      { sym: "min/km", pace: true, to: v => v, from: b => b }, { sym: "min/mi", pace: true, to: v => v / 1.609344, from: b => b * 1.609344 },
      inv("km/h", 3600, "speed running cycling"), inv("mph", 3600 / 1.609344) ] },
    { id: "fuel", name: "Fuel economy", def: [0, "6"], units: [
      lin("l/100 km", 1, "litres per 100"), inv("km/l", 100, "kmpl"), inv("mpg (US)", 235.214583), inv("mpg (UK)", 282.480936), inv("mil/l", 10, "swedish mil") ] },
    { id: "data", name: "Data size", def: [3, "1"], units: [
      lin("byte", 1, "B"), lin("KB", 1e3, "kilobyte"), lin("MB", 1e6, "megabyte"), lin("GB", 1e9, "gigabyte"), lin("TB", 1e12, "terabyte"),
      lin("MiB", 1048576, "mebibyte"), lin("GiB", 1073741824, "gibibyte") ] },
    { id: "net", name: "Internet speed", def: [0, "100"], units: [
      lin("Mbit/s", 1, "mbps megabit"), lin("Gbit/s", 1000, "gbps"), lin("MB/s", 8, "megabyte per second"), lin("kbit/s", .001, "kbps") ] },
    { id: "time", name: "Time", def: [2, "1"], units: [
      lin("seconds", 1), lin("minutes", 60), lin("hours", 3600), lin("days", 86400), lin("weeks", 604800), lin("months", 2629746, "avg"), lin("years", 31556952) ] },
    { id: "energy", name: "Energy", def: [0, "500"], units: [
      lin("kcal", 4184, "calorie food"), lin("kJ", 1000, "kilojoule"), lin("Wh", 3600, "watt hour"), lin("kWh", 3.6e6, "kilowatt hour electricity") ] },
    { id: "power", name: "Power", def: [1, "100"], units: [
      lin("W", 1, "watt"), lin("kW", 1000, "kilowatt"), lin("hp", 745.699872, "horsepower"), lin("hk (PS)", 735.49875, "metric horsepower") ] },
    { id: "press", name: "Pressure", sub: "tyres, weather", def: [0, "2.2"], units: [
      lin("bar", 1e5), lin("psi", 6894.757293, "pound per square inch"), lin("kPa", 1000), lin("atm", 101325), lin("hPa", 100, "mbar weather") ] },
    { id: "angle", name: "Angle", def: [0, "90"], units: [lin("degrees", Math.PI / 180, "°"), lin("radians", 1, "rad"), lin("turns", 2 * Math.PI)] },
  ];

  // ---- numbers in and out ----
  // Accepts "1 234,5", "1,234.5" and "1234.5"; shows a thin space between thousands.
  function num(s) {
    let t = String(s).replace(/[\s ]/g, "");
    if (t.includes(",") && t.includes(".")) t = t.replace(/,/g, "");
    else t = t.replace(",", ".");
    return t === "" || t === "-" || t === "." ? NaN : Number(t);
  }
  function fmt(v, dp) {
    if (!Number.isFinite(v)) return "";
    if (v === 0) return "0";
    const a = Math.abs(v);
    if (a < 1e-6 || a >= 1e15) return v.toExponential(4).replace(/\.?0+e/, "e");
    let s = dp != null ? v.toFixed(dp) : String(+v.toPrecision(7));
    if (s.includes("e")) s = v.toFixed(10).replace(/\.?0+$/, "");
    const [i, d] = s.split(".");
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (d ? "." + d : "");
  }

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} };

  // ---- build the cards ----
  const box = $("cards");
  GROUPS.forEach(g => {
    const card = document.createElement("section");
    card.className = "card";
    card.dataset.find = [g.name, g.sub, ...g.units.flatMap(u => [u.sym, u.name])].filter(Boolean).join(" ").toLowerCase();
    card.innerHTML = `<h2>${g.name}${g.sub ? `<small>${g.sub}</small>` : ""}</h2><div class="rows"></div>` + (g.note ? '<div class="note" id="rate"></div>' : "");
    const rows = card.querySelector(".rows");
    g.fields = g.units.map((u, i) => {
      if (u.ftin) {   // one row, two boxes
        const row = document.createElement("div"); row.className = "pair";
        row.innerHTML = '<label class="f"><input inputmode="decimal" autocomplete="off" aria-label="feet"><span class="u">ft</span></label><label class="f"><input inputmode="decimal" autocomplete="off" aria-label="inches"><span class="u">in</span></label>';
        rows.append(row);
        const [ft, inch] = row.querySelectorAll("input");
        [ft, inch].forEach(inp => inp.addEventListener("input", () => typed(g, i)));
        row.querySelectorAll(".u").forEach(sp => sp.onclick = () => copy(`${ft.value || 0} ft ${inch.value || 0} in`));
        return { row, ft, inch, labels: row.querySelectorAll(".f") };
      }
      const f = document.createElement("label"); f.className = "f";
      f.innerHTML = `<input inputmode="decimal" autocomplete="off" aria-label="${u.sym}"><span class="u" title="${u.name || u.sym} — click to copy">${u.sym}</span>`;
      rows.append(f);
      const inp = f.querySelector("input");
      inp.addEventListener("input", () => typed(g, i));
      f.querySelector(".u").onclick = e => { e.preventDefault(); if (inp.value) copy(`${inp.value} ${u.sym}`); };
      return { inp, labels: [f] };
    });
    box.append(card);
    const [i, v] = saved[g.id] || g.def;
    setRaw(g, i, v); run(g, i);
  });

  function setRaw(g, i, v) {
    const fl = g.fields[i];
    if (!fl) return;
    if (fl.ft) { const [a, b] = String(v).split("|"); fl.ft.value = a || ""; fl.inch.value = b || ""; }
    else fl.inp.value = v;
  }
  function raw(g, i) { const fl = g.fields[i]; return fl.ft ? fl.ft.value + "|" + fl.inch.value : fl.inp.value; }
  function typed(g, i) { saved[g.id] = [i, raw(g, i)]; store(); run(g, i); }

  // Read the box the user typed in, turn it into the base unit, write every other box.
  function run(g, i) {
    const u = g.units[i], fl = g.fields[i];
    let v;
    if (u.ftin) {
      const ft = num(fl.ft.value), inch = num(fl.inch.value);
      v = Number.isFinite(ft) || Number.isFinite(inch) ? ((ft || 0) * 12 + (inch || 0)) * .0254 : NaN;
    } else if (u.pace) v = unclock(fl.inp.value);
    else v = num(fl.inp.value);
    const base = Number.isFinite(v) ? u.to(v) : NaN;
    g.fields.forEach((f, j) => {
      f.labels.forEach(l => l.classList.toggle("src", j === i));
      if (j === i) return;
      const w = g.units[j], out = Number.isFinite(base) ? w.from(base) : NaN;
      if (w.ftin) {
        if (!Number.isFinite(out)) { f.ft.value = f.inch.value = ""; return; }
        const tot = out / .0254; let ft = Math.floor(tot / 12), inch = +(tot - ft * 12).toFixed(1);
        if (inch >= 12) { ft += 1; inch = 0; }
        f.ft.value = ft; f.inch.value = inch;
      } else if (w.pace) f.inp.value = clock(out);
      else f.inp.value = Number.isFinite(out) && out !== Infinity ? fmt(out, g.dp) : "";
    });
  }

  // ---- currency rates ----
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const curGroup = GROUPS[0];
  function rateNote() {
    const el = $("rate");
    if (!rates) { el.className = "note off"; el.textContent = "No rates yet. They load once you are online."; return; }
    const [y, m, d] = rates.date.split("-").map(Number);
    el.className = "note" + (rateLive ? "" : " off");
    el.textContent = `Rates of ${d} ${MON[m - 1]} ${y}` + (rateLive ? "" : " (saved, offline)") + (rates.rates.AED ? "" : ". AED isn't available.");
  }
  function refreshCurrency() { const [i] = saved.cur || curGroup.def; run(curGroup, i); rateNote(); }
  refreshCurrency();
  (async () => {
    const want = CUR.filter(c => c !== "EUR").join(",");
    let j = null;
    // api.frankfurter.app now 301s to frankfurter.dev without CORS headers, so ask .dev first
    for (const u of [`https://api.frankfurter.dev/v1/latest?from=EUR&to=${want}`, `https://api.frankfurter.app/latest?from=EUR&to=${want}`]) {
      try { const res = await fetch(u); if (res.ok) { j = await res.json(); break; } } catch {}
    }
    if (!j || !j.rates || !j.rates.SEK) {
      // ECB doesn't publish every currency (AED); retry without unknown ones
      try { const res = await fetch("https://api.frankfurter.dev/v1/latest?from=EUR"); if (res.ok) j = await res.json(); } catch {}
    }
    if (j && j.rates && j.rates.SEK) {
      rates = { date: j.date, rates: { EUR: 1, ...j.rates } };
      if (!rates.rates.AED && rates.rates.USD) rates.rates.AED = rates.rates.USD * 3.6725;   // dirham is pegged to the dollar
      rateLive = true;
      try { localStorage.setItem(RKEY, JSON.stringify(rates)); } catch {}
    }
    refreshCurrency();
  })();

  // ---- search ----
  $("q").addEventListener("input", e => {
    const words = e.target.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let shown = 0;
    document.querySelectorAll(".card").forEach(c => {
      const ok = words.every(w => c.dataset.find.includes(w));
      c.classList.toggle("hide", !ok); shown += ok;
    });
    $("none").style.display = shown ? "none" : "block";
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !e.target.closest?.("input")) { e.preventDefault(); $("q").focus(); }
    if (e.key === "Escape" && e.target === $("q")) { $("q").value = ""; $("q").dispatchEvent(new Event("input")); }
  });

  $("reset").onclick = () => {
    saved = {}; store();
    GROUPS.forEach(g => { g.fields.forEach((_, i) => setRaw(g, i, "")); setRaw(g, g.def[0], g.def[1]); run(g, g.def[0]); });
    toast("Back to the starting values");
  };

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied " + text); } catch { toast("Copy blocked by the browser"); }
  }
  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }
})();
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
