<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert Studio</title>
<meta name="description" content="Type a question like 175 cm in ft, 5 lakh to million or 20 c and get the answer, plus every other unit. Understands sqm, square meters, m2, typos and plurals.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--h-font); background: var(--h-bg); color: var(--h-text); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border); }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--h-muted); }
  .spacer { flex: 1; }
  button, input { font: inherit; color: var(--h-text); }
  button { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--h-btn-border); background: var(--h-btn); cursor: pointer; }
  button:hover { background: var(--h-btn-hover); }
  button.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; }

  main { flex: 1; min-height: 0; overflow: auto; padding: 9vh 24px 40px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .ask { position: relative; }
  .ask label { display: flex; align-items: center; background: var(--h-panel); border: 1px solid var(--h-border2); border-radius: 16px; padding: 6px 8px 6px 18px; box-shadow: 0 12px 34px -20px rgba(0,0,0,.3); }
  .ask label:focus-within { border-color: var(--h-text2); }
  .ask input { flex: 1; border: 0; background: none; outline: none; font-size: 22px; padding: 10px 0; min-width: 0; }
  .ask kbd { font: 11px "SF Mono", Menlo, Consolas, monospace; color: var(--h-muted); border: 1px solid var(--h-border2); border-radius: 5px; padding: 2px 6px; margin-right: 8px; }
  #sug { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 5; display: none; padding: 5px; background: var(--h-panel); border: 1px solid var(--h-border2); border-radius: 12px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.3); }
  #sug.show { display: block; }
  #sug button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 14px; }
  #sug button.on, #sug button:hover { background: var(--h-btn-hover); }
  #sug button b { font-weight: 600; min-width: 70px; }
  #sug button span { color: var(--h-muted); font-size: 12.5px; }
  #sug button em { margin-left: auto; font-style: normal; color: var(--h-faint); font-size: 11px; white-space: nowrap; }
  .eg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .answer { margin-top: 28px; min-height: 96px; }
  .answer b { display: block; font-family: var(--h-head); font-size: 56px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; overflow-wrap: anywhere; cursor: copy; }
  .answer span { color: var(--h-muted); font-size: 15px; }
  .answer span i { font-style: normal; color: var(--h-text2); }
  .answer .no { font-size: 15px; color: var(--h-muted); line-height: 1.6; }
  .answer .no b { display: inline; font: inherit; color: var(--h-text); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .table { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .table div { background: var(--h-panel); border: 1px solid var(--h-border); border-radius: 10px; padding: 9px 12px; font-size: 13px; color: var(--h-text2); display: flex; justify-content: space-between; gap: 8px; cursor: copy; }
  .table div b { font-variant-numeric: tabular-nums; color: var(--h-text); font-weight: 600; text-align: right; }
  h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--h-muted); margin: 28px 0 8px; display: flex; justify-content: space-between; align-items: center; }
  h3 button { font-size: 11px; padding: 2px 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .hist button { display: flex; width: 100%; justify-content: space-between; text-align: left; border: 0; background: none; padding: 7px 4px; font-size: 13px; color: var(--h-text2); border-radius: 6px; }
  .hist button:hover { background: var(--h-panel); }
  .hist button b { color: var(--h-text); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* every unit, by group, so nothing is hidden behind the box */
  #all { display: none; margin-top: 6px; }
  #all.show { display: block; }
  .grp { padding: 10px 0; border-top: 1px solid var(--h-border); }
  .grp h4 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .grp h4 small { color: var(--h-muted); font-weight: 400; margin-left: 6px; }
  .units { display: flex; flex-wrap: wrap; gap: 5px; }
  .units button { font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .units button small { color: var(--h-muted); margin-left: 4px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; background: var(--h-accent); color: var(--h-on-accent); font-size: 13px; padding: 8px 14px; border-radius: 8px; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .seg { display: flex; border: 1px solid var(--h-btn-border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; font-size: 13px; }
  .seg button.on { background: var(--h-accent); color: var(--h-on-accent); }
  .browseWrap { max-width: 920px; margin: -6vh auto 0; display: grid; grid-template-columns: 180px 1fr; gap: 24px; }
  #rail button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
  #rail button.on { background: var(--h-accent); color: var(--h-on-accent); }
  .amount { display: flex; align-items: baseline; gap: 12px; background: var(--h-panel); border: 1px solid var(--h-border2); border-radius: 16px; padding: 10px 18px; }
  .amount input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-family: var(--h-head); font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .amount span { font-size: 18px; color: var(--h-muted); }
  .pane .units { margin-top: 10px; }
  .pane .units button.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); }
  .pane .answer { margin-top: 18px; min-height: 0; }
  @media (max-width: 700px) { .browseWrap { grid-template-columns: 1fr; margin-top: 0; } #rail { display: flex; flex-wrap: wrap; gap: 4px; } #rail button { width: auto; } }
  @media (max-width: 600px) { main { padding: 24px 14px 40px; } .answer b { font-size: 40px; } .ask input { font-size: 18px; } }
</style>

    --h-bg: #f1efe9; --h-panel: #faf9f5; --h-panel2: #f4f2ec; --h-deep: #ebe8e1; --h-deep2: #e7e4dc;

    --h-text: #18181b; --h-text2: #3f3f46; --h-muted: #6b675f; --h-muted2: #8f8a7f; --h-faint: #aaa59a; --h-code: #27272a;
    --h-accent: #18181b; --h-accent-h: #3f3f46; --h-accent2: #8f8a7f; --h-accent-bg: #e4e0d6; --h-on-accent: #ffffff; --h-strong: #09090b;
    --h-yellow: #8a5a00; --h-blue: #0b5cad; --h-blue2: #2f5597; --h-purple: #6b3fa0; --h-green2: #2e7d4f; --h-ok: #1a7f37;
    --h-green: #1a7f37; --h-red: #cf222e; --h-amber: #9a6700; --h-err-bg: #fde2e4; --h-err-bg2: #f5b8be; --h-err-text: #8b1a2b;

  :root[data-theme="dark"] {

    --h-text: #e6e6e6; --h-text2: #b9bac2; --h-muted: #8a8b94; --h-muted2: #6f7078; --h-faint: #565761; --h-code: #d8dee9;
    --h-accent: #e6e6e6; --h-accent-h: #ffffff; --h-accent2: #8a8b94; --h-accent-bg: #3a3b44; --h-on-accent: #18181b; --h-strong: #ffffff;
    --h-yellow: #e8d3a8; --h-blue: #9ecbff; --h-blue2: #9db3d8; --h-purple: #c4a7e7; --h-green2: #a8d5b5; --h-ok: #8fd19e;
    --h-green: #3fb950; --h-red: #f85149; --h-amber: #e3b341; --h-err-bg: #5c1f2b; --h-err-bg2: #7a2938; --h-err-text: #ffb3c0;
    --h-title-shadow: 0 2px 3px rgba(0, 0, 0, .45), 0 8px 22px rgba(0, 0, 0, .5);
  }
  h1 { font-family: var(--h-head); font-weight: 800; font-stretch: 125%; letter-spacing: -.02em; text-shadow: var(--h-title-shadow); }
  h1 span, h1 em { text-shadow: inherit; color: var(--h-muted); }

  /* the theme slider: fixed top-right, no labels */
  .hub-theme { position: fixed; top: 14px; right: 16px; z-index: 9999; }
  .hub-theme button { all: unset; box-sizing: border-box; position: relative; display: block; width: 52px; height: 22px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #f1efe9, #c9c4b7 38%, #3f3f46 62%, #09090b); border: 1px solid var(--h-border2); touch-action: none; }
  .hub-theme button:focus-visible { outline: 2px solid var(--h-text); outline-offset: 3px; }
  .hub-theme i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); transition: left .4s cubic-bezier(.65, 0, .35, 1); }
  :root[data-theme="dark"] .hub-theme i { left: 32px; }
  .hub-theme.dragging i { transition: none; }
  .hub-theme.docked { position: static; flex: none; display: flex; align-items: center; margin-left: 6px; }

<body>
<header><h1>Convert Studio</h1><div class="seg" id="seg"><button data-mode="ask" class="on">Ask</button><button data-mode="browse">Browse</button></div><span class="sub" id="subtitle">Type it the way you'd say it</span><div class="spacer"></div><button id="browse" class="chip">All units</button><span data-hub-theme-slot></span>  <span data-hub-theme-slot></span>
</header>
<main><div class="wrap" id="wrapAsk">
  <div class="ask">
    <label><input id="q" placeholder="175 cm in ft   ·   100 sqm to sq ft   ·   5 lakh in million   ·   20 c" autocomplete="off" autofocus><kbd>/</kbd></label>
    <div id="sug"></div>
  </div>
  <div class="eg" id="eg"></div>
  <div class="answer" id="ans"></div>
  <div class="table" id="table"></div>
  <div id="all"></div>
  <h3 id="hh" style="display:none">Earlier <button id="hx">Clear</button></h3>
  <div class="hist" id="hist"></div>
</div>
<div class="browseWrap" id="wrapBrowse" style="display:none">
  <nav id="rail"></nav>
  <div class="pane">
    <div class="amount"><input id="bq" inputmode="decimal" autocomplete="off" value="1"><span id="bsym"></span></div>
    <div class="units" id="bunits"></div>
    <div class="answer" id="bans"></div>
    <div class="table" id="btable"></div>
  </div>
</div></main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = "convertStudio.values", RKEY = "convertStudio.rates";
  // Each unit converts to and from its group's base unit. `f` is a plain factor
  // (1 unit = f base); non-linear units give to/from functions instead.
  const lin = (sym, f, name) => ({ sym, name, to: v => v * f, from: b => b / f });
  const inv = (sym, k, name) => ({ sym, name, to: v => k / v, from: b => k / b });   // e.g. km/l ↔ l/100 km

  // ---- currency (live ECB rates, cached) ----
  const CUR = ["SEK", "INR", "USD", "EUR", "GBP", "NOK", "DKK", "CHF", "JPY", "AED"];
  const CUR_NAME = { SEK: "Swedish krona", INR: "Indian rupee", USD: "US dollar", EUR: "Euro", GBP: "British pound", NOK: "Norwegian krone", DKK: "Danish krone", CHF: "Swiss franc", JPY: "Japanese yen", AED: "UAE dirham" };
  let rates = null, rateLive = false;
  try { const r = JSON.parse(localStorage.getItem(RKEY)); if (r && r.rates && r.rates.SEK) rates = r; } catch {}
  const cur = c => ({ sym: c, name: CUR_NAME[c], to: v => rates && rates.rates[c] ? v / rates.rates[c] : NaN, from: b => rates && rates.rates[c] ? b * rates.rates[c] : NaN });

  // ---- pace: typed as m:ss ----
  const clock = s => { if (!Number.isFinite(s) || s <= 0 || s > 360000) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
  const unclock = t => { const p = t.trim().split(":").map(Number); if (p.some(n => !Number.isFinite(n))) return NaN; return p.reduce((a, n) => a * 60 + n, 0); };

  const GROUPS = [
    { id: "cur", name: "Currency", dp: 2, def: [0, "1000"], units: CUR.map(cur), note: true },
    { id: "num", name: "Big numbers", sub: "Indian and Western", def: [3, "1"], units: [
      lin("ones", 1), lin("thousand", 1e3), lin("lakh", 1e5), lin("million", 1e6), lin("crore", 1e7), lin("billion", 1e9), lin("trillion", 1e12) ] },
    { id: "len", name: "Length", def: [2, "1"], units: [
      lin("mm", .001, "millimetre"), lin("cm", .01, "centimetre"), lin("m", 1, "metre"), lin("km", 1000, "kilometre"),
      lin("in", .0254, "inch"), lin("ft", .3048, "foot feet"), lin("yd", .9144, "yard"), lin("mi", 1609.344, "mile"), lin("nmi", 1852, "nautical mile") ] },
    { id: "height", name: "Height", sub: "feet and inches", def: [0, "175"], units: [
      lin("cm", .01), lin("m", 1), { sym: "ft in", ftin: true, to: v => v, from: b => b } ] },
    { id: "area", name: "Area", def: [1, "100"], units: [
      lin("cm²", 1e-4, "square centimetre"), lin("m²", 1, "square metre sqm"), lin("ft²", .09290304, "square feet sqft"), lin("yd²", .83612736, "square yard"),
      lin("are", 100), lin("hectare", 1e4, "ha"), lin("acre", 4046.8564224), lin("km²", 1e6, "square kilometre"), lin("mi²", 2589988.110336, "square mile"),
      lin("cent", 40.468564224, "india land"), lin("gunta", 101.17141056, "guntha india land") ] },
    { id: "vol", name: "Volume", def: [1, "1"], units: [
      lin("ml", .001, "millilitre"), lin("l", 1, "litre liter"), lin("dl", .1, "decilitre"), lin("m³", 1000, "cubic metre"),
      lin("tsp", .00492892159375, "teaspoon"), lin("tbsp", .01478676478125, "tablespoon"), lin("cup (US)", .2365882365), lin("fl oz (US)", .0295735295625, "fluid ounce"),
      lin("pint (US)", .473176473), lin("gal (US)", 3.785411784, "gallon"), lin("gal (UK)", 4.54609, "imperial gallon"), lin("ft³", 28.316846592, "cubic feet") ] },
    { id: "wt", name: "Weight", def: [2, "1"], units: [
      lin("mg", 1e-6, "milligram"), lin("g", .001, "gram"), lin("kg", 1, "kilogram kilo"), lin("tonne", 1000, "ton metric"),
      lin("oz", .028349523125, "ounce"), lin("lb", .45359237, "pound"), lin("stone", 6.35029318, "st"), lin("tola", .0116638038, "india gold"), lin("troy oz", .0311034768, "gold silver") ] },
    { id: "temp", name: "Temperature", dp: 1, def: [0, "20"], units: [
      { sym: "°C", name: "celsius", to: v => v, from: b => b }, { sym: "°F", name: "fahrenheit", to: v => (v - 32) * 5 / 9, from: b => b * 9 / 5 + 32 },
      { sym: "K", name: "kelvin", to: v => v - 273.15, from: b => b + 273.15 } ] },
    { id: "spd", name: "Speed", def: [0, "100"], units: [
      lin("km/h", 1, "kmh kph"), lin("m/s", 3.6), lin("mph", 1.609344, "miles per hour"), lin("knot", 1.852, "kn") ] },
    { id: "pace", name: "Pace", sub: "type as 5:30", def: [0, "5:30"], units: [
      { sym: "min/km", pace: true, to: v => v, from: b => b }, { sym: "min/mi", pace: true, to: v => v / 1.609344, from: b => b * 1.609344 },
      inv("km/h", 3600, "speed running cycling"), inv("mph", 3600 / 1.609344) ] },
    { id: "fuel", name: "Fuel economy", def: [0, "6"], units: [
      lin("l/100 km", 1, "litres per 100"), inv("km/l", 100, "kmpl"), inv("mpg (US)", 235.214583), inv("mpg (UK)", 282.480936), inv("mil/l", 10, "swedish mil") ] },
    { id: "data", name: "Data size", def: [3, "1"], units: [
      lin("byte", 1, "B"), lin("KB", 1e3, "kilobyte"), lin("MB", 1e6, "megabyte"), lin("GB", 1e9, "gigabyte"), lin("TB", 1e12, "terabyte"),
      lin("MiB", 1048576, "mebibyte"), lin("GiB", 1073741824, "gibibyte") ] },
    { id: "net", name: "Internet speed", def: [0, "100"], units: [
      lin("Mbit/s", 1, "mbps megabit"), lin("Gbit/s", 1000, "gbps"), lin("MB/s", 8, "megabyte per second"), lin("kbit/s", .001, "kbps") ] },
    { id: "time", name: "Time", def: [2, "1"], units: [
      lin("seconds", 1), lin("minutes", 60), lin("hours", 3600), lin("days", 86400), lin("weeks", 604800), lin("months", 2629746, "avg"), lin("years", 31556952) ] },
    { id: "energy", name: "Energy", def: [0, "500"], units: [
      lin("kcal", 4184, "calorie food"), lin("kJ", 1000, "kilojoule"), lin("Wh", 3600, "watt hour"), lin("kWh", 3.6e6, "kilowatt hour electricity") ] },
    { id: "power", name: "Power", def: [1, "100"], units: [
      lin("W", 1, "watt"), lin("kW", 1000, "kilowatt"), lin("hp", 745.699872, "horsepower"), lin("hk (PS)", 735.49875, "metric horsepower") ] },
    { id: "press", name: "Pressure", sub: "tyres, weather", def: [0, "2.2"], units: [
      lin("bar", 1e5), lin("psi", 6894.757293, "pound per square inch"), lin("kPa", 1000), lin("atm", 101325), lin("hPa", 100, "mbar weather") ] },
    { id: "angle", name: "Angle", def: [0, "90"], units: [lin("degrees", Math.PI / 180, "°"), lin("radians", 1, "rad"), lin("turns", 2 * Math.PI)] },
  ];

  // ---- numbers in and out ----
  // Accepts "1 234,5", "1,234.5" and "1234.5"; shows a thin space between thousands.
  function num(s) {
    let t = String(s).replace(/[\s ]/g, "");
    if (t.includes(",") && t.includes(".")) t = t.replace(/,/g, "");
    else t = t.replace(",", ".");
    return t === "" || t === "-" || t === "." ? NaN : Number(t);
  }
  function fmt(v, dp) {
    if (!Number.isFinite(v)) return "";
    if (v === 0) return "0";
    const a = Math.abs(v);
    if (a < 1e-6 || a >= 1e15) return v.toExponential(4).replace(/\.?0+e/, "e");
    let s = dp != null ? v.toFixed(dp) : String(+v.toPrecision(7));
    if (s.includes("e")) s = v.toFixed(10).replace(/\.?0+$/, "");
    const [i, d] = s.split(".");
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (d ? "." + d : "");
  }

  // ---------- understanding what someone types ----------
  // Every unit gets a set of spellings: its symbol, its name words, and common ways
  // people write it. Input is boiled down the same way, then matched exactly, by
  // prefix, or with a typo or two.
  const EXTRA = {
    "°C": ["c", "celsius", "centigrade", "degc", "degreesc", "degreescelsius", "celcius"], "°F": ["f", "fahrenheit", "degf", "degreesf", "degreesfahrenheit", "farenheit"], "K": ["kelvin"],

    $("rail").innerHTML = GROUPS.map(x => `<button class="${x === g ? "on" : ""}" data-g="${x.id}">${esc(x.name)}</button>`).join("");
    $("rail").querySelectorAll("button").forEach(b => b.onclick = () => { B.g = b.dataset.g; B.u = null; B.v = (GROUPS.find(x => x.id === B.g).def || [0, "1"])[1]; bsave(); drawBrowse(); });
    $("bunits").innerHTML = us.map(x => `<button class="${x === u ? "on" : ""}" data-u="${esc(x.sym)}">${esc(x.sym)}${x.name ? `<small>${esc(x.name.split(" ")[0])}</small>` : ""}</button>`).join("");
    $("bunits").querySelectorAll("button").forEach(b => b.onclick = () => { B.u = b.dataset.u; bsave(); drawBrowse(); });
    $("bsym").textContent = u.sym; if ($("bq").value !== B.v) $("bq").value = B.v;
    const v = u.pace ? unclock(B.v) : num(B.v);
    if (!Number.isFinite(v)) { $("bans").innerHTML = ""; $("btable").innerHTML = ""; return; }
    const base = u.to(v), rest = us.filter(x => x !== u).map(x => ({ u: x, v: x.from(base) }));
    const want = PARTNER[u.sym], i = want ? rest.findIndex(o => o.u.sym === want) : -1;
    if (i > 0) rest.unshift(rest.splice(i, 1)[0]);
    const main = rest[0], big = g.id === "len" && main.u.sym === "ft" ? feetIn(base) : show(main.u, main.v, g.dp) + " " + main.u.sym;
    $("bans").innerHTML = `<b title="Copy">${esc(big)}</b><span><i>${esc(show(u, v, g.dp))} ${esc(u.sym)}</i> · ${esc(g.name)}${g.id === "cur" && rates ? " · ECB rates of " + rates.date : ""}</span>`;
    $("bans").querySelector("b").onclick = () => copy(big);
    $("btable").innerHTML = rest.slice(1).map(o => `<div title="Copy"><span>${esc(o.u.sym)}</span><b>${show(o.u, o.v, g.dp)}</b></div>`).join("");
    $("btable").querySelectorAll("div").forEach(d => d.onclick = () => copy(d.querySelector("b").textContent + " " + d.querySelector("span").textContent));
  }
  $("bq").addEventListener("input", () => { B.v = $("bq").value; bsave(); drawBrowse(); });
  let mode = "ask";
  try { mode = localStorage.getItem(KEY + ".mode") || "ask"; } catch {}
  function setMode(m) {
    mode = m; try { localStorage.setItem(KEY + ".mode", m); } catch {}
    $("seg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    $("wrapAsk").style.display = m === "ask" ? "" : "none"; $("wrapBrowse").style.display = m === "browse" ? "" : "none";
    $("browse").style.display = m === "ask" ? "" : "none";
    $("subtitle").textContent = m === "ask" ? "Type it the way you'd say it" : "Pick a unit, see it in every other";
    if (m === "browse") drawBrowse(); else $("q").focus();
  }
  $("seg").querySelectorAll("button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setMode(mode);

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied " + text); } catch { toast("Copy blocked by the browser"); } }

  // rates
  (async () => {
    for (const u of ["https://api.frankfurter.dev/v1/latest?from=EUR&to=" + CUR.filter(c => c !== "EUR").join(","), "https://api.frankfurter.dev/v1/latest?from=EUR"]) {
      try { const r = await fetch(u); if (!r.ok) continue; const j = await r.json(); if (!j.rates || !j.rates.SEK) continue;
        rates = { date: j.date, rates: { EUR: 1, ...j.rates } }; if (!rates.rates.AED && rates.rates.USD) rates.rates.AED = rates.rates.USD * 3.6725;
        rateLive = true; try { localStorage.setItem(RKEY, JSON.stringify(rates)); } catch {} break; } catch {}
    }
    run(false); if (mode === "browse") drawBrowse();
  })();
  const url = new URLSearchParams(location.search).get("q");
  if (url) $("q").value = url;
  run(false); drawHist();
  window.convert = { parse, findUnit, canon };
})();
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
<!-- /studio-hub theme slider -->
