<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Hub — single-file browser tools</title>
<meta name="description" content="Small tools that run in your browser. No install, no accounts, nothing leaves your machine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318181b' stroke-width='2' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7.5' height='7.5' rx='2'/%3E%3Crect x='13.5' y='3' width='7.5' height='7.5' rx='2'/%3E%3Crect x='3' y='13.5' width='7.5' height='7.5' rx='2'/%3E%3Crect x='13.5' y='13.5' width='7.5' height='7.5' rx='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: var(--h-bg); --panel: var(--h-panel); --panel-h: #ffffff; --border: var(--h-border); --text: var(--h-text); --muted: var(--h-muted); --muted2: var(--h-muted2);
    /* the line figures: one stroke in four weights, on the card's own colour */
    --hairline-hi: #18181b; --hairline-edge: #85806f; --hairline-mid: #aea89a; --hairline-lo: #d8d3c7; --hairline-stroke: 1;
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --panel: #18181b; --panel-h: #1f1f23; --border: #27272a; --text: #e4e4e7; --muted: #8b8b94; --muted2: #5d5d66;
    --hairline-hi: #f4f4f5; --hairline-edge: #8b8b94; --hairline-mid: #5b5b64; --hairline-lo: #34343b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: var(--h-font); background: var(--bg); color: var(--text); padding: 8vh 24px 48px; transition: background-color .4s, color .4s; --hairline-plate: var(--panel); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  h1 { font-size: 40px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  /* three big cards: the tools reached for daily, each with its line figure */
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px 22px 20px; min-height: 230px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
    transition: transform .15s ease, border-color .15s ease, background-color .15s ease; --hairline-plate: var(--panel);
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--text); background: var(--panel-h); --hairline-plate: var(--panel-h); }
  .tile:focus-visible, .small a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .tile .fig { display: block; margin: -16px -18px -18px; }
  .fig svg :is(path, ellipse, polygon) { transition: stroke 260ms cubic-bezier(.5, 0, .1, 1), fill .15s ease; }
  .txt b { display: block; font-family: var(--h-head); font-stretch: 112%; font-weight: 700; font-size: 18px; }
  .txt b em { font-style: normal; font-weight: 600; color: var(--muted); }
  .txt small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 3px; }
  /* the rest: small, quiet, one line each */
  .small { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .small a { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; transition: border-color .15s, background-color .15s; }
  .small a:hover { border-color: var(--text); background: var(--panel-h); }
  .small svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--text); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .small span { min-width: 0; }
  .small b { font-family: var(--h-head); font-stretch: 112%; font-weight: 700; font-size: 14px; display: block; }
  .small small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small a.dim { opacity: .55; border-style: dashed; background: transparent; }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted2); }
  footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  @media (max-width: 700px) {
    body { padding-top: 6vh; } h1 { font-size: 34px; }
    .big { grid-template-columns: 1fr; } .tile { min-height: 0; padding: 18px 16px 16px; gap: 10px; } .tile .fig { margin: -14px -12px -8px; }
    .small { grid-template-columns: 1fr 1fr; }
  }
</style>

<!-- line figures: the Hairline kernel (unchanged, @lucasmarkes/hairline), one module per tool, then the mount -->
<script id="hl-kernel">
/* hairline kernel sha256:346b48bdef2cdfafd5343eba01494255cf75f9c078e6fcd1aafc62bab62980a1 */
/*
 * HL: everything a figure may call. Read this index; the code under it is the
 * package's src/core, unchanged, and a figure should not need to read it.
 *
 * Every figure is drawn in a 400 × 320 viewBox. World space is x/y on the
 * ground and z up. Plates are filled with the ground colour and painted back
 * to front, so a nearer one covers a farther one: append in that order. At
 * the default camera, Cam(45, 0.5, S), +x runs down to the right and +y down
 * to the left, so the corner with the largest x and y is nearest the viewer:
 * append by ascending x + y, from the far corner (smallest x and y) to it.
 *
 * Camera
 *   Cam(azDeg, k, S)                       a camera: azimuth in degrees, k = sin(elevation) (0.5 is the 2:1 view), S = scale
 *   fit(C, points, cx, cy)                 centres the box of [x, y, z] points on (cx, cy); call it once, before proj
 *                                          it only centres, it never scales: choose S by trying values, with the most extreme pose in points.
 *                                          The six figures use S 1.42 to 2.12; the boxes they fit come out 230 to 310 wide and 180 to 245 tall
 *   proj(C)                                returns P(x, y, z), which gives [sx, sy]
 *   unproj(C, sx, sy, z)                   the world [x, y] under a screen point, on the plane at height z
 *   facing(C)                              returns front(sample): whether a ring sample faces the camera
 * Rounded solids
 *   rrect(u0, v0, u1, v1, r, n)            a rounded rectangle, as a ring of samples {u, v, nu, nv}
 *   circ(R, n)                             a circle, as a ring
 *   rings(x0, y0, x1, y1, r, b)            [ring, inner]: a rounded footprint and its crease ring, inset by b
 *                                          r, the corner radius, is cut to half the shorter side. b, the crease's inset in world units
 *                                          (0.6 to 2.2 in the figures), must stay under half the shorter side or the crease turns inside out
 *   prism(P, front, ring, inner, z0, z1)   {sil, crease}: a solid standing from z0 to z1, as two path strings
 *   ringAt(P, ring, z)                     the ring's points, projected at height z
 *   run(ring, keep)                        the one cyclic run of samples that pass keep
 *   hull(points)                           the convex hull of screen points
 *   extremes(P, ring)                      [left, right, nearest] samples: where dashed drops fall from
 *   fillet(points, radii, n)               rounds every vertex of a closed polygon; returns the new points
 *                                          radii is an array, one radius per vertex, each cut to half its shorter edge; a single number gives NaN.
 *                                          n is the steps round each corner, default 4: each vertex becomes n + 1 points
 *   ghost(P, front, ring, z0, depth)       a reflection's path {d, y0, y1}; reflect() draws it for you
 * Paths and numbers
 *   poly(points)                           a closed path string
 *   open(points)                           an open polyline string
 *   seg(a, b)                              one segment between two screen points [sx, sy], as its own subpath; project world points with P first
 *   clamp(v, a, b)
 *   lerp(a, b, t)
 *   rad(deg)
 *   r2(n)                                  two decimals
 * The continuous clock: one spring per moving number
 *   spring(x, opts)                        at rest on x; write .t to retarget; opts {k, c, m, eps}, default k 100, c 18, m 1
 *   stepS(sp, dt)                          advances by dt seconds; returns whether it is still moving
 * The discrete clock: a 700ms tween on (.32, .72, 0, 1)
 *   tween(v, dur)                          at rest on v; dur defaults to 700 (ms)
 *   tset(tw, to, now, delay)               retargets from where it is, after delay ms: the stagger
 *                                          the same target again does nothing, so calling it on every pointer move is safe
 *   tval(tw, now)                          its value at now
 *   tdone(tw, now)                         whether it has landed
 *   bezier(x1, y1, x2, y2)                 a CSS cubic-bezier, as a function of progress
 *   EASE_LIFT                              the lift curve itself
 *   reducedMotion()                        true when the reader asked for less motion; springs and tweens already land at once
 *   setReducedMotion(on)                   the loop's business, not a figure's
 * Drawing
 *   mk(tag, attrs, parent)                 one svg element: the only way a figure makes a node
 *   solid(parent)                          {g, sil, cr}: a group holding a silhouette path and a crease path
 *   put(solid, paths)                      writes prism()'s {sil, crease} into solid()'s {sil, cr}: sil into sil, crease into cr
 *   flatDot(parent, C, r, cls)             a dot lying on the ground plane; cls is "dot", "dot m" or "dot off"
 *   place(el, point)                       moves a dot or a circle to [sx, sy]
 *   reflect(svg, parent, P, front, ring, z0, depth)   a fading mirror under a solid
 *   fade(svg, y0, y1, a0)                  a vertical fade, as a mask; returns the value for a mask attribute
 * Life
 *   register(stage, tick)                  joins the one frame loop; tick(dt in seconds, now in ms) returns true to ask for another frame; gives {wake, unregister}

  }

  bag.add(pointer(stage, { move: (p) => to(p[0]), leave: () => to(null) }));
  bag.add(() => svg.replaceChildren());
  read.textContent = "rest";

  return {
    set: (v) => { SWEEP = v; if (px != null) to(px); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "time",
  means: "Three desk clocks on a rail, one instant in three cities: the pointer turns the hour and all the hands follow.",
  rules: [1, 4, 5, 8],
  range: [6, 12, 24],
  tour: [[90, 160], [330, 160], [230, 160], null],
  mount,

</script>
<script type="module">
  // Mount one figure on its own stage, the way the package's mount does: the host, the svg, a read-out.
  const mount = (el, fig) => {
    HL.inject(document);
    el.setAttribute("data-hairline", fig.name);
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", fig.means);
    const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, el);
    let text = null;
    const read = { get textContent() { return text; }, set textContent(v) { text = v == null ? "" : String(v); el.dataset.read = text; } };
    fig.mount({ stage: el, svg, read }, fig.range[1]);
    if (text === null) read.textContent = "rest";
  };
  document.querySelectorAll(".fig[data-fig]").forEach((el) => {
    const fig = window.FIGS[el.dataset.fig];
    if (fig) mount(el, fig);
  });

  // Pointing anywhere on a card moves its figure: over the figure the pointer is its own;
  // over the name, it is passed on at the same x, at the height of the figure's first stop.
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".tile").forEach((tile) => {
    const stage = tile.querySelector(".fig"), fig = stage && window.FIGS[stage.dataset.fig];
    if (!fig || still) return;
    const home = (fig.tour || []).find(Boolean) || [200, 160];
    const send = (type, e) => {
      const r = stage.getBoundingClientRect();
      stage.dispatchEvent(new PointerEvent(type, {
        pointerType: "mouse", pointerId: 1, bubbles: false,
        clientX: Math.min(r.right - 1, Math.max(r.left + 1, e.clientX)), clientY: r.top + (home[1] / 320) * r.height,
      }));
    };
    tile.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && !stage.contains(e.target)) send("pointermove", e); });
    tile.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") send("pointerleave", e); });
  });
</script>

<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
<!-- /studio-hub theme slider -->
