<style>
  :root {
    --bg: var(--h-bg); --panel: var(--h-panel); --panel-h: #ffffff; --border: var(--h-border); --text: var(--h-text); --muted: var(--h-muted); --muted2: var(--h-muted2);
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --panel: #18181b; --panel-h: #1f1f23; --border: #27272a; --text: #e4e4e7; --muted: #8b8b94; --muted2: #5d5d66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: var(--h-font); background: var(--bg); color: var(--text); padding: 8vh 24px 48px; transition: background-color .4s, color .4s; }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 40px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
  .search:focus-within { border-color: var(--text); }
  .search svg { width: 20px; height: 20px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; }
  .search kbd { font: inherit; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; }
  /* your usual: the tools you open most, one quiet row */
  .usual { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 13px; }
  .usual span { color: var(--muted); margin-right: 2px; }
  .usual a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); transition: border-color .15s; }
  .usual a:hover { border-color: var(--text); }
  .usual svg { width: 16px; height: 16px; }
  /* shelves: one per group, every description in full */
  .shelf { margin-top: 30px; }
  .shelf h2 { font-family: var(--h-head); font-stretch: 112%; font-size: 16px; font-weight: 700; }
  .shelf h2 + p { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); transition: border-color .15s, background-color .15s, transform .15s; }
  .card:hover { border-color: var(--text); background: var(--panel-h); transform: translateY(-1px); }
  .card .ic { width: 36px; height: 36px; border-radius: 9px; background: var(--h-deep); display: grid; place-items: center; flex: none; }
  .card .ic svg { width: 20px; height: 20px; }
  .card b { display: block; font-family: var(--h-head); font-stretch: 112%; font-weight: 700; font-size: 14px; }
  .card small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 1px; }
  .card.dim { border-style: dashed; background: transparent; }
  .local { font: 500 11px var(--h-font); font-style: normal; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
  .none { color: var(--muted); margin-top: 24px; }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted2); }
  footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  @media (max-width: 700px) {
    body { padding: 6vh 16px 40px; } h1 { font-size: 34px; }
    .search kbd { display: none; }
  }
</style>

<script>
  // "Your usual" is the tools you open most from this page, counted in this browser only.
  // Each open's weight halves every 30 days, so a tool you stop using drops out of the row.
  // Until there is enough history the empty places go to Snap, PDF and Transcribe.
  const DEFAULT_USUAL = ["snap", "pdf", "transcribe"];
  const USE_KEY = "hubUses", HALF_LIFE = 30 * 864e5;
  const uses = (() => { try { return JSON.parse(localStorage.getItem(USE_KEY)) || {}; } catch (e) { return {}; } })();
  const score = (id) => (uses[id] || []).reduce((s, at) => s + Math.pow(0.5, (Date.now() - at) / HALF_LIFE), 0);
  const ranked = TOOLS.filter((t) => !t.dim && score(t.id) > 0).sort((a, b) => score(b.id) - score(a.id)).map((t) => t.id);
  const USUAL = [...new Set([...ranked, ...DEFAULT_USUAL])].slice(0, 4);
  const GROUP_COPY = {
    "Screenshots and images": "For a picture or screenshot you already have",
    "Documents": "PDFs, letters and anything you print",
    "Text and code": "Writing, comparing, diagrams and code",
    "Everyday": "Small helpers for every day",
    "Make things": "Make something new: art, avatars, wallpapers",
  };
  const icon = (t) => `<svg viewBox="0 0 24 24" aria-hidden="true">${t.glyph}</svg>`;
  const LOCAL = ' title="Needs a local Python runner: clone the repo and run code-studio.command"';
  document.getElementById("usual").innerHTML = "<span>Your usual</span>" + USUAL.map((id) => TOOLS.find((t) => t.id === id)).map((t) =>
    `<a href="${t.page}" data-id="${t.id}">${icon(t)}${t.name}</a>`).join("");
  document.getElementById("shelves").innerHTML = GROUPS.map((g) =>
    `<section class="shelf"><h2>${g}</h2><p>${GROUP_COPY[g] || ""}</p><div class="cards">` +
    TOOLS.filter((t) => t.group === g).map((t) =>
      `<a class="card${t.dim ? " dim" : ""}" href="${t.page}" data-id="${t.id}"${t.dim ? LOCAL : ""}><span class="ic">${icon(t)}</span>` +
      `<span><b>${t.name}${t.dim ? '<i class="local">runs locally</i>' : ""}</b><small>${t.blurb}</small></span></a>`).join("") +
    `</div></section>`).join("");

  // Search: every word must appear in the tool's name, description or group. Enter opens the first match.
  const q = document.getElementById("q");
  const haystack = Object.fromEntries(TOOLS.map((t) => [t.id, [t.name, t.blurb, t.group, GROUP_COPY[t.group]].join(" ").toLowerCase()]));
  q.addEventListener("input", () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let any = false;
    document.querySelectorAll(".shelf").forEach((sh) => {
      let n = 0;
      sh.querySelectorAll(".card").forEach((c) => { const hit = words.every((w) => haystack[c.dataset.id].includes(w)); c.hidden = !hit; n += hit; });
      sh.hidden = !n; any ||= n > 0;
    });
    document.getElementById("usual").hidden = words.length > 0;
    document.getElementById("none").hidden = any;
  });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") document.querySelector(".card:not([hidden])")?.click(); });
  addEventListener("keydown", (e) => {
    if (e.key === "/" && !e.target.closest("input, textarea")) { e.preventDefault(); q.focus(); }
  });
  // Count every open from here (left, middle or Ctrl-click). Last 50 opens per tool are kept.
  const record = (e) => {
    const a = e.target.closest("a[data-id]");
    if (!a || (e.type === "auxclick" && e.button !== 1)) return;
    uses[a.dataset.id] = [...(uses[a.dataset.id] || []), Date.now()].slice(-50);
    try { localStorage.setItem(USE_KEY, JSON.stringify(uses)); } catch (err) {}
  };
  document.addEventListener("click", record);
  document.addEventListener("auxclick", record);
</script>

<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
<!-- /studio-hub theme slider -->
</body>
