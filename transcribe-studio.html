<meta name="description" content="Drop in a recording or a video and get its words back as text or subtitles. Whisper large-v3-turbo runs in your browser on the GPU; nothing is uploaded.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--h-font);
    background: var(--h-bg); color: var(--h-text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 22px; background: var(--h-border); margin: 0 4px; }
  .spacer { flex: 1; }
  button, select {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); color: var(--h-text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  select { padding: 5px 8px; }
  button:hover { background: var(--h-btn-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); font-weight: 600; }
  button.primary:hover { background: var(--h-accent-h); }
  button.rec { background: var(--h-red); border-color: var(--h-red); color: var(--h-strong); }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  kbd { font: 10px "SF Mono", Menlo, Consolas, monospace; opacity: .6; }
  .label { font-size: 12px; color: var(--h-muted); margin-right: 2px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--h-deep); }
  main.dropping { outline: 2px dashed var(--h-accent); outline-offset: -10px; }
  main.blank { grid-template-columns: 1fr; place-items: center; }
  main.blank #media, main.blank #out { display: none; }
  main:not(.blank) #empty { display: none; }
  #empty { text-align: center; color: var(--h-muted); line-height: 1.7; font-size: 14px; padding: 24px; max-width: 520px; }
  #empty b { display: block; font-family: var(--h-head); font-size: 26px; font-weight: 700; color: var(--h-text); margin-bottom: 6px; }
  #empty a { color: var(--h-text2); cursor: pointer; text-decoration: underline; }
  #empty small { display: block; margin-top: 10px; font-size: 12px; color: var(--h-muted2); }
  #media { min-height: 0; display: flex; flex-direction: column; }
  #player { padding: 14px 16px; border-bottom: 1px solid var(--h-border); }
  #player audio, #player video { display: block; width: 100%; }
  #player video { max-height: 40vh; background: #000; border-radius: 6px; }
  #fileName { font-size: 13px; color: var(--h-text2); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #segs { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 16px; }
  .seg { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.5; }
  .seg:hover { background: var(--h-deep2); }
  .seg.on { background: var(--h-accent-bg); }
  .seg time { font: 12px/1.9 "SF Mono", Menlo, Consolas, monospace; color: var(--h-muted); }
  #segs .none { padding: 12px 8px; font-size: 13px; color: var(--h-muted); }
  #out { min-height: 0; display: flex; flex-direction: column; background: var(--h-panel); border-left: 1px solid var(--h-border); }
  .tabs { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--h-border); flex-wrap: wrap; }
  #meta { font-size: 12px; color: var(--h-muted); }
  #status { display: none; padding: 10px 14px; font-size: 13px; color: var(--h-text2); border-bottom: 1px solid var(--h-border); }
  #status.show { display: block; }
  #status small { display: block; color: var(--h-muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: var(--h-deep2); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--h-accent); transition: width .15s; }
  #text {
    flex: 1; min-height: 0; resize: none; border: 0; outline: 0; padding: 14px 16px;
    font: 15px/1.7 var(--h-font); background: var(--h-panel); color: var(--h-text);
  }
  #text::placeholder { color: var(--h-faint); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, auto) minmax(320px, 1fr); overflow: auto; }
    #out { border-left: 0; border-top: 1px solid var(--h-border); }
  }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--h-accent); color: var(--h-on-accent); font-size: 13px; padding: 8px 14px; border-radius: 8px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

    --h-green: #3fb950; --h-red: #f85149; --h-amber: #e3b341; --h-err-bg: #5c1f2b; --h-err-bg2: #7a2938; --h-err-text: #ffb3c0;

<!-- Runs as a module worker so the page stays responsive while the GPU works. -->
<script type="text/plain" id="workerSrc">
import { pipeline, WhisperTextStreamer, Tensor } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm";

let asr = null, key = "";
const post = (m) => self.postMessage(m);

async function load(c) {
  if (asr && key === c.key) return;
  const files = {};
  asr = await pipeline("automatic-speech-recognition", c.model, {
    device: c.device, dtype: c.dtype,
    progress_callback: (p) => {
      if (p.status !== "progress" || !p.total) return;
      files[p.file] = [p.loaded, p.total];
      let got = 0, all = 0;
      for (const [l, t] of Object.values(files)) { got += l; all += t; }
      post({ type: "download", got, all });
    },
  });
  key = c.key;
}

// fp16 logits come back as raw halves when the browser has no Float16Array.
function half(h) {
  const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, f = h & 1023;
  return e === 0 ? s * f * 2 ** -24 : e === 31 ? (f ? NaN : s * Infinity) : s * (1 + f / 1024) * 2 ** (e - 15);
}

// transformers.js has no language detection for Whisper, so do Whisper's own:
// one decoder step after <|startoftranscript|>, best language token wins.
async function detect(audio) {
  const { processor, model } = asr;
  const gc = model.generation_config;
  const { input_features } = await processor(audio.subarray(0, 16000 * 30));
  const out = await model({
    input_features,
    decoder_input_ids: new Tensor("int64", BigInt64Array.from([BigInt(gc.decoder_start_token_id)]), [1, 1]),
  });
  const d = out.logits.data, v = out.logits.dims.at(-1), base = d.length - v;
  const at = (i) => (d instanceof Uint16Array ? half(d[base + i]) : d[base + i]);
  let best = "en", top = -Infinity;
  for (const [tok, id] of Object.entries(gc.lang_to_id)) {
    const s = at(id);
    if (s > top) { top = s; best = tok.slice(2, -2); }
  }
  return best;
}

self.onmessage = async ({ data: m }) => {
  try {
    post({ type: "status", text: "Starting Whisper" });
    await load(m.cfg);
    let language = m.language;
    if (!language) {
      post({ type: "status", text: "Listening for the language" });
      language = await detect(m.audio);
    }
    post({ type: "language", language });
    const streamer = new WhisperTextStreamer(asr.tokenizer, {
      callback_function: (t) => post({ type: "partial", text: t }),
      on_finalize: () => post({ type: "part" }),
    });
    const t0 = performance.now();
    const out = await asr(m.audio, {
      language, task: "transcribe", chunk_length_s: 30, stride_length_s: 5, return_timestamps: true, streamer,
    });
    post({ type: "done", text: out.text, chunks: out.chunks || [], language, ms: performance.now() - t0 });
  } catch (e) {
    post({ type: "error", message: String(e && e.message || e) });
  }
};
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const main = $("main");
  const qs = new URLSearchParams(location.search);
  const SR = 16000;

  // Whisper large-v3-turbo on WebGPU: fp16 encoder where the GPU can do fp16, q4 otherwise;
  // the 4-layer decoder is q4 either way. No WebGPU: Whisper base on the CPU, slower and rougher.
  let cfg = null;
  async function pickConfig() {
    if (cfg) return cfg;
    const model = qs.get("model") || "onnx-community/whisper-large-v3-turbo";
    let adapter = null;
    if (qs.get("device") !== "wasm") { try { adapter = await navigator.gpu?.requestAdapter(); } catch {} }
    if (adapter) {
      const f16 = adapter.features.has("shader-f16");
      cfg = { model, device: "webgpu", dtype: { encoder_model: qs.get("enc") || (f16 ? "fp16" : "q4"), decoder_model_merged: qs.get("dec") || (f16 ? "q4f16" : "q4") }, label: "GPU" + (f16 ? "" : " · q4") };
    } else {
      cfg = { model: qs.get("model") || "onnx-community/whisper-base", device: "wasm", dtype: "q8", label: "CPU · Whisper base" };
    }
    cfg.key = cfg.model + cfg.device + JSON.stringify(cfg.dtype);
    return cfg;
  }
  navigator.gpu || ($("emptyNote").textContent = "This browser has no WebGPU, so it uses the smaller Whisper base on the CPU. Chrome or Edge get the full model on the GPU. Nothing is uploaded.");

  const LANG = {};
  for (const o of $("lang").options) LANG[o.value] = o.textContent;
  try { const l = localStorage.getItem("transcribeLang"); if (l != null && l in LANG) $("lang").value = l; } catch {}
  $("lang").onchange = () => { try { localStorage.setItem("transcribeLang", $("lang").value); } catch {} };

  let worker = null, busy = false, segs = [], duration = 0, baseName = "transcript", mediaEl = null, url = null;
  let parts = 0, partsDone = 0, started = 0, live = "";

  function getWorker() {
    if (worker) return worker;
    const src = URL.createObjectURL(new Blob([$("workerSrc").textContent], { type: "text/javascript" }));
    worker = new Worker(src, { type: "module" });
    worker.onmessage = ({ data: m }) => onMsg(m);
    worker.onerror = (e) => fail(e.message || "The worker didn't start");
    return worker;
  }

  // ---------- input ----------
  async function decode(blob) {
    const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
    try {
      const buf = await ac.decodeAudioData(await blob.arrayBuffer());
      if (buf.numberOfChannels === 1) return buf.getChannelData(0);
      const out = new Float32Array(buf.length);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const ch = buf.getChannelData(c);
        for (let i = 0; i < ch.length; i++) out[i] += ch[i] / buf.numberOfChannels;
      }
      return out;
    } finally { ac.close(); }
  }

  async function take(blob, name) {
    if (busy) return toast("Still working on the last one");
    if (!blob) return;
    baseName = (name || "recording").replace(/\.[^.]+$/, "");
    main.classList.remove("blank");
    showMedia(blob, name);
    $("text").value = ""; segs = []; $("segs").innerHTML = ""; setButtons(false); $("meta").textContent = "";
    setStatus("Reading the audio", "", 0);
    let audio;
    try { audio = await decode(blob); }
    catch { setStatus(""); return toast("Couldn't read the audio in that file"); }
    duration = audio.length / SR;
    if (duration < 0.3) { setStatus(""); return toast("That's too short to hear anything"); }
    const c = await pickConfig();
    parts = duration <= 30 ? 1 : 1 + Math.ceil((duration - 30) / 20);
    partsDone = 0; busy = true; started = performance.now(); live = "";
    setStatus("Starting Whisper", c.label, 0);
    getWorker().postMessage({ cfg: c, language: $("lang").value, audio }, [audio.buffer]);
  }

  function showMedia(blob, name) {
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(blob);
    mediaEl?.remove();
    mediaEl = document.createElement(/^video\//.test(blob.type) ? "video" : "audio");
    mediaEl.controls = true; mediaEl.src = url; mediaEl.preload = "metadata";
    mediaEl.ontimeupdate = highlight;
    $("player").appendChild(mediaEl);
    $("fileName").textContent = name || "Recording";
  }

  // ---------- worker messages ----------
  function onMsg(m) {
    if (m.type === "download") {
      const p = Math.round(m.got / m.all * 100);
      setStatus(`Getting Whisper · ${mb(m.got)} of ${mb(m.all)} MB`, "Downloads once, then it's cached in this browser.", p);
    } else if (m.type === "status") {
      setStatus(m.text, cfg?.label || "", 0);
    } else if (m.type === "language") {
      $("lang").title = "Heard: " + (LANG[m.language] || m.language);
      setStatus(progressText(), "", 0);
    } else if (m.type === "partial") {
      // parts overlap by a few seconds, so show the part being heard, not a running total
      live = (live + m.text).slice(-160);
      $("statusSub").textContent = "…" + live.trimStart();
    } else if (m.type === "part") {
      partsDone++; live = "";
      setStatus(progressText(), "", Math.round(partsDone / parts * 100));
    } else if (m.type === "done") {
      busy = false;
      segs = m.chunks.map((c) => ({ s: c.timestamp[0] ?? 0, e: c.timestamp[1] ?? duration, text: c.text.trim() })).filter((s) => s.text);
      $("text").value = paragraphs(segs) || m.text.trim();
      renderSegs(); setButtons(true); setStatus("");
      const lang = LANG[m.language] || m.language;
      $("meta").textContent = `${clock(duration)} of ${lang} · took ${clock((performance.now() - started) / 1000)} · ${cfg.label}`;
      if (!segs.length) toast("No speech found");
    } else if (m.type === "error") {
      fail(m.message);
    }
  }

  function progressText() {
    return parts === 1 ? "Transcribing" : `Transcribing · part ${Math.min(partsDone + 1, parts)} of ${parts}`;
  }

  function fail(msg) {
    busy = false;
    worker?.terminate(); worker = null;
    console.warn(msg);
    const vram = /memory|OOM|allocat/i.test(msg);
    setStatus("Couldn't transcribe", vram ? "The GPU ran out of memory. Close other GPU-heavy tabs and try again." : "Check the connection: the model loads from the web the first time. " + msg.slice(0, 160), 0);
  }

  // ---------- output ----------
  // A pause of more than a second and a half starts a new paragraph.
  function paragraphs(list) {
    let out = "";
    list.forEach((s, i) => {
      if (i) out += s.s - list[i - 1].e > 1.5 ? "\n\n" : " ";
      out += s.text;
    });
    return out;
  }

  function renderSegs() {
    const box = $("segs");
    if (!segs.length) { box.innerHTML = busy ? "" : '<p class="none">Timestamped lines show up here. Click one to jump to it.</p>'; return; }
    box.innerHTML = "";
    segs.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "seg"; row.dataset.i = i;
      row.innerHTML = `<time>${clock(s.s)}</time><span></span>`;
      row.lastChild.textContent = s.text;
      row.onclick = () => { if (mediaEl) { mediaEl.currentTime = s.s; mediaEl.play(); } };
      box.appendChild(row);
    });
  }

  let lastOn = -1;
  function highlight() {
    const t = mediaEl.currentTime;
    const i = segs.findIndex((s) => t >= s.s && t < s.e);
    if (i === lastOn) return;
    $("segs").querySelector(".seg.on")?.classList.remove("on");
    lastOn = i;
    if (i < 0) return;
    const row = $("segs").querySelector(`.seg[data-i="${i}"]`);
    row.classList.add("on");
    row.scrollIntoView({ block: "nearest" });
  }

  const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, "0");
  function clock(t) { t = Math.max(0, t); const h = Math.floor(t / 3600); return (h ? h + ":" + pad(t / 60 % 60) : Math.floor(t / 60)) + ":" + pad(t % 60); }
  function stamp(t, sep) { t = Math.max(0, t); return `${pad(t / 3600)}:${pad(t / 60 % 60)}:${pad(t % 60)}${sep}${pad(t % 1 * 1000, 3)}`; }
  const mb = (n) => (n / 1048576).toFixed(0);

  function srt() { return segs.map((s, i) => `${i + 1}\n${stamp(s.s, ",")} --> ${stamp(s.e, ",")}\n${s.text}\n`).join("\n"); }
  function vtt() { return "WEBVTT\n\n" + segs.map((s) => `${stamp(s.s, ".")} --> ${stamp(s.e, ".")}\n${s.text}\n`).join("\n"); }

  function save(text, ext, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = baseName + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("saveTxt").onclick = () => save($("text").value, ".txt", "text/plain");
  $("saveSrt").onclick = () => save(srt(), ".srt", "application/x-subrip");
  $("saveVtt").onclick = () => save(vtt(), ".vtt", "text/vtt");
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("text").value); toast("Copied"); }
    catch { toast("Copy blocked by the browser"); }
  };
  function setButtons(on) { for (const id of ["copy", "saveTxt", "saveSrt", "saveVtt"]) $(id).disabled = !on || (id !== "copy" && id !== "saveTxt" && !segs.length); }

  function setStatus(msg, sub, p) {
    $("status").classList.toggle("show", !!msg);
    $("statusText").textContent = msg || "";
    $("statusSub").textContent = sub || "";
    $("barFill").style.width = (p || 0) + "%";
  }

  // ---------- recording ----------
  let rec = null, recTimer = 0;
  async function toggleRec() {
    if (rec) { rec.stop(); return; }
    if (busy) return toast("Still working on the last one");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return toast("No microphone, or it was blocked"); }
    const bits = [], t0 = Date.now();
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && bits.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimer); rec = null;
      $("rec").classList.remove("rec"); $("rec").querySelector("span").textContent = "Record";
      take(new Blob(bits, { type: bits[0]?.type || "audio/webm" }), "Recording " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
    };
    rec.start();
    $("rec").classList.add("rec");
    const tick = () => $("rec").querySelector("span").textContent = "Stop · " + clock((Date.now() - t0) / 1000);
    tick(); recTimer = setInterval(tick, 500);
  }
  $("rec").onclick = toggleRec;
  $("pickRec").onclick = toggleRec;

  // ---------- files ----------
  $("open").onclick = $("pick").onclick = () => $("file").click();
  $("file").onchange = () => { const f = $("file").files[0]; $("file").value = ""; f && take(f, f.name); };
  addEventListener("dragover", (e) => { e.preventDefault(); main.classList.add("dropping"); });
  addEventListener("dragleave", (e) => { if (!e.relatedTarget) main.classList.remove("dropping"); });
  addEventListener("drop", (e) => {
    e.preventDefault(); main.classList.remove("dropping");
    const f = [...e.dataTransfer.files].find((f) => /^(audio|video)\//.test(f.type) || /\.(mp3|m4a|wav|ogg|opus|flac|mp4|webm|mov|mkv)$/i.test(f.name));
    f ? take(f, f.name) : toast("Drop an audio or video file");
  });
  addEventListener("keydown", (e) => {
    if (e.target.closest("textarea, select, input") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "r" || e.key === "R") { e.preventDefault(); toggleRec(); }
  });

  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }
  renderSegs();
})();
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
