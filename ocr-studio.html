<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318181b' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 10h8M8 14h5'/%3E%3C/svg%3E">
<meta name="description" content="Paste a screenshot and get its text back: plain text, or a table you can paste into Excel or Sheets. PaddleOCR in the browser, Tesseract as a fallback. English and Swedish.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--h-font);
    background: var(--h-bg); color: var(--h-text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 22px; background: var(--h-border); margin: 0 4px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); color: var(--h-text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { background: var(--h-btn-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); font-weight: 600; }
  button.primary:hover { background: var(--h-accent-h); }
  button.tool.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  kbd { font: 10px "SF Mono", Menlo, Consolas, monospace; opacity: .6; }
  .label { font-size: 12px; color: var(--h-muted); margin-right: 2px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--h-deep); }
  main.dropping { outline: 2px dashed var(--h-accent); outline-offset: -10px; }
  main.blank { grid-template-columns: 1fr; place-items: center; }
  main.blank #imgPane, main.blank #out { display: none; }
  main:not(.blank) #empty { display: none; }
  #empty { text-align: center; color: var(--h-muted); line-height: 1.7; font-size: 14px; padding: 24px; }
  #empty b { display: block; font-family: var(--h-head); font-size: 26px; font-weight: 700; color: var(--h-text); margin-bottom: 6px; }
  #empty .keys { display: inline-flex; gap: 6px; margin: 8px 0 14px; }
  #empty .keys span { border: 1px solid var(--h-btn-border); background: var(--h-btn); border-radius: 6px; padding: 3px 9px; font-size: 13px; color: var(--h-text); box-shadow: 0 2px 0 var(--h-border2); }
  #empty a { color: var(--h-text2); cursor: pointer; text-decoration: underline; }
  #empty small { display: block; margin-top: 10px; font-size: 12px; color: var(--h-muted2); }

  #imgPane { min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
  #stage { position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.12); }
  #cv { display: block; max-width: 100%; max-height: calc(100vh - 130px); }
  #ov { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .hint { font-size: 12px; color: var(--h-muted); }

  #out { min-height: 0; display: flex; flex-direction: column; background: var(--h-panel); border-left: 1px solid var(--h-border); }
  .tabs { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--h-border); }
  .tab { border-color: transparent; background: none; }
  .tab.on { background: var(--h-accent-bg); border-color: var(--h-border2); font-weight: 600; }
  #meta { font-size: 12px; color: var(--h-muted); }
  #status { display: none; padding: 10px 14px; font-size: 13px; color: var(--h-text2); border-bottom: 1px solid var(--h-border); }
  #status.show { display: block; }
  #status small { display: block; color: var(--h-muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: var(--h-deep2); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--h-accent); transition: width .15s; }
  .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }
  #text {
    flex: 1; min-height: 0; resize: none; border: 0; outline: 0; padding: 14px 16px;
    font: 14px/1.6 "SF Mono", Menlo, Consolas, monospace; background: var(--h-panel); color: var(--h-text);
  }
  #text::placeholder { color: var(--h-faint); }
  .tablebar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--h-border); flex-wrap: wrap; }
  #tableNote { font-size: 12px; color: var(--h-muted); margin-left: 4px; }
  .tablewrap { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
  table { border-collapse: collapse; font-size: 13px; }
  td { border: 1px solid var(--h-border2); padding: 5px 9px; vertical-align: top; white-space: pre-wrap; }
  tr:first-child td { background: var(--h-panel2); }
  td:empty::after { content: ""; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 1fr); overflow: auto; }
    #out { border-left: 0; border-top: 1px solid var(--h-border); }
    #cv { max-height: 50vh; }
  }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--h-accent); color: var(--h-on-accent); font-size: 13px; padding: 8px 14px; border-radius: 8px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

    --h-yellow: #e8d3a8; --h-blue: #9ecbff; --h-blue2: #9db3d8; --h-purple: #c4a7e7; --h-green2: #a8d5b5; --h-ok: #8fd19e;
    --h-green: #3fb950; --h-red: #f85149; --h-amber: #e3b341; --h-err-bg: #5c1f2b; --h-err-bg2: #7a2938; --h-err-text: #ffb3c0;

  h1 { font-family: var(--h-head); font-weight: 800; font-stretch: 125%; letter-spacing: -.02em; text-shadow: var(--h-title-shadow); }
  h1 span, h1 em { text-shadow: inherit; color: var(--h-muted); }

  /* the theme slider: fixed top-right, no labels */

  .hub-theme button { all: unset; box-sizing: border-box; position: relative; display: block; width: 52px; height: 22px; border-radius: 999px; cursor: pointer;

<body>
<header>
  <h1>OCR Studio <span>v2</span></h1>
  <div class="group" id="engines">
    <span class="label">Engine</span>
    <button class="tool" data-engine="paddle" title="PaddleOCR. Sharper on screenshots. About 47 MB the first time">PaddleOCR</button>
    <button class="tool" data-engine="tesseract" title="Tesseract, English + Swedish. A smaller download">Tesseract</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="tool" id="boxes" title="Show the text boxes on the image (W)">Boxes <kbd>W</kbd></button>
    <button id="whole" title="Read the whole image again (Esc)" disabled>Whole image</button>
  </div>
  <div class="spacer"></div>
  <button id="open">Open…</button>
  <button id="copy" class="primary" disabled>Copy text <kbd style="opacity:.8" data-mod>Ctrl C</kbd></button>
  <span data-hub-theme-slot></span>
</header>
<main id="main" class="blank">
  <div id="empty">
    <b>Paste a screenshot</b>
    Take one with <span data-snip>Win Shift S</span>, then press
    <div><div class="keys"><span data-modkey>Ctrl</span><span>V</span></div></div>
    or drop an image here, or <a id="pick">open a file</a>.
    <small>Runs in your browser. The engine downloads once (PaddleOCR is about 47 MB), then it's cached.</small>
  </div>
  <section id="imgPane">

    <div id="status"><span id="statusText">Starting…</span><small id="statusSub"></small><div class="bar"><i id="barFill"></i></div></div>
    <div class="view on" id="view-text">
      <textarea id="text" spellcheck="false" placeholder="The text shows up here."></textarea>

    </div>
  </section>
</main>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast"></div>

<script>
(() => {
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const MOD = isMac ? "⌘" : "Ctrl";
  document.querySelectorAll("[data-modkey]").forEach(e => e.textContent = MOD);
  document.querySelectorAll("[data-mod]").forEach(e => e.textContent = MOD + " C");
  document.querySelectorAll("[data-snip]").forEach(e => e.textContent = isMac ? "⌘ Ctrl Shift 4" : "Win Shift S");

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const ov = $("ov"), octx = ov.getContext("2d");
  const main = $("main");
  const qs = new URLSearchParams(location.search);

  let img = null;          // the pasted image (ImageBitmap)
  let engine = "paddle";   // "paddle" or "tesseract"
  try { engine = qs.get("engine") || localStorage.getItem("ocrEngine") || "paddle"; } catch {}
  if (engine !== "tesseract") engine = "paddle";
  let region = null;       // { x, y, w, h } in image pixels, or null for the whole image
  let drag = null;         // rectangle being dragged
  let words = [];          // [{ text, conf, x0, y0, x1, y1 }] in image pixels (Tesseract words, PaddleOCR lines)
  let grid = [];           // table cells, rows of strings
  let showBoxes = false;
  let runId = 0;
  let lastRun = null;      // { engine, ms, backend }

  // ---------- PaddleOCR ----------
  // PP-OCRv5 mobile detection + the PP-OCRv5 Latin recognizer (it has å ä ö),
  // run by the official PaddleOCR.js SDK in its own worker on onnxruntime-web.
  // Every file is pinned, fetched once with progress, and kept in Cache Storage.
  const HF = "https://huggingface.co/PaddlePaddle/";
  const DET = HF + "PP-OCRv5_mobile_det_onnx/resolve/e6f4fa85f00e168c862bc462aebca69eef9b3d3d/";
  const REC = HF + "latin_PP-OCRv5_mobile_rec_onnx/resolve/89d3a50e2c27e2e7cceeab0e944c25c807d5db4f/";
  const PADDLE_FILES = {
    worker: { url: "https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/dist/assets/worker-entry-C9UNuyOJ.js", size: 11341486, type: "text/javascript" },
    wasm: { url: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/ort-wasm-simd-threaded.jsep.wasm", size: 25014754, type: "application/wasm" },
    detOnnx: { url: DET + "inference.onnx", size: 4826518 },
    detYml: { url: DET + "inference.yml", size: 903 },
    recOnnx: { url: REC + "inference.onnx", size: 8042023 },
    recYml: { url: REC + "inference.yml", size: 6817 },
  };
  const PADDLE_TOTAL = Object.values(PADDLE_FILES).reduce((a, f) => a + f.size, 0);
  const MB = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
  const CACHE = "ocr-studio-v2";

  async function fetchCached(f, tick) {
    let cache = null;
    try { cache = await caches.open(CACHE); } catch {}
    const hit = cache && await cache.match(f.url).catch(() => null);
    if (hit) { const b = await hit.blob(); tick(f.size, true); return b; }
    const r = await fetch(f.url);
    if (!r.ok) throw new Error("HTTP " + r.status + " for " + f.url);
    const parts = [], reader = r.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); tick(value.length);
    }
    const blob = new Blob(parts, { type: f.type || "application/octet-stream" });
    if (cache) await cache.put(f.url, new Response(blob, { headers: { "content-type": blob.type } })).catch(() => {});
    return blob;
  }
  // The SDK takes each model as an uncompressed tar holding inference.onnx + inference.yml.
  function tarOf(entries) {
    const enc = new TextEncoder(), parts = [];
    for (const [name, blob] of entries) {
      const h = new Uint8Array(512);
      const put = (str, off, len) => h.set(enc.encode(str).subarray(0, len), off);
      put(name, 0, 100); put("0000644\0", 100, 8); put("0000000\0", 108, 8); put("0000000\0", 116, 8);
      put(blob.size.toString(8).padStart(11, "0") + "\0", 124, 12); put("00000000000\0", 136, 12);
      put("        ", 148, 8); h[156] = 48; put("ustar\0", 257, 6); put("00", 263, 2);
      put(h.reduce((a, b) => a + b, 0).toString(8).padStart(6, "0") + "\0 ", 148, 8);
      parts.push(h, blob, new Uint8Array((512 - blob.size % 512) % 512));
    }
    parts.push(new Uint8Array(1024));
    return new Blob(parts, { type: "application/x-tar" });
  }

  let paddleP = null, paddleInfo = null;
  function getPaddle() {
    if (paddleP) return paddleP;
    paddleP = (async () => {
      let got = 0, fresh = false, shown = -1;
      const tick = (n, cached) => {
        got += n; if (!cached) fresh = true;
        const p = Math.min(99, Math.floor(got / PADDLE_TOTAL * 100));
        if (fresh && p !== shown) { shown = p; setStatus(`Getting PaddleOCR · ${MB(got)} of ${MB(PADDLE_TOTAL)} MB`, "Downloads once, then it's cached in this browser.", p); }
      };
      setStatus("Starting PaddleOCR", "", 0);
      const sdkP = import("@paddleocr/paddleocr-js");
      const keys = Object.keys(PADDLE_FILES);
      const blobs = Object.fromEntries((await Promise.all(keys.map(k => fetchCached(PADDLE_FILES[k], tick)))).map((b, i) => [keys[i], b]));
      setStatus("Starting PaddleOCR", "", 100);
      const url = b => URL.createObjectURL(b);
      // The SDK has no log switch, and onnxruntime prints harmless model-load warnings as console
      // errors. Its sessions are created with log level "error" instead (this pinned file only).
      const src = (await blobs.worker.text()).replace("executionProviders,\n        graphOptimizationLevel:", "executionProviders,\n        logSeverityLevel: 3,\n        graphOptimizationLevel:");
      const workerURL = url(new Blob([src], { type: "text/javascript" }));
      const wasmURL = url(new Blob([blobs.wasm], { type: "application/wasm" }));
      const { PaddleOCR } = await sdkP;
      const backend = ["wasm", "webgpu"].includes(qs.get("backend")) ? qs.get("backend") : "auto";
      const ocr = await PaddleOCR.create({
        textDetectionModelName: "PP-OCRv5_mobile_det",
        textDetectionModelAsset: { url: url(tarOf([["inference.onnx", blobs.detOnnx], ["inference.yml", blobs.detYml]])) },
        textRecognitionModelName: "latin_PP-OCRv5_mobile_rec",
        textRecognitionModelAsset: { url: url(tarOf([["inference.onnx", blobs.recOnnx], ["inference.yml", blobs.recYml]])) },
        worker: { createWorker: () => new Worker(workerURL, { type: "module", name: "paddleocr" }) },
        ortOptions: { backend, wasmPaths: { wasm: wasmURL } },
        pipelineWarnings: "ignore",
      });
      const sum = ocr.getInitializationSummary?.() || {};
      paddleInfo = { backend: /webgpu/i.test(sum.recProvider || sum.detProvider || "") ? "WebGPU" : "WASM", downloaded: fresh ? got : 0, summary: sum };
      return ocr;
    })();
    paddleP.catch(() => { paddleP = null; });
    return paddleP;
  }

  // ---------- Tesseract (fallback) ----------
  // One worker, English + Swedish, kept alive between runs.
  let tessP = null;
  function getTesseract() {
    if (tessP) return tessP;
    tessP = Tesseract.createWorker(["swe", "eng"], 1, { logger: tessProgress, errorHandler: () => {} });
    tessP.catch(() => { tessP = null; });
    return tessP;
  }
  function tessProgress(m) {
    if (engine !== "tesseract") return;
    const p = Math.round((m.progress || 0) * 100);
    let msg, sub = "";
    switch (m.status) {
      case "loading tesseract core": msg = "Loading Tesseract"; break;
      case "initializing tesseract": msg = "Starting Tesseract"; break;
      case "loading language traineddata": msg = "Getting English + Swedish data"; sub = "Downloads once, then it's cached in this browser."; break;
      case "initializing api": msg = "Getting ready"; break;
      case "recognizing text": msg = "Reading text"; break;
      default: msg = m.status ? m.status[0].toUpperCase() + m.status.slice(1) : "Working";
    }
    setStatus(msg + (p ? " · " + p + "%" : ""), sub, p);
  }

  // ---------- status ----------
  function setStatus(msg, sub, p) {
    $("status").classList.toggle("show", !!msg);
    if (!msg) return;
    $("statusText").textContent = msg;
    $("statusSub").textContent = sub || "";
    $("barFill").style.width = (p || 0) + "%";
  }

  // ---------- loading an image ----------
  async function loadBlob(blob) {
    if (!blob || !blob.type.startsWith("image/")) return toast("That isn't an image");
    try { img = await createImageBitmap(blob); }
    catch { return toast("Couldn't read that image"); }
    cv.width = ov.width = img.width; cv.height = ov.height = img.height;
    ctx.drawImage(img, 0, 0);
    region = null; words = []; grid = [];
    main.classList.remove("blank");
    $("text").value = ""; renderTable(); drawOverlay();
    return run();
  }
  document.addEventListener("paste", e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    if (!item) {
      if (e.target.closest?.("textarea, input")) return;   // let text pastes into the editor through
      return toast("No image on the clipboard. Take a screenshot first");
    }
    e.preventDefault();
    loadBlob(item.getAsFile());
  });
  main.addEventListener("dragover", e => { e.preventDefault(); main.classList.add("dropping"); });
  main.addEventListener("dragleave", () => main.classList.remove("dropping"));
  main.addEventListener("drop", e => { e.preventDefault(); main.classList.remove("dropping"); loadBlob(e.dataTransfer.files[0]); });
  $("open").onclick = $("pick").onclick = () => $("file").click();
  $("file").onchange = e => { loadBlob(e.target.files[0]); e.target.value = ""; };

  // ---------- OCR ----------
  // The region (or whole image) is copied onto white and scaled up when small:
  // Tesseract wants 1-3x on screenshot text, PaddleOCR 1-2x. Boxes are mapped back.
  function prepare(eng) {
    const r = region || { x: 0, y: 0, w: img.width, h: img.height };
    const big = Math.max(r.w, r.h);
    const s = eng === "paddle" ? (big <= 1000 ? 2 : 1) : (big <= 900 ? 3 : big <= 1800 ? 2 : 1);
    const c = document.createElement("canvas");
    c.width = Math.round(r.w * s); c.height = Math.round(r.h * s);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingQuality = "high";
    g.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
    return { c, s, ox: r.x, oy: r.y };
  }
  function tessWords(data) {
    let ws = data.words;
    if (!ws) {
      ws = [];
      (data.blocks || []).forEach(b => b.paragraphs.forEach(p => p.lines.forEach(l => ws.push(...l.words))));
    }
    return ws;
  }
  async function readTesseract({ c, s, ox, oy }) {
    const w = await getTesseract();
    const { data } = await w.recognize(c, {}, { text: true, blocks: true });
    return {
      words: tessWords(data).filter(w => w.text.trim()).map(w => ({ text: w.text.trim(), conf: w.confidence,
        x0: ox + w.bbox.x0 / s, y0: oy + w.bbox.y0 / s, x1: ox + w.bbox.x1 / s, y1: oy + w.bbox.y1 / s })),
      text: (data.text || "").replace(/\n{3,}/g, "\n\n").trim(),
    };
  }
  async function readPaddle({ c, s, ox, oy }) {
    const ocr = await getPaddle();
    setStatus("Reading text", "", 100);
    const [res] = await ocr.predict(c);
    const ws = res.items.filter(it => it.text.trim()).map(it => {
      const xs = it.poly.map(p => p[0] ?? p.x), ys = it.poly.map(p => p[1] ?? p.y);
      return { text: it.text.trim(), conf: it.score * 100,
        x0: ox + Math.min(...xs) / s, y0: oy + Math.min(...ys) / s, x1: ox + Math.max(...xs) / s, y1: oy + Math.max(...ys) / s };
    });
    return { words: ws, text: linesText(ws) };
  }
  async function run() {
    if (!img) return;
    const my = ++runId, eng = engine;
    setBusy(true);
    setStatus("Starting", "", 0);
    try {
      const prep = prepare(eng);
      if (eng === "paddle") await getPaddle(); else await getTesseract();   // time the reading, not the download
      if (my !== runId) return;
      const t0 = performance.now();
      const out = eng === "paddle" ? await readPaddle(prep) : await readTesseract(prep);
      if (my !== runId) return;
      words = out.words;
      $("text").value = out.text;
      lastRun = { engine: eng, ms: Math.round(performance.now() - t0), backend: eng === "paddle" ? paddleInfo?.backend : "WASM" };
      const conf = words.length ? Math.round(words.reduce((a, w) => a + w.conf, 0) / words.length) : 0;
      const unit = eng === "paddle" ? "lines" : "words";
      $("meta").textContent = words.length ? `${words.length} ${unit} · ${conf}% sure · ${(lastRun.ms / 1000).toFixed(1)} s` : "No text found";
      renderTable(); drawOverlay();
      setStatus("");
    } catch (err) {
      if (my !== runId) return;
      console.warn(err);
      if (eng === "paddle") {
        toast("PaddleOCR didn't start. Using Tesseract");
        setEngine("tesseract");
        return;
      }
      setStatus("Couldn't run OCR", "Check the connection: the engine loads from the web the first time.", 0);
    } finally {
      if (my === runId) setBusy(false);
    }
  }
  function setBusy(b) {
    $("copy").disabled = b || !img;
    $("whole").disabled = !region;
    if (b) $("meta").textContent = "";
  }

  // ---------- rows, text, table ----------
  const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };
  // Rows: boxes whose vertical centres are close, sorted left to right.
  function rowsOf(ws) {
    const hm = median(ws.map(w => w.y1 - w.y0)) || 10;
    const rows = [];
    for (const w of [...ws].sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1))) {
      const cy = (w.y0 + w.y1) / 2, last = rows[rows.length - 1];
      if (last && Math.abs(cy - last.cy) < hm * .6) { last.ws.push(w); last.cy += (cy - last.cy) / last.ws.length; }
      else rows.push({ cy, ws: [w] });
    }
    rows.forEach(r => {
      r.ws.sort((a, b) => a.x0 - b.x0);
      r.y0 = Math.min(...r.ws.map(w => w.y0)); r.y1 = Math.max(...r.ws.map(w => w.y1));
    });
    return { rows, hm };
  }
  // PaddleOCR gives lines, not a page: one text line per row, a blank line at a big gap
  // (well over a line's height, so evenly spaced UI rows stay together).
  function linesText(ws) {
    if (!ws.length) return "";
    const { rows, hm } = rowsOf(ws);
    return rows.map((r, i) => (i && r.y0 - rows[i - 1].y1 > hm * 1.6 ? "\n" : "") + r.ws.map(w => w.text).join(" ")).join("\n");
  }
  // Cells: runs of boxes split at wide gaps. Columns: x bands where cells of the multi-cell rows overlap.
  function buildGrid() {
    if (!words.length) return { rows: [], table: false };
    const { rows, hm } = rowsOf(words);
    rows.forEach(r => {
      r.cells = [];
      for (const w of r.ws) {
        const c = r.cells[r.cells.length - 1];
        if (c && w.x0 - c.x1 < hm * 1.2) { c.text += " " + w.text; c.x1 = Math.max(c.x1, w.x1); }
        else r.cells.push({ text: w.text, x0: w.x0, x1: w.x1 });
      }
    });
    const multi = rows.filter(r => r.cells.length > 1);
    let bands = [];
    if (multi.length >= 2) {
      const cells = multi.flatMap(r => r.cells).sort((a, b) => a.x0 - b.x0);
      for (const c of cells) {
        const b = bands[bands.length - 1];
        if (b && c.x0 <= b.x1) b.x1 = Math.max(b.x1, c.x1);
        else bands.push({ x0: c.x0, x1: c.x1 });
      }
    }
    if (bands.length < 2) return { rows: rows.map(r => [r.cells.map(c => c.text).join("   ")]), table: false };
    const out = rows.map(r => {
      const line = bands.map(() => "");
      r.cells.forEach(c => {
        // the band this cell starts in (a long line spanning several stays in its first)
        let k = bands.findIndex(b => c.x0 < b.x1 && c.x1 > b.x0);
        if (k < 0) k = bands.findIndex(b => c.x1 <= b.x0); if (k < 0) k = bands.length - 1;
        line[k] = line[k] ? line[k] + " " + c.text : c.text;
      });
      return line;
    });
    return { rows: out, table: true };
  }
  function renderTable() {
    const { rows, table } = buildGrid();
    grid = rows;
    const t = $("tbl");
    t.replaceChildren(...rows.map(r => {
      const tr = document.createElement("tr");
      r.forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.append(td); });
      return tr;
    }));
    $("tableNote").textContent = !rows.length ? "" : table
      ? `${rows.length} rows × ${rows[0].length} columns`
      : "Doesn't look like a table, so one line per row";
    $("copyTsv").disabled = $("copyMd").disabled = !rows.length;
  }
  const clean = v => v.replace(/[\t\r\n]+/g, " ");
  const tsv = () => grid.map(r => r.map(clean).join("\t")).join("\n");
  function markdown() {
    const esc = v => clean(v).replace(/\|/g, "\\|");
    const n = Math.max(...grid.map(r => r.length));
    const line = r => "| " + Array.from({ length: n }, (_, i) => esc(r[i] || "")).join(" | ") + " |";
    return [line(grid[0]), "|" + " --- |".repeat(n), ...grid.slice(1).map(line)].join("\n");
  }

  // ---------- tabs ----------
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + b.dataset.tab));
  });

  // ---------- engine ----------
  function showEngine() { document.querySelectorAll("[data-engine]").forEach(b => b.classList.toggle("on", b.dataset.engine === engine)); }
  function setEngine(e) {
    if (e === engine) return;
    engine = e; showEngine();
    try { localStorage.setItem("ocrEngine", e); } catch {}
    words = []; drawOverlay();
    return run();
  }
  document.querySelectorAll("[data-engine]").forEach(b => b.onclick = () => setEngine(b.dataset.engine));
  showEngine();

  // ---------- overlay: boxes + region ----------
  const scale = () => ov.width / ov.getBoundingClientRect().width;
  function drawOverlay() {
    octx.clearRect(0, 0, ov.width, ov.height);
    if (!img) return;
    const k = scale() || 1;
    const r = drag ? norm(drag) : region;
    if (r) {   // dim everything outside the region
      octx.fillStyle = "rgba(0,0,0,.35)";
      octx.beginPath(); octx.rect(0, 0, ov.width, ov.height); octx.rect(r.x, r.y, r.w, r.h); octx.fill("evenodd");
      octx.setLineDash([5 * k, 4 * k]); octx.lineWidth = 1.5 * k; octx.strokeStyle = "#fff";
      octx.strokeRect(r.x, r.y, r.w, r.h); octx.setLineDash([]);
    }
    if (showBoxes && !drag) {
      octx.lineWidth = Math.max(1, k);
      words.forEach(w => {
        octx.strokeStyle = w.conf < 60 ? "rgba(229,52,43,.9)" : "rgba(31,111,235,.85)";
        octx.fillStyle = w.conf < 60 ? "rgba(229,52,43,.12)" : "rgba(31,111,235,.10)";
        octx.fillRect(w.x0, w.y0, w.x1 - w.x0, w.y1 - w.y0);
        octx.strokeRect(w.x0, w.y0, w.x1 - w.x0, w.y1 - w.y0);
      });
    }
  }
  function at(e) {
    const r = ov.getBoundingClientRect(), k = ov.width / r.width;
    return { x: Math.max(0, Math.min(ov.width, (e.clientX - r.left) * k)), y: Math.max(0, Math.min(ov.height, (e.clientY - r.top) * k)) };
  }
  const norm = d => ({ x: Math.min(d.a.x, d.b.x), y: Math.min(d.a.y, d.b.y), w: Math.abs(d.b.x - d.a.x), h: Math.abs(d.b.y - d.a.y) });
  ov.addEventListener("pointerdown", e => {
    if (!img || e.button !== 0) return;
    ov.setPointerCapture(e.pointerId);
    const p = at(e); drag = { a: p, b: p };
  });
  ov.addEventListener("pointermove", e => { if (drag) { drag.b = at(e); drawOverlay(); } });
  const finish = () => {
    if (!drag) return;
    const r = norm(drag); drag = null;
    if (r.w < 8 * scale() || r.h < 6 * scale()) return drawOverlay();   // a click, not a drag
    region = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) };
    words = []; drawOverlay(); run();
  };
  ov.addEventListener("pointerup", finish);
  ov.addEventListener("pointercancel", finish);
  function wholeImage() { if (!region) return; region = null; words = []; drawOverlay(); run(); }
  $("whole").onclick = wholeImage;
  function toggleBoxes() { showBoxes = !showBoxes; $("boxes").classList.toggle("on", showBoxes); drawOverlay(); }
  $("boxes").onclick = toggleBoxes;
  window.addEventListener("resize", drawOverlay);

  // ---------- copy ----------
  async function copyStr(s, done) {
    if (!s) return toast("Nothing to copy yet");
    try { await navigator.clipboard.writeText(s); }
    catch {
      const t = document.createElement("textarea"); t.value = s; document.body.append(t); t.select();
      const ok = document.execCommand("copy"); t.remove();
      if (!ok) return toast("Copy blocked by the browser");
    }
    toast(done);
  }
  $("copy").onclick = () => copyStr($("text").value, "Text copied");
  $("copyTsv").onclick = () => copyStr(tsv(), "Copied. Paste into Excel or Sheets");
  $("copyMd").onclick = () => copyStr(markdown(), "Markdown table copied");

  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

  // ---------- keys ----------
  document.addEventListener("keydown", e => {
    if (e.target.closest?.("input, textarea")) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === "c" && img && !String(getSelection())) { e.preventDefault(); $("copy").click(); }
    else if (k === "escape") wholeImage();
    else if (!mod && !e.altKey && k === "w" && img) toggleBoxes();
  });

  // A small hook for scripted checks.
  window.ocrStudio = {
    load: loadBlob, setEngine,
    state: () => ({ engine, text: $("text").value, grid, words, lastRun, paddle: paddleInfo }),
  };

  window.addEventListener("beforeunload", () => { if (tessP) tessP.then(w => w.terminate()).catch(() => {}); });
})();
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
<!-- /studio-hub theme slider -->
</body>
