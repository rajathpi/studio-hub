<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfit Studio</title>
<meta name="description" content="Realistic 3D people who move, with their clothes recoloured by the 348 combinations from Sanzo Wada's A Dictionary of Color Combinations.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--h-font); background: var(--h-bg); color: var(--h-text); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border); }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
  header .sub { font-size: 12px; color: var(--h-muted); }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--h-text); font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--h-btn-border); background: var(--h-btn); cursor: pointer; }
  button:hover { background: var(--h-btn-hover); }
  button.primary, .chip.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); font-weight: 600; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 400; }

  .wrap { flex: 1; min-height: 0; display: flex; }
  aside { flex: none; overflow: auto; background: var(--h-panel); padding: 4px 14px 20px; }
  #people { width: 300px; border-right: 1px solid var(--h-border); }
  #colours { width: 340px; border-left: 1px solid var(--h-border); }
  h2 { font-size: 11px; font-weight: 600; color: var(--h-muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 7px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { font-size: 11px; padding: 2px 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .count { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
  .card { padding: 0; border-radius: 8px; overflow: hidden; background: #fff; display: flex; flex-direction: column; border: 1px solid var(--h-border); }
  .card:hover { background: #fff; border-color: var(--h-text2); }
  .card img { width: 100%; height: 118px; object-fit: cover; object-position: 50% 28%; display: block; }
  .card span { font-size: 10px; color: #3f3f46; padding: 3px 4px 4px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #f4f2ec; }
  .card.on { outline: 2px solid var(--h-text); outline-offset: 1px; }
  .filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #view { flex: 1; min-height: 0; position: relative; background: var(--h-deep); }
  #view canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; left: 16px; top: 14px; font-size: 12px; color: var(--h-muted); line-height: 1.6; max-width: 60%; }
  #status b { display: block; font-family: var(--h-head); font-size: 20px; color: var(--h-text); }
  .viewbtns { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
  #bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; text-align: center; font-size: 12px; color: var(--h-muted); display: none; }
  #bar.show { display: block; }
  #bar i { display: block; height: 4px; border-radius: 2px; background: var(--h-border); margin-top: 8px; overflow: hidden; }
  #bar i b { display: block; height: 100%; width: 0; background: var(--h-text); transition: width .2s; }
  #moves { padding: 10px 14px 12px; background: var(--h-panel); border-top: 1px solid var(--h-border); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  #moves .lab { font-size: 11px; font-weight: 600; color: var(--h-muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }

  .now { display: flex; height: 54px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .now i { flex: 1; cursor: pointer; }
  .names { font-size: 12px; color: var(--h-text2); margin-top: 7px; line-height: 1.55; }
  .names em { font-style: normal; color: var(--h-muted); }
  .stepper { display: flex; gap: 5px; margin-top: 9px; }
  .stepper button { flex: 1; }
  .has { display: none; align-items: center; gap: 5px; font-size: 12px; color: var(--h-text2); }
  .has.show { display: inline-flex; }
  .has i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  #cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
  .combo { padding: 0; border: 0; background: none; border-radius: 6px; overflow: hidden; }
  .combo .bar { display: flex; height: 28px; }
  .combo .bar i { flex: 1; }
  .combo small { display: block; font-size: 10px; color: var(--h-muted); padding: 2px 0 0; text-align: left; }
  .combo.on { box-shadow: 0 0 0 2px var(--h-text); }
  .combo:hover { background: none; }
  .parts { display: grid; gap: 5px; margin-top: 8px; }
  .part { display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; gap: 8px; font-size: 12px; color: var(--h-text2); }
  .part i { display: block; height: 22px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .part span { text-align: center; color: var(--h-muted); }
  .hint { font-size: 12px; color: var(--h-muted); line-height: 1.5; margin-top: 6px; }
  @media (max-width: 1100px) { .wrap { flex-wrap: wrap; } #people, #colours { width: 50%; height: 40vh; border: 0; border-top: 1px solid var(--h-border); } main { width: 100%; flex: none; height: 60vh; order: -1; } }
</style>

<body>
<header>
  <h1>Outfit Studio</h1>
  <span class="sub">Colours from Sanzo Wada, A Dictionary of Color Combinations (1933) · people from Microsoft Rocketbox</span>
  <div class="spacer"></div>
  <button id="shot" title="Save a picture">Save PNG</button>
  <button id="random" class="primary" title="Random combination (R)">Surprise me</button>
  <span data-hub-theme-slot></span>
</header>
<div class="wrap">
  <aside id="people">
    <h2>People <span class="count" id="pcount"></span></h2>
    <div class="filters" id="pfilters"></div>
    <div class="grid" id="pgrid"></div>
  </aside>
  <main>
    <div id="view">
      <div id="status"></div>
      <div class="viewbtns">
        <button id="orig" class="chip" title="Show the person's own colours (O)">Original colours</button>
        <button id="front" class="chip" title="Face front">Front</button>
      </div>
      <div id="bar"><span id="barText">Loading</span><i><b id="barFill"></b></i></div>
    </div>
    <div id="moves"></div>
  </main>
  <aside id="colours">
    <h2>Combination <span class="count" id="cnum"></span></h2>
    <div class="now" id="now"></div>
    <div class="names" id="names"></div>
    <div class="stepper"><button id="prev" title="Previous (Left arrow)">Previous</button><button id="next" title="Next (Right arrow)">Next</button></div>
    <h2>On the clothes <button id="swap" title="Hand the colours to different garments (S)">Swap colours</button></h2>
    <div class="parts" id="parts"></div>
    <p class="hint">Skin and hair stay as they are. Each garment keeps its folds and shading, only its colour changes.</p>
    <h2>All combinations <span class="count" id="shown"></span></h2>
    <div class="filters">
      <div class="filters" id="counts" style="margin:0"></div>
      <span class="has" id="has"><i></i><span></span><button class="chip" id="hasx">Clear</button></span>
    </div>
    <div id="cgrid"></div>
  </aside>
</div>

const FLAT = "data:image/x-tga;base64,AAACAAAAAAAAAAAAAQABABgAgICA";
let token = 0, body = null;   // body = { tex, orig (Uint8 RGBA), w, h, groups, skin }
async function loadPerson() {
  const my = ++token, name = S.person, base = `${RB}Avatars/${S.group}/${name}/`;

  manager.setURLModifier(url => {

    if (r + g + b < 90) return false;
    const dh = Math.abs(((hueOf([r, g, b]) - sh + 540) % 360) - 180);
    const s = satOf([r, g, b]);
    return dh < 16 && s > ss * .45 && s < ss * 1.7 && r > g && g >= b * .9;
  };
  // small sample for clustering
  const step = Math.max(1, (w / 256) | 0), pts = [];
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const i = (y * w + x) * 4; if (data[i + 3] < 10) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    if (r + g + b < 24 || isSkin(r, g, b)) continue;
    pts.push([r, g, b]);
  }
  let centres = kmeans(pts, 5, 12);
  // merge centres that are nearly the same colour
  centres.sort((a, b) => lumOf(...a) - lumOf(...b));
  const merged = [];
  centres.forEach(c => { const near = merged.find(m => dist(m, c) < 42); if (!near) merged.push(c); });
  // per-pixel garment index (255 = skin / none)
  const idx = new Uint8Array(w * h), sums = merged.map(() => [0, 0]);
  for (let p = 0; p < w * h; p++) {
    const i = p * 4, r = data[i], g = data[i + 1], b = data[i + 2];
    if (data[i + 3] < 10 || r + g + b < 24 || isSkin(r, g, b)) { idx[p] = 255; continue; }
    let best = 0, bd = Infinity;
    merged.forEach((c, k) => { const d = dist(c, [r, g, b]); if (d < bd) { bd = d; best = k; } });
    idx[p] = best; sums[best][0] += lumOf(r, g, b); sums[best][1]++;
  }
  const groups = merged.map((c, k) => ({ centre: c, lum: sums[k][1] ? sums[k][0] / sums[k][1] : lumOf(...c), share: sums[k][1] / (w * h) })).filter(g => g.share > .004);
  // reindex after dropping tiny groups
  const map = new Uint8Array(merged.length).fill(255); groups.forEach((g, n) => map[merged.indexOf(g.centre)] = n);
  for (let p = 0; p < w * h; p++) if (idx[p] !== 255) idx[p] = map[idx[p]];
  return { tex, orig, w, h, idx, groups, skin };
}
const hueOf = ([r, g, b]) => { const M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m; if (!d) return 0; let hh = M === r ? (g - b) / d : M === g ? 2 + (b - r) / d : 4 + (r - g) / d; return ((hh * 60) + 360) % 360; };
const satOf = ([r, g, b]) => { const M = Math.max(r, g, b), m = Math.min(r, g, b); return M ? (M - m) / M : 0; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
function kmeans(pts, k, iters) {
  if (!pts.length) return [];
  k = Math.min(k, pts.length);
  let c = [pts[0]];
  while (c.length < k) {   // k-means++ seeding
    let best = null, bd = -1;
    for (let i = 0; i < pts.length; i += 7) { const d = Math.min(...c.map(x => dist(x, pts[i]))); if (d > bd) { bd = d; best = pts[i]; } }
    c.push(best);
  }
  for (let it = 0; it < iters; it++) {
    const acc = c.map(() => [0, 0, 0, 0]);
    pts.forEach(p => { let bi = 0, bd = Infinity; c.forEach((x, i) => { const d = dist(x, p); if (d < bd) { bd = d; bi = i; } }); const a = acc[bi]; a[0] += p[0]; a[1] += p[1]; a[2] += p[2]; a[3]++; });
    c = acc.map((a, i) => a[3] ? [a[0] / a[3], a[1] / a[3], a[2] / a[3]] : c[i]);
  }
  return c;
}

// Which Wada colour each garment gets: garments dark→light take colours dark→light,
// `perm` rotates the hand-out. Returns hex per garment group.
function plan() {
  if (!body) return [];
  const cols = [...comboCols()].sort((a, b) => lumOf(...hexRgb(a)) - lumOf(...hexRgb(b)));
  const n = body.groups.length, out = [];
  for (let g = 0; g < n; g++) {
    const rank = Math.round(g * (cols.length - 1) / Math.max(1, n - 1));
    out.push(cols[(rank + S.perm) % cols.length]);
  }
  return out;
}
// Repaint the body texture: every garment pixel takes its colour's hue and saturation
// and keeps its own light and dark, so folds, seams and buttons survive.
function recolour() {
  if (!body) return;
  const { tex, orig, w, h, idx, groups } = body, d = tex.image.data;
  if (S.orig) { d.set(orig); tex.needsUpdate = true; drawParts([]); return; }
  const cols = plan().map(hexRgb);
  const target = cols.map((c, k) => { const [tr, tg, tb] = c; const tl = lumOf(tr, tg, tb); return { c, tl, gl: groups[k].lum }; });
  for (let p = 0; p < w * h; p++) {
    const k = idx[p], i = p * 4;
    if (k === 255) { d[i] = orig[i]; d[i + 1] = orig[i + 1]; d[i + 2] = orig[i + 2]; continue; }
    const t = target[k], L = lumOf(orig[i], orig[i + 1], orig[i + 2]);
    // shade factor relative to the garment's average, applied to the new colour
    const f = Math.min(2.2, L / Math.max(.03, t.gl));
    const lift = t.tl < .12 ? .12 : 0;   // near-black colours still need visible folds
    d[i] = Math.min(255, (t.c[0] + lift * 255) * f); d[i + 1] = Math.min(255, (t.c[1] + lift * 255) * f); d[i + 2] = Math.min(255, (t.c[2] + lift * 255) * f);
  }
  tex.needsUpdate = true;
  drawParts(plan());
}
const nameOf = hex => (COLORS.find(c => c[1] === hex) || [hex])[0];
function drawParts(cols) {
  const box = $("parts"); box.innerHTML = "";
  if (!body) return;
  body.groups.forEach((g, k) => {
    const row = document.createElement("div"); row.className = "part";
    const c = `rgb(${g.centre.map(Math.round).join(",")})`;
    row.innerHTML = `<i style="background:${c}" title="This garment's own colour"></i><div>${cols[k] ? nameOf(cols[k]) : "own colour"} <em style="color:var(--h-muted)">· ${Math.round(g.share * 100)}% of the texture</em></div><i style="background:${cols[k] || c}"></i>`;
    box.append(row);
  });
}
function status() {
  const [n] = COMBOS[S.combo];
  $("status").innerHTML = `<b>${S.person.replace(/_/g, " ")}</b>${S.orig ? "Own colours" : "Wada No. " + n}`;
}

// ---------- motions ----------
const animCache = new Map();
function rbClip(move, sex) {
  const file = `${sex}_${move}.max.fbx`;
  if (!animCache.has(file)) animCache.set(file, new FBXLoader().loadAsync(ANIM + encodeURI(file)).then(a => a.animations[0]).catch(() => null));
  return animCache.get(file);
}
async function play(move) {
  if (!actor) return;
  const who = actor; markMove(move);
  const clip = await rbClip(move, who.userData.sex);
  if (who !== actor || !clip) return;
  const a = mixer.clipAction(clip);
  a.reset().setEffectiveWeight(1).fadeIn(.5).play();
  if (current && current !== a) current.fadeOut(.5);
  current = a;
  autoAt = clock.elapsedTime + Math.min(Math.max(clip.duration, 5), 12);
}
function nextAuto() { const pool = MOVES.filter(m => m[1] !== actor.userData.move); play(pool[Math.floor(Math.random() * pool.length)][1]); autoAt = clock.elapsedTime + 30; }
function markMove(m) { actor.userData.move = m; document.querySelectorAll("#moves .mv").forEach(b => b.classList.toggle("on", b.dataset.m === m)); }
function drawMoves() {
  const box = $("moves"); box.innerHTML = "";
  const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = "Moves"; box.append(lab);
  const a = document.createElement("button"); a.className = "chip" + (S.auto ? " on" : ""); a.textContent = "On its own"; a.title = "Switch to a new motion every few seconds";
  a.onclick = () => { S.auto = !S.auto; a.classList.toggle("on", S.auto); if (S.auto) autoAt = 0; save(); };
  box.append(a);
  MOVES.forEach(([t, m]) => { const b = document.createElement("button"); b.className = "chip mv"; b.dataset.m = m; b.textContent = t; b.onclick = () => { S.auto = false; a.classList.remove("on"); save(); play(m); }; box.append(b); });
}

// ---------- combinations panel ----------
function chip(text, on, fn) { const b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.textContent = text; b.onclick = fn; return b; }
function drawCombo() {
  const [n, ids] = COMBOS[S.combo];
  $("cnum").textContent = `No. ${n} of 348`;
  const now = $("now"); now.innerHTML = "";
  ids.forEach(i => { const el = document.createElement("i"); el.style.background = COLORS[i][1]; el.title = COLORS[i][0] + " — show combinations with it"; el.onclick = () => { S.has = i; drawGrid(); save(); }; now.append(el); });
  $("names").innerHTML = ids.map(i => `${COLORS[i][0]} <em>${COLORS[i][1]}</em>`).join("<br>");
  status();
}
function visible() { return COMBOS.map((c, i) => i).filter(i => (!S.count || COMBOS[i][1].length === S.count) && (S.has == null || COMBOS[i][1].includes(S.has))); }
function drawGrid() {
  const cx = $("counts"); cx.innerHTML = "";
  [[0, "All"], [2, "2 colours"], [3, "3"], [4, "4"]].forEach(([n, t]) => cx.append(chip(t, S.count === n, () => { S.count = n; drawGrid(); save(); })));
  const has = $("has"); has.classList.toggle("show", S.has != null);
  if (S.has != null) { has.querySelector("i").style.background = COLORS[S.has][1]; has.querySelector("span").textContent = "With " + COLORS[S.has][0]; }
  const grid = $("cgrid"); grid.innerHTML = "";
  const list = visible(); $("shown").textContent = list.length + " shown";
  list.forEach(i => {
    const [n, ids] = COMBOS[i];
    const b = document.createElement("button"); b.className = "combo" + (i === S.combo ? " on" : ""); b.title = ids.map(j => COLORS[j][0]).join(", ");
    b.innerHTML = `<div class="bar">${ids.map(j => `<i style="background:${COLORS[j][1]}"></i>`).join("")}</div><small>${n}</small>`;
    b.onclick = () => pick(i); grid.append(b);
  });
}
$("hasx").onclick = () => { S.has = null; drawGrid(); save(); };
function pick(i) { S.combo = i; S.perm = 0; S.orig = false; $("orig").classList.remove("on"); save(); drawCombo(); drawGrid(); recolour(); $("cgrid").querySelector(".combo.on")?.scrollIntoView({ block: "nearest" }); }
function step(d) { const list = visible(); if (!list.length) return; const at = list.indexOf(S.combo); pick(list[((at < 0 ? 0 : at + d) + list.length) % list.length]); }
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("random").onclick = () => { const list = visible(); pick(list[Math.floor(Math.random() * list.length)]); };
$("swap").onclick = () => { S.perm++; save(); recolour(); };
$("orig").onclick = () => { S.orig = !S.orig; $("orig").classList.toggle("on", S.orig); save(); recolour(); status(); };
$("front").onclick = () => { const r = Math.hypot(camera.position.x, camera.position.z); camera.position.set(0, camera.position.y, r); };
$("shot").onclick = () => { renderer.render(scene, camera); const a = document.createElement("a"); a.href = renderer.domElement.toDataURL("image/png"); a.download = `outfit-${S.person}-wada-${COMBOS[S.combo][0]}.png`; a.click(); };
document.addEventListener("keydown", e => {
  if (e.target.closest?.("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
  else if (e.key.toLowerCase() === "r") $("random").click();
  else if (e.key.toLowerCase() === "s") $("swap").click();
  else if (e.key.toLowerCase() === "o") $("orig").click();
});

if (!(S.combo >= 0 && S.combo < COMBOS.length)) S.combo = 0;
if (first) { const three = COMBOS.map((c, i) => i).filter(i => COMBOS[i][1].length === 3); S.combo = three[Math.floor(Math.random() * three.length)]; }
$("orig").classList.toggle("on", S.orig);
resize(); drawPeople(); drawMoves(); drawCombo(); drawGrid(); loadPerson();
window.outfit = { S, recolour, pick, get body() { return body; } };
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
