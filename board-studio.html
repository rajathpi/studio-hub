<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Studio</title>
<meta name="description" content="Keyboard-first diagram board for explaining systems live: flat blocks, tidy arrows, groups, autosave, PNG/SVG export.">
<!-- Inter Tight from jsdelivr: the hub's smoke test allows only that CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter-tight@5.2.7/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter-tight@5.2.7/600.css">
<style>
  :root { --ink:#1d1d1b; --dim:#6f6c66; --line:#e3e0d8; --sel:#2f6fde; --bg:#fbfaf7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 "Inter Tight", "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  #bar { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; z-index:5; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  .grp { display:flex; gap:2px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  button, select { font:inherit; color:var(--ink); background:transparent; border:0; border-radius:7px; padding:6px 9px; cursor:pointer; }
  button:hover, select:hover { background:#f0eee8; }
  button.on { background:#e8effc; color:var(--sel); }
  .ico { display:grid; place-items:center; width:32px; height:32px; padding:0; position:relative; }
  .ico small { position:absolute; right:2px; bottom:0; font-size:9px; color:var(--dim); }
  .stamp { margin-left:auto; color:var(--dim); font-size:12px; background:rgba(251,250,247,.9); padding:4px 8px; border-radius:6px; }
  #hint { position:fixed; left:12px; bottom:12px; color:var(--dim); font-size:12.5px; background:rgba(251,250,247,.92); padding:6px 10px; border-radius:8px; z-index:5; }
  #stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  #stage.panning { cursor:grabbing; }
  #edit { position:fixed; z-index:9; display:none; resize:none; border:2px solid var(--sel); border-radius:8px; padding:6px 8px; font:600 16px/1.3 "Inter Tight", "Segoe UI", system-ui, sans-serif; background:#fff; color:var(--ink); outline:none; box-shadow:0 6px 24px rgba(0,0,0,.12); }
  #help { position:fixed; inset:0; display:none; place-items:center; background:rgba(20,20,18,.35); z-index:20; }
  #help.show { display:grid; }
  #help .card { background:#fff; border-radius:14px; padding:22px 26px; max-width:620px; width:calc(100% - 32px); max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
  #help h2 { margin:0 0 10px; font-size:18px; }
  #help .card { max-width:980px; }
  .dim { color:var(--dim); }
  .keys { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:6px 26px; }
  .keys h3 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:12px 0 4px; }
  .keys table { border-collapse:collapse; width:100%; }
  .keys td { padding:5px 10px 5px 0; border-bottom:1px solid #f0eee8; vertical-align:top; font-size:13.5px; }
  .keys td:first-child { white-space:nowrap; width:1%; }
  #mode { position:fixed; top:64px; left:50%; transform:translateX(-50%); display:none; z-index:6; background:#1d1d1b; color:#fff; padding:8px 14px; border-radius:10px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.18); max-width:calc(100% - 24px); }
  #mode kbd { background:#3a3833; border-color:#55524b; color:#fff; }
  #cheat { display:none; }
  body.cheat > *:not(#cheat) { display:none !important; }
  body.cheat { overflow:auto; background:#fbfaf7; }
  body.cheat #cheat { display:block; max-width:1500px; margin:0 auto; padding:44px 48px; }
  #cheat header { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:6px; }
  #cheat h1 { margin:0; font-size:30px; } #cheat h1 span { color:var(--dim); font-weight:500; }
  #cheat header p { margin:0; color:var(--dim); }
  #cheat .keys { grid-template-columns:repeat(3, 1fr); gap:4px 40px; }
  #cheat .keys h3 { font-size:13px; margin-top:22px; color:#2f6fde; }
  #cheat .keys td { font-size:15.5px; padding:7px 12px 7px 0; }
  #cheat kbd { font-size:13.5px; padding:3px 8px; }
  .plus { color:var(--dim); margin:0 3px; font-size:12px; }
  .alt { display:inline-block; width:12px; }
  kbd { font:12px/1 "Segoe UI", system-ui, sans-serif; background:#f3f1ec; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:2px 6px; white-space:nowrap; }
  body.present #bar, body.present #hint { display:none; }
  .lbl { font-family:"Inter Tight", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="bar">
  <div class="grp">
    <select id="boardSel" title="Switch board"></select>
    <button id="newBtn" title="New empty board">New</button>
    <button id="renBtn" title="Rename this board">Rename</button>
    <button id="delBtn" title="Delete this board">Delete</button>
  </div>
  <div class="grp" id="palette"></div>
  <div class="grp">
    <button id="pngBtn" title="Save as PNG">PNG</button>
    <button id="svgBtn" title="Save as SVG">SVG</button>
    <button id="jsonBtn" title="Save the board as a file you can open again">Save file</button>
    <button id="openBtn" title="Open a saved board file">Open</button>
    <button id="helpBtn" title="Keyboard shortcuts (?)">Keys</button>
  </div>
  <span class="stamp" id="stamp"></span>
</div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<textarea id="edit" rows="1" spellcheck="false"></textarea>
<div id="hint"><kbd>Tab</kbd> next block · <kbd>←↑→↓</kbd> move around · <kbd>C</kbd> connect · <kbd>/</kbd> type a chain · <kbd>?</kbd> all keys</div>
<div id="help"><div class="card"><h2>Keys</h2><div id="helpBody" class="keys"></div><p class="dim" style="margin:12px 0 0;font-size:13px">The mouse works too: double-click to add, drag to move, Shift+click to connect, <span class="ctlname">Ctrl</span>+click to select several.</p></div></div>
<div id="mode"></div>
<div id="cheat"><header><h1>Board <span>keyboard shortcuts</span></h1><p>Everything works without a mouse · <span id="osname"></span></p></header><div id="cheatBody" class="keys"></div></div>
<script>
(() => {
// ================= block types =================
const TYPES = [
  ["service", "Service", "#e9f0fb"], ["database", "Database", "#e6f4ec"], ["queue", "Queue", "#fbf1e1"], ["event", "Event", "#fdeaea"],
  ["gateway", "Gateway", "#efe9fb"], ["board", "Board / app", "#eef2f6"], ["person", "Person", "#f3ece4"], ["clock", "Schedule", "#e8f3f5"],
  ["secret", "Secret", "#f6efd9"], ["note", "Note", "#fff6c9"],
];
const FILL = Object.fromEntries(TYPES.map((t) => [t[0], t[2]]));
const ICON = {
  service: '<path d="M7 19 11.5 5M9.6 11.2 16 19"/><path d="M5 5h3"/>',
  database: '<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>',
  queue: '<rect x="4" y="5" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="15" width="16" height="4" rx="1"/>',
  event: '<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  gateway: '<path d="M5 20V9a7 7 0 0 1 14 0v11"/><path d="M9 20v-7h6v7"/>',
  board: '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9.2 4v16M14.8 4v16"/><path d="M5.5 7.5h2M11 7.5h2M11 10.5h2M16.6 7.5h2"/>',
  person: '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-3.8 3.6-5.6 7-5.6s6.2 1.8 7 5.6"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
  secret: '<circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H20M17 12v3M20 12v2.4"/>',
  note: '<path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5M8 9h8M8 12.5h5"/>',
};
const FONT = '600 16px "Inter Tight", "Segoe UI", system-ui, sans-serif';
const SUBFONT = '500 12.5px "Inter Tight", "Segoe UI", system-ui, sans-serif';
const EDGEFONT = '500 13px "Inter Tight", "Segoe UI", system-ui, sans-serif';
const PADX = 14, ICONW = 34, MINW = 120, SNAP = 10;

// ================= starter boards (one is picked at random on first open) =================
const EXAMPLES = {
  "Photo upload": {
    nodes: [
      { id: "n1", type: "person", title: "User", x: 60, y: 120 },
      { id: "n2", type: "gateway", title: "API", x: 290, y: 120 },
      { id: "n3", type: "service", title: "Upload service", x: 540, y: 120 },
      { id: "n4", type: "database", title: "Photo storage", sub: "Object store", x: 830, y: 120 },
      { id: "n5", type: "queue", title: "Resize jobs", x: 540, y: 310 },
      { id: "n6", type: "service", title: "Resizer", sub: "Workers", x: 830, y: 310 },
    ],
    edges: [
      { id: "e1", a: "n1", b: "n2", label: "upload" }, { id: "e2", a: "n2", b: "n3" }, { id: "e3", a: "n3", b: "n4", label: "original" },
      { id: "e4", a: "n3", b: "n5", dashed: true }, { id: "e5", a: "n5", b: "n6", dashed: true }, { id: "e6", a: "n6", b: "n4", label: "thumbnails" },
    ],
    groups: [{ id: "g1", label: "Backend", members: ["n2", "n3", "n4", "n5", "n6"] }],
  },
  "Online shop checkout": {
    nodes: [
      { id: "n1", type: "person", title: "Shopper", x: 60, y: 120 },
      { id: "n2", type: "board", title: "Web shop", sub: "Checkout page", x: 310, y: 120 },
      { id: "n3", type: "service", title: "Orders", x: 570, y: 120 },
      { id: "n4", type: "service", title: "Payments", x: 810, y: 120 },
      { id: "n5", type: "gateway", title: "Card provider", x: 1080, y: 120 },
      { id: "n6", type: "database", title: "Orders DB", x: 570, y: 310 },
      { id: "n7", type: "event", title: "Order placed", x: 810, y: 310 },
      { id: "n8", type: "service", title: "Email", sub: "Receipts", x: 1080, y: 310 },
    ],
    edges: [
      { id: "e1", a: "n1", b: "n2" }, { id: "e2", a: "n2", b: "n3", label: "place order" }, { id: "e3", a: "n3", b: "n4", label: "charge" },
      { id: "e4", a: "n4", b: "n5", two: true }, { id: "e5", a: "n3", b: "n6", two: true }, { id: "e6", a: "n3", b: "n7", dashed: true },
      { id: "e7", a: "n7", b: "n8", dashed: true },
    ],
    groups: [{ id: "g1", label: "Shop backend", members: ["n3", "n4", "n6", "n7", "n8"] }],
  },
  "Chat app": {
    nodes: [
      { id: "n1", type: "person", title: "Alice", x: 60, y: 120 },
      { id: "n2", type: "gateway", title: "WebSocket gateway", x: 330, y: 120 },
      { id: "n3", type: "service", title: "Chat service", x: 640, y: 120 },
      { id: "n4", type: "database", title: "Message history", x: 330, y: 310 },
      { id: "n5", type: "queue", title: "Message bus", x: 640, y: 310 },
      { id: "n6", type: "service", title: "Push notifications", x: 940, y: 310 },
      { id: "n7", type: "person", title: "Bob", x: 1200, y: 310 },
    ],
    edges: [
      { id: "e1", a: "n1", b: "n2", two: true }, { id: "e2", a: "n2", b: "n3", two: true }, { id: "e3", a: "n3", b: "n4", label: "store" },
      { id: "e4", a: "n3", b: "n5", dashed: true }, { id: "e5", a: "n5", b: "n6", dashed: true }, { id: "e6", a: "n6", b: "n7", label: "notify" },
    ],
    groups: [{ id: "g1", label: "Servers", members: ["n2", "n3", "n4", "n5", "n6"] }],
  },
  "Nightly report": {
    nodes: [
      { id: "n1", type: "clock", title: "Every night", sub: "02:00", x: 60, y: 120 },
      { id: "n2", type: "service", title: "Export job", x: 330, y: 120 },
      { id: "n3", type: "database", title: "Sales DB", x: 330, y: 310 },
      { id: "n4", type: "database", title: "Data lake", sub: "Parquet files", x: 600, y: 120 },
      { id: "n5", type: "service", title: "Report builder", x: 880, y: 120 },
      { id: "n6", type: "board", title: "Dashboard", x: 880, y: 310 },
      { id: "n7", type: "person", title: "Managers", x: 1140, y: 310 },
      { id: "n8", type: "secret", title: "DB password", x: 60, y: 310 },
    ],
    edges: [
      { id: "e1", a: "n1", b: "n2", dashed: true, label: "trigger" }, { id: "e2", a: "n3", b: "n2", label: "read" }, { id: "e3", a: "n8", b: "n3", dashed: true },
      { id: "e4", a: "n2", b: "n4", label: "write" }, { id: "e5", a: "n4", b: "n5" }, { id: "e6", a: "n5", b: "n6" }, { id: "e7", a: "n6", b: "n7", label: "view" },
    ],
    groups: [{ id: "g1", label: "Cloud", members: ["n2", "n3", "n4", "n5", "n6"] }],
  },
};

// ================= storage =================
const KEY = "board-studio-v1";
function loadAll() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.boards && Object.keys(s.boards).length) return s; } catch (e) {}
  const names = Object.keys(EXAMPLES), pick = names[Math.floor(Math.random() * names.length)];
  return { current: pick, boards: { [pick]: JSON.parse(JSON.stringify(EXAMPLES[pick])) } };
}
let store = loadAll();
let B = store.boards[store.current] || Object.values(store.boards)[0];
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

// ================= undo =================
let undo = [], redo = [];
function snap() { undo.push(JSON.stringify(B)); if (undo.length > 200) undo.shift(); redo = []; }
function restore(json) { const b = JSON.parse(json); store.boards[store.current] = B = b; sel = { nodes: new Set(), edge: null, group: null }; arrowMode = false; render(); save(); status(); }

// ================= geometry =================
const ctx = document.createElement("canvas").getContext("2d");
const tw = (s, f) => { ctx.font = f; return ctx.measureText(s || "").width; };
function size(n) {
  const w = Math.max(MINW, tw(n.title || " ", FONT) + 2 * PADX + ICONW, n.sub ? tw(n.sub, SUBFONT) + 2 * PADX + ICONW : 0);
  return [Math.ceil(w), n.sub ? 62 : 50];
}
function rectOf(n) { const [w, h] = size(n); return { x: n.x - w / 2, y: n.y - h / 2, w, h }; }
function clip(a, b, hw, hh) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9));
  return [a[0] + dx * t, a[1] + dy * t];
}
function edgeGeom(e) {
  const A = byId(e.a), Bn = byId(e.b);
  if (!A || !Bn) return null;
  const [aw, ah] = size(A), [bw, bh] = size(Bn);
  const p1 = clip([A.x, A.y], [Bn.x, Bn.y], aw / 2 + 7, ah / 2 + 7), p2 = clip([Bn.x, Bn.y], [A.x, A.y], bw / 2 + 7, bh / 2 + 7);
  return { p1, p2 };
}
function groupRect(g) {
  const rs = g.members.map(byId).filter(Boolean).map(rectOf);
  if (!rs.length) return null;
  const x0 = Math.min(...rs.map((r) => r.x)) - 24, y0 = Math.min(...rs.map((r) => r.y)) - 38;
  const x1 = Math.max(...rs.map((r) => r.x + r.w)) + 24, y1 = Math.max(...rs.map((r) => r.y + r.h)) + 24;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
const byId = (id) => B.nodes.find((n) => n.id === id);
const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const snapv = (v) => Math.round(v / SNAP) * SNAP;

// ================= view =================
const svg = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };
function toWorld(cx, cy) { return [(cx - view.x) / view.k, (cy - view.y) / view.k]; }
function toScreen(x, y) { return [x * view.k + view.x, y * view.k + view.y]; }
function contentBox() {
  const rs = [...B.nodes.map(rectOf), ...B.groups.map(groupRect).filter(Boolean)];
  if (!rs.length) return null;
  const x0 = Math.min(...rs.map((r) => r.x)), y0 = Math.min(...rs.map((r) => r.y));
  return { x: x0, y: y0, w: Math.max(...rs.map((r) => r.x + r.w)) - x0, h: Math.max(...rs.map((r) => r.y + r.h)) - y0 };
}
function fit() {
  const c = contentBox(), W = innerWidth, H = innerHeight, top = document.body.classList.contains("present") ? 30 : 80;
  if (!c) { view = { x: W / 2, y: H / 2, k: 1 }; render(); return; }
  const k = Math.min((W - 80) / c.w, (H - top - 60) / c.h, 1.6);
  view = { k, x: (W - c.w * k) / 2 - c.x * k, y: top + (H - top - 40 - c.h * k) / 2 - c.y * k };
  render();
}

// ================= selection =================
let sel = { nodes: new Set(), edge: null, group: null };
function selectNode(id, add) {
  if (!add) sel = { nodes: new Set(), edge: null, group: null };
  sel.edge = sel.group = null;
  if (add && sel.nodes.has(id)) sel.nodes.delete(id); else sel.nodes.add(id);
}
const one = () => (sel.nodes.size === 1 ? byId([...sel.nodes][0]) : null);

// ================= render =================
const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function drawSVG(forExport) {
  let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a877f"/></marker>` +
    `<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fde"/></marker>` +
    `<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dcd8cf"/></pattern></defs>`;
  if (!forExport) s += `<rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#dots)"/>`;
  // groups
  B.groups.forEach((g) => {
    const r = groupRect(g); if (!r) return;
    const on = sel.group === g.id && !forExport;
    s += `<g data-group="${g.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="16" fill="#f4f2ec" fill-opacity=".85" stroke="${on ? "#2f6fde" : "#cfcbc2"}" stroke-width="${on ? 2 : 1.3}" stroke-dasharray="${on ? "" : "5 5"}"/>` +
      `<text class="lbl" data-group="${g.id}" x="${r.x + 14}" y="${r.y + 22}" font-size="13.5" font-weight="600" fill="#6f6c66">${esc(g.label)}</text></g>`;
  });
  // edges (a fat invisible line makes them easy to click)
  B.edges.forEach((e) => {
    const gm = edgeGeom(e); if (!gm) return;
    const on = sel.edge === e.id && !forExport, col = on ? "#2f6fde" : "#8a877f", m = on ? "ahs" : "ah";
    const { p1, p2 } = gm;
    s += `<g data-edge="${e.id}">` + (forExport ? "" : `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="transparent" stroke-width="16"/>`) +
      `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${col}" stroke-width="${on ? 2.4 : 1.9}" stroke-linecap="round" ${e.dashed ? 'stroke-dasharray="7 6"' : ""} marker-end="url(#${m})" ${e.two ? `marker-start="url(#${m})"` : ""}/>`;
    if (e.label) {
      const flat = Math.abs(p2[1] - p1[1]) < 8, mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2 - (flat ? 17 : 0), w = tw(e.label, EDGEFONT) + 16;
      s += `<rect x="${mx - w / 2}" y="${my - 12}" width="${w}" height="24" rx="12" fill="#fbfaf7" stroke="${on ? "#2f6fde" : "none"}"/><text class="lbl" x="${mx}" y="${my + 4.5}" text-anchor="middle" font-size="13" font-weight="500" fill="#6f6c66">${esc(e.label)}</text>`;
    }
    s += `</g>`;
  });
  // nodes
  B.nodes.forEach((n) => {
    const { x, y, w, h } = rectOf(n), on = sel.nodes.has(n.id) && !forExport;
    if (!forExport && n.id === connectFrom) s += `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="15" fill="none" stroke="#2f6fde" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<g data-node="${n.id}" class="node">` +
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="11" fill="${FILL[n.type] || FILL.service}" stroke="${on ? "#2f6fde" : "rgba(0,0,0,.06)"}" stroke-width="${on ? 2.2 : 1}"/>` +

}
function zoomBy(f) {
  const k = Math.min(3, Math.max(0.2, view.k * f)), cx = innerWidth / 2, cy = innerHeight / 2;
  view.x = cx - (cx - view.x) * (k / view.k); view.y = cy - (cy - view.y) * (k / view.k); view.k = k; render();
}
function duplicate() {
  if (!sel.nodes.size) return;
  snap();
  const map = {};
  [...sel.nodes].map(byId).forEach((n) => { const c = JSON.parse(JSON.stringify(n)); c.id = uid("n"); c.x += 40; c.y += 40; map[n.id] = c.id; B.nodes.push(c); });
  B.edges.filter((e) => map[e.a] && map[e.b]).forEach((e) => B.edges.push(Object.assign({}, e, { id: uid("e"), a: map[e.a], b: map[e.b] })));
  sel = { nodes: new Set(Object.values(map)), edge: null, group: null }; cursor = Object.values(map)[0];
  render(); save();
}


// ================= copy, cut, paste =================
// Kept in localStorage, so a copy can be pasted into another board or another tab.
const CLIP = "board-studio-clipboard";
let pasteRound = 0;
function copySelection() {
  if (!sel.nodes.size) return false;
  const ids = new Set(sel.nodes);
  const data = {
    nodes: B.nodes.filter((n) => ids.has(n.id)),
    edges: B.edges.filter((e) => ids.has(e.a) && ids.has(e.b)),
    groups: B.groups.filter((g) => g.members.length && g.members.every((m) => ids.has(m))),
  };
  try { localStorage.setItem(CLIP, JSON.stringify(data)); } catch (e) { return false; }
  pasteRound = 0;
  return true;
}
function pasteClipboard() {
  let data;
  try { data = JSON.parse(localStorage.getItem(CLIP)); } catch (e) { data = null; }
  if (!data || !data.nodes || !data.nodes.length) return false;
  snap();
  pasteRound++;
  const map = {}, off = 40 * pasteRound;
  data.nodes.forEach((n) => { const c = Object.assign({}, n, { id: uid("n"), x: n.x + off, y: n.y + off }); map[n.id] = c.id; B.nodes.push(c); });
  data.edges.forEach((e) => B.edges.push(Object.assign({}, e, { id: uid("e"), a: map[e.a], b: map[e.b] })));
  (data.groups || []).forEach((g) => B.groups.push({ id: uid("g"), label: g.label, members: g.members.map((m) => map[m]) }));
  sel = { nodes: new Set(Object.values(map)), edge: null, group: null }; cursor = Object.values(map)[0];
  render(); save(); keepVisible(byId(cursor));
  return true;
}

// ================= status line =================
function status() {
  const m = document.getElementById("mode");
  let t = "";
  if (connectFrom) t = `Connecting from “${esc(byId(connectFrom)?.title || "")}”: arrow keys to pick the other block, <kbd>Enter</kbd> to connect, <kbd>Esc</kbd> to cancel`;
  if (!t && arrowMode) t = `Arrow mode · <kbd>←↑→↓</kbd> next arrow · <kbd>D</kbd> dashed · <kbd>B</kbd> two-way · <kbd>R</kbd> reverse · <kbd>Enter</kbd> label · <kbd>Delete</kbd> remove · <kbd>Esc</kbd> back to blocks`;
  m.innerHTML = t; m.style.display = t ? "block" : "none";
}

// ================= keys =================
function togglePresent() { document.body.classList.toggle("present"); fit(); }
document.addEventListener("keydown", (ev) => {
  if (editing || ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") return;
  const help = document.getElementById("help");
  if (help.classList.contains("show")) { if (ev.key === "Escape" || ev.key === "?" || ev.key === "F1") { ev.preventDefault(); help.classList.remove("show"); } return; }
  const k = ev.key, low = k.length === 1 ? k.toLowerCase() : k;
  const stop = () => ev.preventDefault();
  // Board names: Alt+N / Alt+R (Option on a Mac), matched by the physical key because
  // Option+letter types a symbol on a Mac. AltGr (Ctrl+Alt on Windows) is not Alt here.
  if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.code === "KeyN") { stop(); document.getElementById("newBtn").onclick(); return; }
  if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.code === "KeyR") { stop(); document.getElementById("renBtn").onclick(); return; }
  // On Swedish (and most non-US) keyboards [ ] | \ come from AltGr (Windows reports Ctrl+Alt) or
  // Option (Mac). When a modifier produced a symbol, treat it as that symbol, not as a shortcut.
  const symbol = k.length === 1 && !/[\p{L}\p{N}]/u.test(k);
  const viaAltGr = symbol && ev.altKey;
  const ctl = (ev.ctrlKey || ev.metaKey) && !viaAltGr, alt = ev.altKey && !viaAltGr;

  // undo / files / boards
  if (ctl && low === "z") { stop(); if (ev.shiftKey) { if (redo.length) { undo.push(JSON.stringify(B)); restore(redo.pop()); } } else if (undo.length) { redo.push(JSON.stringify(B)); restore(undo.pop()); } return; }
  if (ctl && low === "y") { stop(); if (redo.length) { undo.push(JSON.stringify(B)); restore(redo.pop()); } return; }
  if (ctl && low === "s") { stop(); document.getElementById("jsonBtn").onclick(); return; }
  if (ctl && low === "o") { stop(); document.getElementById("openBtn").onclick(); return; }
  if (ctl && low === "e") { stop(); document.getElementById(ev.shiftKey ? "svgBtn" : "pngBtn").onclick(); return; }
  if (ctl && low === "a") { stop(); sel = { nodes: new Set(B.nodes.map((n) => n.id)), edge: null, group: null }; render(); return; }
  if (ctl && low === "d") { stop(); duplicate(); return; }
  if (ctl && low === "c") { if (copySelection()) stop(); return; }
  if (ctl && low === "x") { if (copySelection()) { stop(); removeSelection(); } return; }
  if (ctl && low === "v") { if (pasteClipboard()) stop(); return; }
  if (ctl && k === "0") { stop(); fit(); return; }
  if (ctl) return;
  if (alt && DIRS[k]) {
    stop(); if (!sel.nodes.size) return; snap();
    const d = ev.shiftKey ? 50 : SNAP, [dx, dy] = DIRS[k];
    sel.nodes.forEach((id) => { const n = byId(id); n.x += dx * d; n.y += dy * d; }); render(); save(); return;
  }
  if (alt) return;
  if (k === "Escape" && document.body.classList.contains("present")) { stop(); togglePresent(); return; }

  if (arrowMode) {
    const cur = B.edges.find((q) => q.id === sel.edge);
    if (!cur) { arrowMode = false; status(); }
    else if (DIRS[k]) { stop(); moveArrow(k); return; }
    else if (k === "Escape") { stop(); exitArrowMode(true); return; }
    else if (k === "Delete" || k === "Backspace") {
      stop(); const m = edgeMid(cur); snap();
      B.edges = B.edges.filter((q) => q !== cur); save();
      const next = nearestEdge(m, B.edges);
      if (next) selectEdge(next); else exitArrowMode(false);
      return;
    }
    else if (low === "a") { stop(); return; }
    else if (!["d", "b", "r", "Enter"].includes(low)) { arrowMode = false; status(); } // any other key: back to blocks
  }
  const e = sel.edge && B.edges.find((q) => q.id === sel.edge);
  if (DIRS[k]) { stop(); moveTo(k, ev.shiftKey); status(); return; }
  if (connectFrom) {
    if (k === "Enter") { stop(); const to = one(); if (to) connect(connectFrom, to.id); connectFrom = null; status(); return; }
    if (k === "Escape") { stop(); sel = { nodes: new Set([connectFrom]), edge: null, group: null }; cursor = connectFrom; connectFrom = null; render(); status(); return; }
  }
  if (k === "Tab") { stop(); addNext(ev.shiftKey ? "down" : "right"); }
  else if (k === "Enter") { stop(); if (one()) startEdit("node", one().id); else if (e) startEdit("edge", e.id); else if (sel.group) startEdit("group", sel.group); }
  else if (k === "Delete" || k === "Backspace") { stop(); removeSelection(); }
  else if (k === "Escape") {
    if (sel.group) { const g = B.groups.find((q) => q.id === sel.group); sel = { nodes: new Set(g && cursor && g.members.includes(cursor) ? [cursor] : []), edge: null, group: null }; }
    else sel = { nodes: new Set(), edge: null, group: null };
    render();
  }
  else if (k === "/" || low === "k") { stop(); startEdit("cmd"); }
  else if (/^[0-9]$/.test(k) && sel.nodes.size) setType(TYPES[(+k + 9) % 10][0]);
  else if (k === "0") fit();
  else if (/^[1-9]$/.test(k)) setType(TYPES[+k - 1][0]);
  else if (k === "+" || k === "=") zoomBy(1.2);
  else if (k === "-" || k === "_") zoomBy(1 / 1.2);
  else if (low === "n") { stop(); if (one()) addNext("down", false); else { const [x, y] = toWorld(innerWidth / 2, innerHeight / 2); addNode(x, y); } }
  else if (low === "c") { stop(); if (one()) { connectFrom = one().id; cursor = connectFrom; } status(); }
  else if (low === "a") { stop(); enterArrowMode(); }
  else if (low === "d" && e) { snap(); e.dashed = !e.dashed; render(); save(); }
  else if (low === "b" && e) { snap(); e.two = !e.two; render(); save(); }
  else if (low === "r" && e) { snap(); [e.a, e.b] = [e.b, e.a]; render(); save(); }
  else if (low === "g" && ev.shiftKey) { stop(); const n = one() || byId(cursor); const g = n && B.groups.find((q) => q.members.includes(n.id)); if (g) { sel = { nodes: new Set(), edge: null, group: g.id }; render(); } }
  else if (low === "g") { stop(); makeGroup(); } // stop the "g" landing in the new label
  else if (low === "f") { stop(); togglePresent(); }
  else if (k === "[" || k === "]" || k === "PageUp" || k === "PageDown") { stop(); const names = Object.keys(store.boards), i = names.indexOf(store.current); switchTo(names[(i + (k === "]" || k === "PageDown" ? 1 : -1) + names.length) % names.length]); }
  else if (k === "?" || k === "F1") { stop(); help.classList.add("show"); }
  status();
});

// ================= toolbar =================
const pal = document.getElementById("palette");
pal.innerHTML = TYPES.map(([t, name], i) => `<button class="ico" data-type="${t}" title="${name} (${(i + 1) % 10})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a3833" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[t]}</svg><small>${(i + 1) % 10}</small></button>`).join("");
pal.addEventListener("click", (ev) => { const b = ev.target.closest("[data-type]"); if (b) setType(b.dataset.type); });
function paletteState() {
  const cur = one() ? one().type : lastType;
  pal.querySelectorAll("[data-type]").forEach((b) => b.classList.toggle("on", b.dataset.type === cur));
}
const boardSel = document.getElementById("boardSel");
function fillBoards() { boardSel.innerHTML = Object.keys(store.boards).map((n) => `<option ${n === store.current ? "selected" : ""}>${esc(n)}</option>`).join(""); }
function switchTo(name) { store.current = name; B = store.boards[name]; undo = []; redo = []; sel = { nodes: new Set(), edge: null, group: null }; save(); fillBoards(); fit(); }
boardSel.addEventListener("change", () => switchTo(boardSel.value));
document.getElementById("newBtn").onclick = () => {
  let name = prompt("Name for the new board:", "Untitled"); if (!name) return; name = name.trim();
  while (store.boards[name]) name += " 2";
  store.boards[name] = { nodes: [], edges: [], groups: [] }; switchTo(name);
};
document.getElementById("renBtn").onclick = () => {
  const name = (prompt("Rename board:", store.current) || "").trim(); if (!name || store.boards[name]) return;
  store.boards[name] = B; delete store.boards[store.current]; store.current = name; save(); fillBoards();
};
document.getElementById("delBtn").onclick = () => {
  if (!confirm(`Delete "${store.current}"? This can't be undone.`)) return;
  delete store.boards[store.current];
  if (!Object.keys(store.boards).length) store.boards["Untitled"] = { nodes: [], edges: [], groups: [] };
  switchTo(Object.keys(store.boards)[0]);
};
document.getElementById("helpBtn").onclick = () => document.getElementById("help").classList.add("show");
document.getElementById("help").addEventListener("click", (ev) => { if (ev.target.id === "help") ev.currentTarget.classList.remove("show"); });

// ================= export =================
function exportSVG() {
  const c = contentBox() || { x: 0, y: 0, w: 200, h: 100 }, pad = 30;
  const text = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${c.x - pad} ${c.y - pad} ${c.w + 2 * pad} ${c.h + 2 * pad}" width="${c.w + 2 * pad}" height="${c.h + 2 * pad}">` +
    `<style>.lbl{font-family:"Inter Tight","Segoe UI",system-ui,sans-serif}</style><rect x="${c.x - pad}" y="${c.y - pad}" width="${c.w + 2 * pad}" height="${c.h + 2 * pad}" fill="#ffffff"/>${drawSVG(true)}</svg>`;
  return { text, w: c.w + 2 * pad, h: c.h + 2 * pad };
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const fname = () => store.current.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "board";
document.getElementById("svgBtn").onclick = () => download(new Blob([exportSVG().text], { type: "image/svg+xml" }), fname() + ".svg");
document.getElementById("pngBtn").onclick = () => {
  const { text, w, h } = exportSVG(), img = new Image(), scale = 2;
  img.onload = () => { const c = document.createElement("canvas"); c.width = w * scale; c.height = h * scale; const g = c.getContext("2d"); g.scale(scale, scale); g.drawImage(img, 0, 0); c.toBlob((b) => download(b, fname() + ".png")); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(text);
};
document.getElementById("jsonBtn").onclick = () => download(new Blob([JSON.stringify({ name: store.current, board: B }, null, 2)], { type: "application/json" }), fname() + ".board.json");
document.getElementById("openBtn").onclick = () => {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text()), b = d.board || d;
      if (!Array.isArray(b.nodes) || !Array.isArray(b.edges)) throw new Error("not a board file");
      b.groups = Array.isArray(b.groups) ? b.groups : [];
      let name = (d.name || inp.files[0].name.replace(/\.board\.json$|\.json$/, "")).trim() || "Opened";
      while (store.boards[name]) name += " 2";
      store.boards[name] = b; switchTo(name);
    } catch (e) { alert("That file isn't a board: " + e.message); }
  };
  inp.click();
};

// ================= start =================
const upd = new Date("2026-11-17T00:00:00"), days = Math.floor((Date.now() - upd) / 864e5);
document.getElementById("stamp").textContent = "Updated 17 Nov 2026 · " + (days <= 0 ? "today" : days === 1 ? "1 day ago" : days + " days ago");
addEventListener("resize", render);
window.__board = { get state() { return B; }, fit, view: () => view, examples: EXAMPLES, select: (ids) => { sel = { nodes: new Set(ids), edge: null, group: null }; cursor = ids[0]; render(); }, selection: () => sel, arrowMode: () => arrowMode };
fillBoards();
document.getElementById("helpBody").innerHTML = shortcutsHTML();
document.getElementById("cheatBody").innerHTML = shortcutsHTML();
document.getElementById("osname").textContent = MAC ? "Mac" : "Windows / Linux";
document.querySelectorAll(".ctlname").forEach((e) => (e.textContent = MAC ? "Cmd" : "Ctrl"));
if (/[?&]cheatsheet\b/.test(location.search)) document.body.classList.add("cheat");
Promise.all([document.fonts.load(FONT), document.fonts.load(SUBFONT)]).catch(() => {}).then(fit);
})();
