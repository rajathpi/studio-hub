<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Studio</title>
<meta name="description" content="Make QR codes for links, Wi-Fi, contacts and more in a dozen styles, each checked to scan. Or paste a screenshot to read one.">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: var(--h-font);
    background: var(--h-bg); color: var(--h-text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--h-panel); border-bottom: 1px solid var(--h-border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  button, .btn {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); color: var(--h-text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  button:hover, .btn:hover { background: var(--h-btn-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary, .btn.primary { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); font-weight: 600; }
  button.primary:hover, .btn.primary:hover { background: var(--h-accent-h); }
  button.tool.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); }
  button svg, .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  button.small { font-size: 12px; padding: 3px 8px; }
  kbd { font: 10px "SF Mono", Menlo, Consolas, monospace; opacity: .6; }
  body[data-mode="make"] [data-for="scan"], body[data-mode="scan"] [data-for="make"] { display: none !important; }

  /* ---------- make ---------- */
  #make { flex: 1; min-height: 0; display: flex; }
  aside { width: 320px; flex: none; overflow: auto; background: var(--h-panel); border-right: 1px solid var(--h-border); padding: 16px; }
  aside h2 { font-family: var(--h-head); font-size: 13px; font-weight: 700; letter-spacing: .01em; margin: 2px 0 10px; display: flex; align-items: center; gap: 8px; }
  aside h2 span { color: var(--h-muted); font-weight: 500; }
  aside h2 button { margin-left: auto; }
  .types { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
  .types button { padding: 5px 10px; }
  .field { display: block; margin-bottom: 10px; font-size: 12px; color: var(--h-muted); }
  .field > span { display: block; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=password], textarea, select {
    font: inherit; font-size: 13px; width: 100%; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--h-btn-border); background: var(--h-btn); color: var(--h-text);
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--h-accent2); outline-offset: -1px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--h-text2); margin-bottom: 10px; cursor: pointer; }
  .pw { display: flex; gap: 4px; }
  .pw input { flex: 1; }
  .rule { height: 1px; background: var(--h-border); margin: 16px 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .colors { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .colors label { font-size: 12px; color: var(--h-muted); display: flex; flex-direction: column; gap: 4px; }
  input[type=color] { width: 44px; height: 30px; padding: 2px; border-radius: 6px; border: 1px solid var(--h-btn-border); background: var(--h-btn); cursor: pointer; }
  input[type=color]:disabled { opacity: .35; cursor: default; }
  input[type=range] { width: 100%; accent-color: var(--h-accent); }
  .hint { font-size: 12px; color: var(--h-muted); line-height: 1.5; }

  #gridWrap { flex: 1; min-width: 0; overflow: auto; background: var(--h-deep); padding: 20px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
  .card { background: var(--h-panel); border: 1px solid var(--h-border); border-radius: 10px; padding: 12px; cursor: pointer; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 0 0 1px var(--h-border2), 0 6px 18px rgba(0,0,0,.08); }
  .card.on { box-shadow: 0 0 0 2px var(--h-text); }
  .card .prev { height: 210px; display: grid; place-items: center; position: relative; }
  .seg { position: absolute; top: 0; right: 0; display: flex; z-index: 1; }
  .seg button { font-size: 11px; padding: 2px 7px; border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--h-accent); border-color: var(--h-accent); color: var(--h-on-accent); }
  .sw { display: flex; height: 16px; border-radius: 5px; overflow: hidden; border: 1px solid var(--h-border); margin: -2px 0 10px; }
  .sw i { flex: 1; }
  .credit { font-size: 11px; color: var(--h-muted); margin-top: 16px; }
  .credit a { color: inherit; }
  .card .prev canvas { max-width: 100%; max-height: 100%; display: block; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; }
  .mark { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; color: var(--h-muted); }
  .mark svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .mark.ok { color: var(--h-ok); }
  .mark.warn { color: var(--h-amber); }
  .mark.bad { color: var(--h-red); }
  #gridEmpty { color: var(--h-muted); font-size: 14px; text-align: center; padding: 60px 0; }

  /* ---------- scan ---------- */
  #scan { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 24px; background: var(--h-deep); }
  #scan.dropping { outline: 2px dashed var(--h-accent); outline-offset: -10px; }
  #empty { text-align: center; color: var(--h-muted); line-height: 1.7; font-size: 14px; }
  #empty b { display: block; font-family: var(--h-head); font-size: 26px; font-weight: 700; color: var(--h-text); margin-bottom: 6px; }
  #empty .keys { display: inline-flex; gap: 6px; margin: 8px 0 14px; }
  #empty .keys span { border: 1px solid var(--h-btn-border); background: var(--h-btn); border-radius: 6px; padding: 3px 9px; font-size: 13px; color: var(--h-text); box-shadow: 0 2px 0 var(--h-border2); }
  #empty a { color: var(--h-text2); cursor: pointer; text-decoration: underline; }
  #cam { display: none; flex-direction: column; align-items: center; gap: 12px; }
  #cam video { max-width: min(640px, calc(100vw - 48px)); max-height: calc(100vh - 180px); border-radius: 10px; background: #000; }
  #result { display: none; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1000px; }
  #result .shot { flex: 1 1 360px; max-width: 520px; }
  #result .shot canvas { display: block; max-width: 100%; max-height: calc(100vh - 160px); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.12); }
  #result .info { flex: 1 1 320px; max-width: 440px; background: var(--h-panel); border: 1px solid var(--h-border); border-radius: 10px; padding: 16px; }
  .kind { font-size: 12px; color: var(--h-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--h-muted); }
  .kv dd { word-break: break-word; font-weight: 500; }
  pre.raw { font: 12px "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; background: var(--h-deep2); color: var(--h-code); border-radius: 6px; padding: 10px; max-height: 200px; overflow: auto; margin-bottom: 14px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--h-accent); color: var(--h-on-accent); font-size: 13px; padding: 8px 14px; border-radius: 8px;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) {
    #make { flex-direction: column; overflow: auto; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--h-border); overflow: visible; }
    #gridWrap { overflow: visible; }
  }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hubot-sans@5.3.0/wdth.css">
<script>(function(){var t=null;try{t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("hubTheme")}catch(e){}document.documentElement.dataset.theme=t==="dark"?"dark":"light"})()</script>
<style id="hub-kit">
  :root {
    color-scheme: light;
    --h-font: "Mona Sans Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --h-head: "Hubot Sans Variable", var(--h-font);
    --h-bg: #f1efe9; --h-panel: #faf9f5; --h-panel2: #f4f2ec; --h-deep: #ebe8e1; --h-deep2: #e7e4dc;
    --h-border: #dedad0; --h-border2: #d3cec2; --h-btn: #ffffff; --h-btn-border: #cfcabe; --h-btn-hover: #f1eee6;
    --h-text: #18181b; --h-text2: #3f3f46; --h-muted: #6b675f; --h-muted2: #8f8a7f; --h-faint: #aaa59a; --h-code: #27272a;
    --h-accent: #18181b; --h-accent-h: #3f3f46; --h-accent2: #8f8a7f; --h-accent-bg: #e4e0d6; --h-on-accent: #ffffff; --h-strong: #09090b;
    --h-yellow: #8a5a00; --h-blue: #0b5cad; --h-blue2: #2f5597; --h-purple: #6b3fa0; --h-green2: #2e7d4f; --h-ok: #1a7f37;
    --h-green: #1a7f37; --h-red: #cf222e; --h-amber: #9a6700; --h-err-bg: #fde2e4; --h-err-bg2: #f5b8be; --h-err-text: #8b1a2b;
    --h-title-shadow: 0 2px 3px rgba(24, 24, 27, .16), 0 8px 22px rgba(24, 24, 27, .18);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --h-bg: #1e1f24; --h-panel: #26272e; --h-panel2: #2e2f37; --h-deep: #1b1c21; --h-deep2: #22232a;
    --h-border: #3a3b44; --h-border2: #3a3b46; --h-btn: #33343d; --h-btn-border: #4a4b55; --h-btn-hover: #41424d;
    --h-text: #e6e6e6; --h-text2: #b9bac2; --h-muted: #8a8b94; --h-muted2: #6f7078; --h-faint: #565761; --h-code: #d8dee9;
    --h-accent: #e6e6e6; --h-accent-h: #ffffff; --h-accent2: #8a8b94; --h-accent-bg: #3a3b44; --h-on-accent: #18181b; --h-strong: #ffffff;
    --h-yellow: #e8d3a8; --h-blue: #9ecbff; --h-blue2: #9db3d8; --h-purple: #c4a7e7; --h-green2: #a8d5b5; --h-ok: #8fd19e;
    --h-green: #3fb950; --h-red: #f85149; --h-amber: #e3b341; --h-err-bg: #5c1f2b; --h-err-bg2: #7a2938; --h-err-text: #ffb3c0;
    --h-title-shadow: 0 2px 3px rgba(0, 0, 0, .45), 0 8px 22px rgba(0, 0, 0, .5);
  }
  h1 { font-family: var(--h-head); font-weight: 800; font-stretch: 125%; letter-spacing: -.02em; text-shadow: var(--h-title-shadow); }
  h1 span, h1 em { text-shadow: inherit; color: var(--h-muted); }

  /* the theme slider: fixed top-right, no labels */
  .hub-theme { position: fixed; top: 14px; right: 16px; z-index: 9999; }
  .hub-theme button { all: unset; box-sizing: border-box; position: relative; display: block; width: 52px; height: 22px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #f1efe9, #c9c4b7 38%, #3f3f46 62%, #09090b); border: 1px solid var(--h-border2); touch-action: none; }
  .hub-theme button:focus-visible { outline: 2px solid var(--h-text); outline-offset: 3px; }
  .hub-theme i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); transition: left .4s cubic-bezier(.65, 0, .35, 1); }
  :root[data-theme="dark"] .hub-theme i { left: 32px; }
  .hub-theme.dragging i { transition: none; }
  .hub-theme.docked { position: static; flex: none; display: flex; align-items: center; margin-left: 6px; }
  [data-hub-theme-slot] { display: contents; }
  @media (prefers-reduced-motion: reduce) { .hub-theme i { transition: none; } }
  @media print { .hub-theme { display: none; } }
</style>
<!-- /studio-hub theme kit -->
</head>
<body data-mode="make">
<header>
  <h1>QR Studio</h1>
  <div class="group">
    <button class="tool on" data-mode="make">Make</button>
    <button class="tool" data-mode="scan">Scan</button>
  </div>
  <div class="spacer"></div>
  <div class="group" data-for="make">
    <button id="print" title="A printable card with the network name and password" hidden>Print card</button>
    <button id="svg" title="Download SVG">SVG</button>
    <button id="png" title="Download PNG (Ctrl S)">PNG</button>
    <button id="copy" class="primary">Copy <kbd style="opacity:.8" data-mod>Ctrl C</kbd></button>
  </div>
  <div class="group" data-for="scan">
    <button id="camBtn"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
    <button id="open">Open…</button>
  </div>
  <span data-hub-theme-slot></span>
</header>

<div id="make" data-for="make">
  <aside>
    <h2>Content</h2>
    <div class="types" id="types"></div>
    <div id="fields"></div>
    <div class="rule"></div>
    <div id="custom"></div>
  </aside>
  <div id="gridWrap">
    <div id="grid"></div>
    <div id="gridEmpty" hidden>Fill in the form to see your codes.</div>
    <p class="credit">Garden scene after <a href="https://github.com/nguyenhanhatminh0105-hue/voxel-qr-tree" target="_blank" rel="noopener noreferrer">voxel-qr-tree</a>, MIT</p>
  </div>
</div>

<main id="scan" data-for="scan">
  <div id="empty">
    <b>Scan a QR code</b>
    Take a screenshot with <span data-snip>Win Shift S</span>, then press
    <div><div class="keys"><span data-modkey>Ctrl</span><span>V</span></div></div>
    or drop an image here, <a id="pick">open a file</a> or <a id="pickCam">use the camera</a>.
  </div>
  <div id="cam"><video id="video" playsinline muted></video><button id="camStop">Stop camera</button></div>
  <div id="result">
    <div class="shot"><canvas id="shot"></canvas></div>
    <div class="info" id="info"></div>
  </div>
</main>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<div id="toast"></div>

<script>
/* ===========================================================================
   palette.js - colour, and the contrast floor that governs it.

   The whole diorama is a QR code seen from above, so every surface that can
   land on a dark module competes with the paving for a scanner's attention.
   WCAG-style relative luminance contrast is the working proxy: anything that
   can sit over a dark module must clear MIN_RATIO against the paving colour.

   That floor is not a style guide, it is a hard constraint. Pastel sakura pink
   is about 1.2:1 against pale paving and simply will not scan.

   But the floor is 3:1, and shipping colours at 5:1 or 8:1 spends headroom on
   nothing while making the whole scene read as dark wine. Every foliage swatch
   here sits just above 3.2:1, picked as a saturated hue AT that luminance
   rather than a pastel multiplied toward black - see SWATCHES for why the
   difference matters.

   Two further rules keep the two colour families from converging:
     - a surface that can sit on a DARK module may only ever be varied DARKER
     - a surface on PAVING may only ever be varied LIGHTER
   Violate those and the render still looks fine while the code quietly dies.

   Side faces are exempt. They are never visible from straight overhead, so
   they can carry colour the code could not survive on its top faces - that is
   what lets the ginkgo have near-white bark.
   =========================================================================== */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Palette = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* MIN_RATIO is the floor for a dark module's area-weighted MEAN. It is 2.45,
     not 3.0, and that is measured rather than assumed: pushed through module
     reconstruction, ZBar and the camera simulation, autumn golds hold at zero
     module errors and 12/12 camera all the way down to 2.44:1, then fall off a
     cliff - 26 module errors at 2.18 and 166 at 1.78.

     This is the third time the same lesson has landed. The tone ladder, the
     area-mean sampling and now the floor itself: the rule that protects
     scanning is about the MODULE, not the surface, and a per-surface floor has
     left headroom on the table every time it has been measured. The reference's
     own rose sits at 2.1:1.

     SOLID_MIN stays at 3.0 for grass, soil and bark - single-tone surfaces
     covering a whole module, with no averaging to lean on. */
  var MIN_RATIO = 2.45;         // sub-module surfaces, judged on their mean
  var SOLID_MIN = 3.0;          // whole-module single-tone surfaces
  var TONE_FLOOR = 1.75;        // no single tone may be lighter than this

  /* WHAT ACTUALLY HAS TO CLEAR THE FLOOR is a module's area-weighted mean, not
     every individual face. A scanner thresholds a module; it never sees a
     voxel. Holding each surface at or above MIN_RATIO is stricter than
     scanning requires, and it is what collapsed the canopy to a single tone:
     any lighter variant got darkened straight back to the floor, leaving
     nothing to dapple with. Uniform tone across a lattice of cubes is exactly
     what reads as stacked bricks.

     So there are two rules, not one:

       SUB-MODULE surfaces (leaves) may use a tone ladder whose weighted MEAN
       clears MIN_RATIO. Individual rungs may sit below it - the reference's
       own code view mixes tones at 2.07:1, 2.53:1 and 3.21:1 and still
       decodes - but none may go lighter than TONE_FLOOR, so a run of
       highlights inside one module cannot lift it over.

       WHOLE-MODULE surfaces (grass, soil, bark) keep the per-surface floor
       exactly as before. One block covers one module, so there is no
       averaging to rely on and every tone must clear MIN_RATIO by itself. */

  // --- colour maths ------------------------------------------------------
  function parseHex(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  function toHex(rgb) {
    return '#' + rgb.map(function (v) {
      var c = Math.max(0, Math.min(255, Math.round(v))).toString(16);
      return c.length === 1 ? '0' + c : c;
    }).join('');
  }

  function srgbToLinear(c) {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }

  function luminance(hex) {
    var p = parseHex(hex);
    return 0.2126 * srgbToLinear(p[0]) + 0.7152 * srgbToLinear(p[1]) + 0.0722 * srgbToLinear(p[2]);

  function contrast(a, b) {
    var la = luminance(a), lb = luminance(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);

  // Multiply toward black. Only ever used on dark-module surfaces.
  function darken(hex, amount) {
    var p = parseHex(hex);
    var k = 1 - amount;
    return toHex([p[0] * k, p[1] * k, p[2] * k]);
  }

      p[0] + (255 - p[0]) * amount,
      p[1] + (255 - p[1]) * amount,

     colour plus whether it had to move, so the UI/tests can report which
     choices the contrast floor overrode rather than silently "fixing" them. */
  function enforceContrast(hex, paving, minRatio) {
    /* A floor below MIN_RATIO is almost certainly a mistake, and it fails
       silently: the while loop simply never runs, the colour comes back
       untouched, and `forced` reads false - indistinguishable from a colour
       that was already dark enough. `enforceContrast('#ffffff', PAVING, 1)`
       returned white, at 1.20:1, reporting success.

       Note that 0 was already safe, because `|| MIN_RATIO` treats it as
       absent, while 1 was not - the value that looks like "off" was the
       harmless one and the innocuous-looking one disabled the check. Reject
       anything under the floor rather than leaving that inverted. */

      minRatio = MIN_RATIO;
    }

      throw new Error('contrast floor ' + minRatio + ' is below MIN_RATIO ' +
        MIN_RATIO + '; a lower floor silently disables the check');

      steps++;

  // quiet zone is the same colour as the light paving and reads as margin.
  var PAVING = '#EDEAE3';
  /* Ground sits just above the 3:1 floor, not the near-black 10:1 it is
     tempting to reach for. The ground layer alone reproduces the matrix, so
     the instinct is to make it as dark as possible - but every stop past the
     floor is headroom spent on nothing, and a dark floor competes with the
     tree. The plot should recede as a plaza, not read as a second pattern
     fighting the canopy.

     Soil and grass also sit close to each other in weight. Two ground tones of
     clearly different lightness make the floor read as a busy checkerboard;
     near-equal luminance lets it read as one surface with variation in it. */
  /* Ground surfaces carry a night variant. Hue is free for a QR code -
     scanners threshold on LUMINANCE, which is why every surface here is
     measured with contrast() against PAVING rather than by eye. What is not
     free is polarity: dark modules on a light ground is what a scanner
     assumes, so the paving never moves and these stay above SOLID_MIN.

     Foliage deliberately does NOT get a night variant. Sakura pink, ginkgo
     gold and willow teal are the species identity; a night sakura that is not
     pink has stopped being a sakura. The ground is scenery, so it can cool to
     moonlight without touching what the tree is. */
  var SOIL_DAY = '#8d826e';    // warm stone, 3.15:1
  var SOIL_NIGHT = '#7c7f8e';  // cool stone,  3.31:1
  var GRASS_DAY = '#698d57';   // 3.15:1
  var GRASS_NIGHT = '#4f7d6b'; // moonlit green, 3.90:1
  var NIGHT = false;
  function setNight(on) { NIGHT = !!on; }
  function SOIL_() { return NIGHT ? SOIL_NIGHT : SOIL_DAY; }
  function GRASS_() { return NIGHT ? GRASS_NIGHT : GRASS_DAY; }
  var SLAB_SIDE = '#6E6152';  // never seen from overhead

  /* Six foliage swatches, each sitting just above MIN_RATIO rather than well
     past it.

     HOW THESE WERE PICKED, because the obvious method produces mud. Taking a
     pastel and darkening it toward black until it clears the floor also drains
     its saturation: #F8C8DC treated that way lands on #947884, a grey mauve
     that reads as dead wine rather than blossom. The multiply is the problem -
     it scales all three channels together, so chroma collapses along with
     luminance.

     Instead each swatch is a SATURATED hue chosen AT the target luminance:
     fix hue and saturation, then solve lightness for the ratio. That keeps the
     colour vivid at 3.2:1 where the darkened version was muddy at 5.4:1.

     `wanted` keeps the pastel a designer would reach for, so the report can
     still show what the floor rules out. */
  var SWATCHES = [
    { id: 'rose', name: 'Rose', wanted: '#F8C8DC', hex: '#c1647d' },
    { id: 'jade', name: 'Jade', wanted: '#7BC47F', hex: '#4b8f5b' },
    { id: 'amber', name: 'Amber', wanted: '#F2B441', hex: '#9c7c51' },
    { id: 'indigo', name: 'Indigo', wanted: '#8FA8DE', hex: '#6182ba' },
    { id: 'plum', name: 'Plum', wanted: '#C79BE0', hex: '#ae64c0' },
    { id: 'moss', name: 'Moss', wanted: '#AFC46B', hex: '#738947' }
  ];

  /* Leaf tone ladder: offsets from the base (positive lightens) and the share
     of voxels each takes. Sub-module, so the weighted mean is what matters. */
  /* The ladder is asymmetric: capped at +0.13 on the light side, running to
     -0.32 on the dark. A symmetric +/-0.26 ladder looks better in isolation
     but its highlight rung crosses the threshold the matrix-reconstruction
     test samples at, on four of the six swatches - and that test duly caught
     it, 12 modules flipping light. ZBar still read those codes, because real
     scanners threshold locally; the fixed-threshold test is the stricter
     canary and is worth keeping strict.

     Weights were then solved so the area-weighted mean is unchanged despite
     the asymmetry - it drifts by at most 0.009 across the six swatches. */
  var LEAF_LADDER = [
    { d: 0.13, w: 0.14 },   // highlight
    { d: 0.065, w: 0.24 },  // light
    { d: 0.00, w: 0.44 },   // base
    { d: -0.16, w: 0.12 },  // shade
    { d: -0.32, w: 0.06 }   // deep
  ];
  /* Grass gets five rungs like the leaves, with pale tips at the light end -
     that is what makes the reference's grass read as grass rather than green
     paint. Blades are sub-module so the mean is what counts, but the tile
     underneath is whole-module, so enforceContrast still gates each rung. */
  var GRASS_LADDER = [
    { d: 0.22, w: 0.12 },
    { d: 0.11, w: 0.22 },
    { d: 0.00, w: 0.34 },
    { d: -0.10, w: 0.20 },
    { d: -0.20, w: 0.12 }
  ];
  // Narrower, and every rung must clear the floor on its own.
  var GROUND_LADDER = [
    { d: 0.05, w: 0.28 },
    { d: 0.00, w: 0.40 },
    { d: -0.10, w: 0.32 }
  ];

  /* Each species has its own foliage colour, so the four are distinguishable
     without touching a swatch. The swatch overrides this only when the user
     picks one - previously the swatch drove colour and species set only bark,
     so all four trees were the same shade. All verified at the floor. */
  var SPECIES_FOLIAGE = {
    sakura: '#eb6a8c',   // blossom pink      2.51:1
    oak:    '#4ba660',   // deep summer green 2.52:1
    ginkgo: '#ad914e',   // autumn gold       2.52:1
    willow: '#49a391'    // sage              2.52:1
  };

  // Per-species surfaces that are not the swatch colour.
  var SPECIES_COLOURS = {
    sakura: { barkTop: '#4A3328', barkSide: '#7A5A46' },
    oak:    { barkTop: '#3E2F22', barkSide: '#6B513A' },
    // The ginkgo is the reason side faces are worth treating separately: a dark
    // top face keeps the code alive while near-white sides read as the pale
    // ribboned bark the tree is known for.
    ginkgo: { barkTop: '#413B30', barkSide: '#E4DED2' },
    willow: { barkTop: '#3A3B2E', barkSide: '#6E6A55' }
  };

  /* Build the full colour set for a species + swatch, with every dark-module
     surface pushed through the contrast floor. */
  function build(speciesId, swatchId) {
    // Fail loudly on an unknown species. A `|| SPECIES_COLOURS.oak` fallback
    // here once let a stale species name in the test harness silently render a
    // second oak, so a sweep reported 100% while never testing one species.
    if (!SPECIES_FOLIAGE[speciesId]) throw new Error('unknown species: ' + speciesId);
    // swatchId null/'auto' means "use the species default"
    var swatch = SWATCHES.filter(function (s) { return s.id === swatchId; })[0];
    var foliage = swatch ? swatch.hex : SPECIES_FOLIAGE[speciesId];
    if (!swatch) swatch = { id: 'auto', name: 'Species', hex: foliage, wanted: foliage };
    var sp = SPECIES_COLOURS[speciesId];
    var forced = [];

    function gate(label, hex, floor) {
      var r = enforceContrast(hex, PAVING, floor || MIN_RATIO);
      if (r.forced) forced.push({ label: label, from: hex, to: r.hex, ratio: r.ratio });
      return r.hex;
    }

    var pal = {
      paving: PAVING,
      soil: gate('soil', SOIL_(), SOLID_MIN),
      slabSide: SLAB_SIDE,
      foliageTop: gate('foliage', foliage),
      barkTop: gate('bark', sp.barkTop, SOLID_MIN),
      barkSide: sp.barkSide,          // side face: exempt from the floor
      grassTop: gate('grass', GRASS_(), SOLID_MIN),
      swatch: swatch,
      forced: forced
    };
    /* Side shading. Two tones per material, one per visible side face, so the
       3-D view reads as volume.

       Sides go DARKER than the top, which is the opposite of the first thing
       you would try. The contrast floor has already forced every top face to
       be dark; if the sides are then made lighter, every leaf reads as a dark
       cap on a pale stalk and the crown looks like a field of mushrooms. Since
       side faces are exempt from the floor, shading them down instead restores
       ordinary top-lit form for free. The ginkgo is the exception - its pale bark
       is the whole point, so it keeps light sides. */
    function sides(top, a, b) {
      return { top: top, sideA: darken(top, a), sideB: darken(top, b) };
    }
    pal.mat = {
      leaf: sides(pal.foliageTop, 0.16, 0.32),
      grass: sides(pal.grassTop, 0.16, 0.32),
      soil: sides(pal.soil, 0.16, 0.32),
      bark: { top: pal.barkTop, sideA: pal.barkSide, sideB: darken(pal.barkSide, 0.16) }
    };

    /* Tone ladders. Every leaf carrying one colour is what makes a crown read
       as a grid of identical bricks rather than a mass of foliage; the
       reference has roughly 24 tone families against our 4. Weights are chosen
       so the area-weighted mean luminance is unchanged - the module is exactly
       as dark as it was, it simply is not flat. */
    pal.mat.leaf.ladder = LEAF_LADDER.map(function (r) {
      var hex = r.d > 0 ? lighten(pal.foliageTop, r.d) : darken(pal.foliageTop, -r.d);
      return { top: hex, sideA: darken(hex, 0.16), sideB: darken(hex, 0.32), w: r.w };
    });
    /* Ground blocks cover a whole module each, so their rungs stay above the
       per-surface floor and the spread is deliberately narrow. */
    ['grass', 'soil'].forEach(function (k) {
      var baseHex = k === 'grass' ? pal.grassTop : pal.soil;
      var rungs = k === 'grass' ? GRASS_LADDER : GROUND_LADDER;
      pal.mat[k].ladder = rungs.map(function (r) {
        var hex = r.d > 0 ? lighten(baseHex, r.d) : darken(baseHex, -r.d);
        hex = enforceContrast(hex, PAVING, SOLID_MIN).hex;   // whole-module
        return { top: hex, sideA: darken(hex, 0.16), sideB: darken(hex, 0.32), w: r.w };
      });
    });

    /* Fallen blossom. Ground under the crown is carpeted with these rather
       than left as bare soil: leaf cubes are smaller than their module, so
       from overhead the gaps would show brown and the crown would read as
       speckle on dirt instead of a solid block of colour. Both tones are
       DARKER than the leaves above them, so they clear the floor by more
       than the foliage does - the carpet costs nothing in contrast.

       Together with the two side tones this is the five-tone ladder:
         top 0   right -16%   fallen -24%   left -32%   fallen2 -34%  */
    /* Kept close to the foliage rather than well below it. The point of the
       carpet is that a crown module reads SOLID from overhead - leaf cube
       where there is a leaf, fallen petal where there is not, in one colour.
       Pushing the carpet far darker reintroduced it as a third weight on the
       floor competing with the tree. */
    // plain stone under the canopy; the backing plate carries the module
    pal.mat.plaza = sides(pal.soil, 0.16, 0.32);
    pal.mat.fallen = sides(darken(pal.foliageTop, 0.08), 0.16, 0.32);
    pal.mat.fallen2 = sides(darken(pal.foliageTop, 0.16), 0.16, 0.32);
    pal.foliageSide = pal.mat.leaf.sideA;
    pal.grassSide = pal.mat.grass.sideA;
    pal.soilSide = darken(pal.soil, 0.10);
    return pal;
  }

  // Report every top-face colour against the floor. Used by the test harness
  // and by the in-page contrast readout.
  // Area-weighted mean contrast of a ladder against the paving.
  function ladderMeanRatio(rungs) {
    var L = 0, W = 0;
    for (var i = 0; i < rungs.length; i++) {
      L += luminance(rungs[i].top) * rungs[i].w;
      W += rungs[i].w;
    }
    return (luminance(PAVING) + 0.05) / (L / W + 0.05);
  }

  function audit() {
    var rows = [];
    function add(label, hex, exempt, floor) {
      rows.push({
        label: label, hex: hex, ratio: contrast(hex, PAVING),
        pass: exempt || contrast(hex, PAVING) >= (floor || MIN_RATIO), exempt: !!exempt
      });
    }
    add('paving (reference)', PAVING, true);
    add('soil', SOIL_(), false, SOLID_MIN);
    add('grass', GRASS_(), false, SOLID_MIN);
    SWATCHES.forEach(function (s) {
      add('foliage ' + s.name, s.hex);
      rows.push({
        label: 'foliage ' + s.name + ' (natural choice, rejected)',
        hex: s.wanted, ratio: contrast(s.wanted, PAVING),
        pass: contrast(s.wanted, PAVING) >= MIN_RATIO, rejected: true
      });
    });
    Object.keys(SPECIES_COLOURS).forEach(function (k) {
      add(k + ' bark top', SPECIES_COLOURS[k].barkTop, false, SOLID_MIN);
      add(k + ' bark side (side face, exempt)', SPECIES_COLOURS[k].barkSide, true);
    });
    /* Ladder checks. Leaves are judged on their weighted mean, with a
       per-tone backstop; ground ladders are judged per rung. */
    SWATCHES.forEach(function (sw) {
      var pal = build('sakura', sw.id);
      var mean = ladderMeanRatio(pal.mat.leaf.ladder);
      var lightest = Math.min.apply(null, pal.mat.leaf.ladder.map(function (r) {
        return contrast(r.top, PAVING);
      }));
      rows.push({
        label: 'leaf ladder ' + sw.name + ' (weighted mean of 5 tones)',
        hex: pal.mat.leaf.top, ratio: mean, pass: mean >= MIN_RATIO, ladder: true
      });
      rows.push({
        label: 'leaf ladder ' + sw.name + ' lightest tone (backstop ' + TONE_FLOOR + ':1)',
        hex: pal.mat.leaf.ladder[0].top, ratio: lightest,
        pass: lightest >= TONE_FLOOR, ladder: true
      });
    });
    var gp = build('sakura', 'rose');
    ['grass', 'soil'].forEach(function (k) {
      gp.mat[k].ladder.forEach(function (r, i) {
        rows.push({
          label: k + ' ladder rung ' + i + ' (whole module: hard floor)',
          hex: r.top, ratio: contrast(r.top, PAVING),
          pass: contrast(r.top, PAVING) >= SOLID_MIN
        });
      });
    });
    return rows;
  }

  return {
    SPECIES_FOLIAGE: SPECIES_FOLIAGE,
    MIN_RATIO: MIN_RATIO,
    SOLID_MIN: SOLID_MIN,
    TONE_FLOOR: TONE_FLOOR,
    ladderMeanRatio: ladderMeanRatio,
    PAVING: PAVING,
    SOIL: SOIL_DAY,
    setNight: setNight,
    SWATCHES: SWATCHES,
    SPECIES_COLOURS: SPECIES_COLOURS,
    luminance: luminance,
    contrast: contrast,
    darken: darken,
    lighten: lighten,
    enforceContrast: enforceContrast,
    build: build,
    audit: audit
  };
});

<script>
/* ===========================================================================
   scene.js - planting. Turns a QR matrix into a list of voxels.

   THE CENTRAL RULE: every voxel above ground sits on a dark module. Nothing
   else about the planting matters to the code, because darkness is a property
   of (x, y) only - it does not vary with height. Two consequences shape all
   four species:

     - A vertical column planted on a dark cell is dark at every level, so
       trunks and willow tendrils are never eroded.
     - Anything that spreads in x/y - crowns, limbs, foliage - gets carved by
       the matrix. That carving IS the look. Do not "repair" it.

   Gaps in foliage are safe. A rule forcing foliage to fill its module would
   turn every crown into a stack of crates. What the gaps must NOT show is
   bare brown ground: see the fallen-blossom carpet in groundBlocks() below.

   Every dark module becomes a RAISED block, never a flat tile. Flat tiles
   make the plot read as ink printed on a floor; raised blocks make it read as
   terrain the tree is growing out of.

   A cube may be smaller than its module and offset within it, but must never
   cross the edge - see place(), which is the only way voxels are created.

   Dimensions are fractions of n, the matrix size, so a version 2 code and a
   version 10 code grow trees of the same proportion.
   =========================================================================== */
(function (root, factory) {
  var api = factory(
    typeof require === 'function' ? require('./palette.js') : root.Palette

  else root.Scene = api;
})(typeof self !== 'undefined' ? self : this, function (Palette) {
  'use strict';

  // --- deterministic randomness -----------------------------------------
  // Same URL + species + swatch always grows the same tree.
  function hashString(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Wind phase, hashed from the COLUMN - deliberately not from z.

     Including z gave every voxel in a vertical stack its own phase, so the
     nine bark voxels of a trunk displaced independently and the trunk split at
     its seams instead of bending: two abutting segments could sit at +0.193
     and -0.018 at the same instant, a 0.21-module tear. The same defect made
     the canopy boil rather than sway, because every leaf ran on its own clock.

     Phase per column means a column moves as one piece and neighbouring
     columns lag into a wave, which is what reads as wind. */
  function phaseAt(x, y) {
    var h = Math.imul(((x * 73856093) ^ (y * 19349663)) >>> 0, 2654435761) >>> 0;
    return (h / 4294967296) * Math.PI * 2;
  }

  /* Tone hash for dappling. Deliberately hashed on the VOXEL - position and
     height - not the column. Wind phase wants a whole column to move together;
     dappling wants the opposite, neighbours differing, so a crown reads as a
     mass of foliage rather than a grid of identical bricks. Pure position, so
     it never consumes the random stream and stays stable across rebuilds. */
  function toneHash(x, y, z) {
    var h = ((x * 2654435761) ^ (y * 40503) ^ (z * 3266489917)) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
    return (h >>> 8) / 16777216;
  }

  function pickRung(ladder, r) {
    var acc = 0;
    for (var i = 0; i < ladder.length; i++) {
      acc += ladder[i].w;
      if (r < acc) return ladder[i];
    }
    return ladder[ladder.length - 1];
  }

  // Stable per-module noise, for picking between tones without consuming the
  // random sequence (so tone choice does not shift when density changes).
  function cellNoise(x, y) {
    var h = Math.imul(((x * 374761393) ^ (y * 668265263)) >>> 0, 1274126177) >>> 0;
    return (h >>> 8) / 16777216;
  }

  // The slab spans SLAB_BOTTOM..SLAB_TOP; ground blocks are seated on its top
  // face so no sliver of paving shows beneath them. Their bottom face is never
  // drawn, so being coplanar with the slab top cannot z-fight.
  var SLAB_BOTTOM = -1.5, SLAB_TOP = -0.02;

  /* Per-kind wind stiffness. Bark and leaf obeying the same law made trunks
     sway like saplings; a trunk should barely move while its foliage does. */
  var STIFFNESS = {
    bark: 0.15, leaf: 1.0, tendril: 1.0, blade: 0.4, grass: 0.4, ground: 0
  };

  /* Vertical depth of canopy actually filled per column. A flat minimum plus
     a fraction of the span: rim columns (short spans) fill completely, while
     interior columns keep a proportional body rather than a thin lid, which is
     what stopped the crown reading as a hanging curtain. Capped so very large
     codes stay affordable. */
  /* SHELL_MAX caps how deep the shell goes so an enormous crown cannot
     generate unbounded voxels. At 9.0 that cap was distorting SHAPE rather
     than bounding cost: the ginkgo's columns span 19 modules on average, so
     span * SHELL_FRAC wanted 13.4 and got clipped to 9.0, leaving 26% of every
     column hollow. A wide crown hides that behind the columns in front - the
     oak is 33 modules across - but the ginkgo is only 18 wide and you looked
     straight through the middle of it. 13.5 lets the proportional rule run to
     the spans this project actually produces: hollow columns fall from 45/130

  var SHELL_MIN = 4.2, SHELL_FRAC = 0.70, SHELL_MAX = 22.0;
  /* The crown needs an underside too. Filling only downward from the top left
     each column a cap on a much longer span - a hollow dome with nothing
     beneath it, which is why the crown looked unmoored from the plot.

     The defence for a top-only shell was that deeper leaves are occluded by
     the columns in front. That premise is false at 35 degrees elevation: the
     columns in front were shelled away as well, so nothing is left to do the
     occluding and you look straight under the dome and out the other side.

     The lower shell is thinner than the upper one because less of the
     underside is ever seen. Both scale with span, so the fill still tracks
     crown FOOTPRINT rather than volume and the 45,000-leaf case stays gone.

     This ratio is also the cheapest lever on voxel count: you see far less of
     the underside than the top, so thinning it costs little visually. */
  var SHELL_LOWER = 0.58;
  var BRIDGE = 2.5;       // vertical slack merged away rather than left hollow

  var SPECIES = [
    { id: 'sakura', season: 'Spring', name: 'Sakura', fall: 'petals' },
    { id: 'oak', season: 'Summer', name: 'Oak', fall: 'seeds' },
    { id: 'ginkgo', season: 'Autumn', name: 'Ginkgo', fall: 'leaves' },
    { id: 'willow', season: 'Winter', name: 'Willow', fall: 'snow' }
  ];

  /* --- the one voxel constructor ----------------------------------------
     Places a box inside module (mx, my). `size` is the plan footprint as a
     fraction of a module; the offset is chosen so the box is strictly inside
     its module. Crossing a module edge would put dark pixels over a paving
     module and corrupt the code, so the clamp here is load-bearing, not
     defensive tidiness. */
  /* The ONE voxel constructor, and the one place both planting invariants are
     enforced:

       1. a voxel never crosses its module edge - structural, via the slack
          left over from the clamped size;
       2. a voxel only ever sits on a DARK module.

     Rule 2 used to live in the five callers (addSpan, trunk, limb, tendril,
     groundBlocks) by convention, while the comment above this function claimed
     the invariant was "enforced in exactly one place". It was not: only rule 1
     was. A new planting helper written against that comment would have called
     place() directly, planted foliage on paving, and produced a code that ZBar
     still decodes most of the time - the exact shape of failure this project
     has already shipped twice. Taking the Ctx instead of its output array
     makes the matrix reachable, so the rule can be checked where it belongs. */
  function place(ctx, mx, my, z, size, height, mat, kind, rnd) {
    if (!ctx.isDark(mx, my)) {
      throw new Error('place() on a light module at ' + mx + ',' + my +
        ' (' + kind + '): every voxel above ground must sit on a dark module');
    }
    var out = ctx.out;
    size = Math.max(0.06, Math.min(1, size));
    var slack = 1 - size;
    /* Bark is centred, never jittered. place()'s positional jitter is right
       for foliage and wrong for a trunk: applied to nine stacked bark
       segments it made the trunk centre wander 0.26 modules in x and 0.35 in
       y, a visible zig-zag. A trunk is one axis, top to bottom. */
    /* Bark and blades are centred, never jittered. Bark because a trunk is
       one axis top to bottom. Blades because a tuft splays from a common
       root - and because centring is what makes the splay clamp exact: from
       the centre there is (1 - size)/2 of room on every side, so a lean
       within that can never carry the tip over a module edge. */
    var centred = kind === 'bark';
    var ox = slack > 0 ? (centred ? slack / 2 : rnd() * slack) : 0;
    var oy = slack > 0 ? (centred ? slack / 2 : rnd() * slack) : 0;
    // Dapple: pick a rung of the material's tone ladder from the voxel's own
    // position, so adjacent voxels differ. See toneHash.
    var tone = mat.ladder
      ? pickRung(mat.ladder, toneHash(mx, my, Math.round(z * 16)))
      : mat;
    out.push({
      x: mx + ox, y: my + oy, z: z,
      w: size, d: size, h: height,
      top: tone.top, side: tone.sideA, sideA: tone.sideA, sideB: tone.sideB,
      kind: kind,
      shape: SHAPE[kind] || 'box',
      // static splay, in modules, applied at the top like the wind shear
      leanX: 0, leanY: 0,
      phase: phaseAt(mx, my)
    });
  }

  /* Nothing in the reference is a cube. Voxels carry a shape so each renderer
     can draw the right solid: a tapered cylinder for bark, a rounded blob for
     blossom, a splayed spike for a grass blade, and a flat quad for ground.
     The code invariant is unchanged - it is about what a module looks like
     from directly overhead, not about anything being a box. */
  var SHAPE = {
    bark: 'cyl', leaf: 'blob', tendril: 'blob',
    blade: 'blade', ground: 'tile', grass: 'tile'
  };

  // --- helpers -----------------------------------------------------------
  function makeDark(matrix) {
    var n = matrix.length;
    return function (mx, my) {
      return mx >= 0 && my >= 0 && mx < n && my < n && matrix[my][mx];
    };
  }

  // The dark cell nearest a target, so trunks land on solid ground.
  function nearestDark(matrix, tx, ty) {
    var n = matrix.length, best = null, bestD = Infinity;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        if (!matrix[y][x]) continue;
        var d = (x - tx) * (x - tx) + (y - ty) * (y - ty);
        if (d < bestD) { bestD = d; best = [x, y]; }
      }
    }
    return best || [Math.floor(n / 2), Math.floor(n / 2)];
  }

  /* A planting context. `claimed` records every module that ends up with
     foliage overhead; groundBlocks() later carpets those with fallen blossom
     instead of leaving them bare soil. */
  function Ctx(matrix, pal, rnd, species) {
    this.species = species;
    this.matrix = matrix;
    this.n = matrix.length;
    this.pal = pal;
    this.rnd = rnd;
    this.isDark = makeDark(matrix);
    this.out = [];
    this.spans = {};
    this.crownZ = {};        // per module: [lowest leaf z, highest leaf z]
    this.crownTop = -Infinity;
    this.crownBottom = Infinity;
    this.claimed = [];
    for (var i = 0; i < this.n; i++) this.claimed.push(new Array(this.n).fill(false));
  }

  Ctx.prototype.claim = function (mx, my) {
    if (mx >= 0 && my >= 0 && mx < this.n && my < this.n) this.claimed[my][mx] = true;
  };

  /* --- canopy -----------------------------------------------------------

     Crowns are built in two phases: each cloud RECORDS a vertical span per
     column, then growCanopy() fills every column once. Three reasons.

     1. COLUMNS, NOT SAMPLES. The old version scattered points through a ball
        and discarded any landing on a light module. Survivors were Poisson
        distributed per column, so some dark columns got one leaf and some got
        none - and an empty column is a hole you can see straight through. That
        speckle, not the matrix carving, is what made the canopy read as lace.
        A column filled continuously is either solid or absent, never speckled.
        It also stops throwing away the ~50% of samples that landed on paving.

     2. VOLUME, NOT FOOTPRINT. Leaf count used to scale with PI*r*r and ignore
        halfH entirely, so making a crown taller - which is the actual fix for
        see-through foliage - spread the same leaves through more volume and
        made the lattice worse. Filling by column makes count track volume
        automatically, so height and density stop fighting each other.

     3. OVERLAPPING CLOUDS DON'T DOUBLE UP. Species stack several clouds; where
        they overlap, per-cloud filling would stack two sets of leaves in the
        same column. Merging spans first means one pass, one stack.

     The carving is untouched: light modules still produce nothing. What changes
     is that surviving columns are opaque, and a crown with real depth along the
     view axis puts foliage behind every gap. */
  Ctx.prototype.addSpan = function (mx, my, zBot, zTop) {
    if (!this.isDark(mx, my)) return;
    if (zTop - zBot < 0.15) return;
    this.claim(mx, my);
    var k = my * this.n + mx;
    (this.spans[k] || (this.spans[k] = [])).push([zBot, zTop]);
  };

  /* Record one ellipsoid. `lowBound` is -1 for a full ellipsoid or 0 for a
     dome (upper half only). */
  Ctx.prototype.cloud = function (cx, cy, cz, r, halfH, lowBound) {
    if (lowBound === undefined) lowBound = -1;
    var x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
    var y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    for (var my = y0; my <= y1; my++) {
      for (var mx = x0; mx <= x1; mx++) {
        var dx = (mx + 0.5 - cx) / r, dy = (my + 0.5 - cy) / r;
        var q = dx * dx + dy * dy;
        if (q >= 1) continue;
        var span = halfH * Math.sqrt(1 - q);   // ellipsoid half-extent here
        this.addSpan(mx, my, cz + lowBound * span, cz + span);
      }
    }
  };

  /* A cluster of small clouds rather than one big ellipsoid. One cloud reads
     as a ball; several overlapping at jittered offsets read as foliage. The
     core is drawn first and is deliberately large enough to keep the interior
     continuous - canopy only materialises over dark modules, so a lobe pushed
     out on its own can land over a light region and leave a bite out of the
     crown. The core is what stops that. */
  Ctx.prototype.clump = function (cx, cy, cz, r, halfH, count, lowBound) {
    var rnd = this.rnd;
    this.cloud(cx, cy, cz, r * 0.80, halfH * 0.94, lowBound);
    for (var i = 0; i < count; i++) {
      var a = rnd() * Math.PI * 2;
      var d = r * (0.26 + rnd() * 0.40);
      this.cloud(cx + Math.cos(a) * d, cy + Math.sin(a) * d,
                 cz + halfH * (rnd() - 0.5) * 0.70,
                 r * (0.40 + rnd() * 0.26), halfH * (0.54 + rnd() * 0.32), lowBound);
    }
  };

  Ctx.prototype.dome = function (cx, cy, cz, r, halfH) {
    this.cloud(cx, cy, cz, r, halfH, 0);
  };

  // One continuous run of leaves up a column between two heights.
  Ctx.prototype.stack = function (mx, my, z, zTop, pack, sizeLo, sizeHi) {
    var rnd = this.rnd;
    var k = my * this.n + mx;
    var cz = this.crownZ[k] || (this.crownZ[k] = [Infinity, -Infinity]);
    if (z < cz[0]) cz[0] = z;
    if (zTop > cz[1]) cz[1] = zTop;
    while (z < zTop) {
      var size = sizeLo + rnd() * (sizeHi - sizeLo);
      var h = size * (0.95 + rnd() * 0.6);
      place(this, mx, my, z, size, h, this.pal.mat.leaf, 'leaf', rnd);
      z += h * pack;
    }
  };

  /* Merge each column's spans and stack leaves up them continuously.
     `pack` is the vertical advance as a fraction of leaf height: below 1 the
     stack overlaps, which is what makes a column opaque. */
  Ctx.prototype.growCanopy = function (pack, sizeLo, sizeHi) {
    var rnd = this.rnd, n = this.n;
    var keys = Object.keys(this.spans).map(Number).sort(function (a, b) { return a - b; });
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], mx = k % n, my = (k - mx) / n;
      var iv = this.spans[k].slice().sort(function (a, b) { return a[0] - b[0]; });
      var merged = [], cur = iv[0].slice();
      for (var j = 1; j < iv.length; j++) {
        /* Bridge a small gap rather than starting a new span. Two clumps that
           miss each other by a module leave a slot of clear air up the column,
           and on a narrow crown - the ginkgo is 18 modules across, with nothing
           in front to hide it - that slot reads as a bite taken out of the tree
           rather than as foliage texture. Anything wider than BRIDGE is left
           alone, so real separation between lobes survives. */
        if (iv[j][0] <= cur[1] + BRIDGE) cur[1] = Math.max(cur[1], iv[j][1]);
        else { merged.push(cur); cur = iv[j].slice(); }
      }
      merged.push(cur);
      for (var m = 0; m < merged.length; m++) {
        var zBot = merged[m][0], zTop = merged[m][1];
        if (zBot < this.crownBottom) this.crownBottom = zBot;
        if (zTop > this.crownTop) this.crownTop = zTop;
        /* Fill a shell at each end of the span, not the whole span, and not
           only the top - see SHELL_LOWER. */
        var span = zTop - zBot;
        var upper = Math.min(SHELL_MAX, Math.max(SHELL_MIN, span * SHELL_FRAC));
        var topStart = Math.max(zBot, zTop - upper);
        this.stack(mx, my, topStart, zTop, pack, sizeLo, sizeHi);
        if (topStart > zBot) {
          var botEnd = Math.min(topStart, zBot + upper * SHELL_LOWER);
          if (botEnd > zBot) this.stack(mx, my, zBot, botEnd, pack, sizeLo, sizeHi);
        }
      }
    }
  };

  Ctx.prototype.trunk = function (mx, my, z0, height, width) {
    if (!this.isDark(mx, my)) return false;
    // One column on a dark cell is dark at every height, so the trunk is
    // always whole. Segmented so the wind shear reads along its length.
    var seg = Math.max(0.6, height / 9);
    for (var z = z0; z < z0 + height - 1e-6; z += seg) {
      var h = Math.min(seg, z0 + height - z);
      var size = width * (1 - 0.12 * (z - z0) / Math.max(1, height));
      place(this, mx, my, z, size, h, this.pal.mat.bark, 'bark', this.rnd);
    }
    return true;
  };

  Ctx.prototype.limb = function (cx, cy, ang, len, z0, rise, w0) {
    var steps = Math.max(3, Math.round(len * 1.8));
    /* A branch is a connected thing, so it ENDS at a carved module - it does
       not skip across and resume in mid-air. `continue` here left a dotted
       line of bark cubes hanging over nothing: half of all bark on the sakura
       (30 of 59) and the oak (58 of 123), with 7-9 modules of clear air
       beneath them. They read as fence posts standing on the plot.

       Segment height has to cover the per-step rise as well. At a fixed 0.6
       against a rise of ~0.66 per step, even two consecutive segments pulled
       apart on their own. */
    var segH = Math.max(0.6, rise / steps + 0.2);
    for (var k = 1; k <= steps; k++) {
      var f = k / steps;
      var mx = Math.floor(cx + Math.cos(ang) * len * f);
      var my = Math.floor(cy + Math.sin(ang) * len * f);
      if (!this.isDark(mx, my)) break;
      this.claim(mx, my);                       // limbs shade the ground too
      place(this, mx, my, z0 + f * rise, w0 * (1 - 0.3 * f), segH,
        this.pal.mat.bark, 'bark', this.rnd);
    }
  };

  /* Willow tendril: narrow in plan, continuous in z. A scatter of cubes here
     reads as a bush, not a hanging branch, so this is its own primitive - a
     few tall jointed segments, each staying inside its module. */
  Ctx.prototype.tendril = function (mx, my, zTop, length) {
    if (!this.isDark(mx, my)) return;
    this.claim(mx, my);
    var rnd = this.rnd;
    var joints = 2 + Math.floor(rnd() * 3);
    var remaining = length, z = zTop;
    for (var j = 0; j < joints && remaining > 0.3; j++) {
      var segLen = j === joints - 1 ? remaining : remaining * (0.35 + rnd() * 0.4);
      segLen = Math.min(segLen, remaining);
      place(this, mx, my, z - segLen, 0.13 + rnd() * 0.09, segLen,
        this.pal.mat.leaf, 'tendril', rnd);
      z -= segLen;
      remaining -= segLen;
    }
  };

  /* One thin backing plate per crown module.

     The crown does not actually cover its modules. Rounded blossoms cover only
     pi/4 of their footprint, and measured across links and species the WORST
     module sits at 34% plan-view coverage even while the mean is 99% - and it
     is the worst that breaks. Without a plate, clearing the carpet from under
     the tree lets paving show through those gaps and lifts the module toward
     light.

     The plate is a FULL-MODULE FLAT BOX, deliberately not the leaf primitive:
     a rounded solid would cover only ~79% of its own footprint and reintroduce
     the problem it exists to solve. It is grid-aligned with no jitter, buried
     at mid-crown height where the surrounding foliage hides it from the side,
     and a deep foliage tone so it reads as shadow within the canopy from
     above. */
  /* KEEP. Deleting this was tried and measured: with the carpet back under the
     crown the plate looks redundant, and on the WebGL build it is - 144/144
     ZBar, 0 module diffs without it. The canvas build fails, 136/144, and the
     failures are payload-specific: six of eight are the willow, whose worst
     module covers 5% of its own footprint because a tendril is one narrow
     column. Module reconstruction, Aruco and the camera simulation ALL still
     passed at 144/144 - only real ZBar disagreed, which is what a module
     sitting on the right side of the threshold with no margin left looks
     like. */
  Ctx.prototype.backingPlates = function () {
    var pal = this.pal, n = this.n, rnd = this.rnd;
    /* Tinted inside the leaf ladder's own range rather than as a distinct
       shadow. At -0.30 the plate reads as a separate flat plane wherever a rim
       column's foliage is too sparse to hide it; at -0.12 it passes for one of
       the ladder's darker rungs and the eye stops separating it. Still well
       clear of the floor, and it covers the whole module either way. */
    var deep = { top: Palette.darken(pal.foliageTop, 0.12),
                 sideA: Palette.darken(pal.foliageTop, 0.26),
                 sideB: Palette.darken(pal.foliageTop, 0.38) };
    var keys = Object.keys(this.crownZ).map(Number).sort(function (a, b) { return a - b; });
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], mx = k % n, my = (k - mx) / n;
      var cz = this.crownZ[k];
      if (!isFinite(cz[0]) || !isFinite(cz[1])) continue;
      /* Sits LOW in the column, not at mid-height. At mid-height the plate
         sticks out past the foliage on rim columns, where the crown is thin,
         and reads as a flat lozenge - fine when leaves were boxes covering
         their whole footprint, visible now that they are rounded. Down at the
         crown's underside the whole canopy is above it, and at 35 degrees of
         elevation the crown hides its own underside. */
      /* Back at mid-crown. It was pushed down to the underside because a
         full-module plate stuck out past the rounded leaves on thin rim
         columns - but that was measured against leaves of 0.48-0.74 at
         pack 0.95. Foliage is now 0.55-0.82 at pack 0.84, dense enough to
         swallow it, and at the underside the overhang read as a flat shelf
         protruding below the crown's lower rim. */
      /* Tucked just under the crown's top surface, not at 42% of the column.
         At mid-height a full-module square sticks out past the rounded leaves
         on every thin rim column and reads as a floating platform under the
         foliage - the squares are grid-aligned and flat while everything
         around them is round and jittered, so the eye finds them instantly.
         The top of the column is where the shell packs leaves densest, so a
         plate two modules below it has foliage above and around it from any
         side angle, while still backstopping every gap below it from
         overhead - which is the only direction it exists for. */
      var mid = cz[0] + (cz[1] - cz[0]) * 0.50;
      this.out.push({
        x: mx, y: my, z: mid,
        w: 1, d: 1, h: 0.12,
        top: deep.top, side: deep.sideA, sideA: deep.sideA, sideB: deep.sideB,
        kind: 'leaf', shape: 'plate', leanX: 0, leanY: 0,
        phase: phaseAt(mx, my)
      });
    }
  };

  /* Ground. Every dark module becomes a raised block.

     Under the crown the block is coloured with fallen blossom rather than
     soil. Leaves are smaller than their module, so without this the gaps
     between them show brown from overhead and the crown reads as speckle on
     dirt; with it the module reads solid - leaf cube where there is a leaf,
     fallen petal where there is not, both in the same colour family. From the
     isometric view it also gives the drift of petals under the tree.

     Contrast is unaffected: both fallen tones are darker than the leaves
     above them, so they clear the floor by more than the foliage does. */
  /* Ground, drawn as MERGED REGIONS rather than one tile per module.

     One quad per module leaves a grid line between every pair of neighbours,
     and that grid is most of why the floor still read as squares - the
     reference has no visible cells at all, just flat regions of stone. So the
     matrix is first partitioned into colour categories, then greedily merged
     into maximal rectangles, and one quad is emitted per rectangle. The same
     pixels stay the same colour, so the code is untouched; every grid line
     interior to a rectangle simply disappears.

     Rectangles are capped rather than unbounded. An uncapped merge gives a few
     enormous flat quads, which trades a grid for cut paper; capping keeps the
     tone ladder varying at a coarser scale than the module grid, which is the
     texture the reference has. */
  var MERGE_CAP = 4;

  Ctx.prototype.groundBlocks = function () {
    var pal = this.pal, n = this.n, rnd = this.rnd;

    // 1. category per module, and the blade gate, decided per module as before
    var cat = [], grassAt = [];
    for (var y = 0; y < n; y++) {
      cat.push(new Array(n).fill(null));
      grassAt.push(new Array(n).fill(false));
      for (var x = 0; x < n; x++) {
        if (!this.matrix[y][x]) continue;
        var nz = cellNoise(x, y);
        if (this.claimed[y][x]) {
          cat[y][x] = this.species === 'ginkgo'
            ? (nz > 0.5 ? 'fallen' : 'fallen2') : 'plaza';
        } else {
          var rx = (x + 0.5) / n - 0.5, ry = (y + 0.5) / n - 0.5;
          var rad = Math.sqrt(rx * rx + ry * ry) / 0.7071;
          var isGrass = nz < (rad - 0.35) * 1.6;
          cat[y][x] = isGrass ? 'grass' : 'soil';
          grassAt[y][x] = isGrass;
        }
      }
    }

    // 2. greedy maximal rectangles per category
    var mats = { plaza: pal.mat.plaza, soil: pal.mat.soil, grass: pal.mat.grass,
                 fallen: pal.mat.fallen, fallen2: pal.mat.fallen2 };
    var used = [];
    for (var u = 0; u < n; u++) used.push(new Array(n).fill(false));
    for (var my = 0; my < n; my++) {
      for (var mx = 0; mx < n; mx++) {
        var c = cat[my][mx];
        if (!c || used[my][mx]) continue;
        var w = 1;
        while (w < MERGE_CAP && mx + w < n && cat[my][mx + w] === c && !used[my][mx + w]) w++;
        var h = 1;
        outer: while (h < MERGE_CAP && my + h < n) {
          for (var k = 0; k < w; k++) {
            if (cat[my + h][mx + k] !== c || used[my + h][mx + k]) break outer;
          }
          h++;
        }
        for (var a = 0; a < h; a++) for (var b = 0; b < w; b++) used[my + a][mx + b] = true;
        var mat = mats[c];
        var tone = mat.ladder
          ? pickRung(mat.ladder, toneHash(mx, my, 7)) : mat;
        this.out.push({
          x: mx, y: my, z: SLAB_TOP, w: w, d: h, h: 0.02,
          top: tone.top, side: tone.sideA, sideA: tone.sideA, sideB: tone.sideB,
          kind: 'ground', shape: 'tile', leanX: 0, leanY: 0,
          phase: phaseAt(mx, my)
        });
      }
    }

    // 3. blades, still per module - a tuft belongs to its own square metre
    for (var gy = 0; gy < n; gy++) {
      for (var gx = 0; gx < n; gx++) {
        if (!grassAt[gy][gx]) continue;
        var nz2 = cellNoise(gx, gy);
        var patch = cellNoise(Math.floor(gx / 3) + 71, Math.floor(gy / 3) + 131);
        var dens = patch * 0.62 + nz2 * 0.38;
        var blades = 2 + Math.floor(Math.pow(dens, 1.7) * 6);   // long tail
        var tcx = 0.30 + rnd() * 0.40, tcy = 0.30 + rnd() * 0.40;
        for (var bi = 0; bi < blades; bi++) {
          var bw = 0.09 + rnd() * 0.08;
          var sx = Math.max(0, Math.min(1 - bw, tcx + (rnd() - 0.5) * 0.46 - bw / 2));
          var sy = Math.max(0, Math.min(1 - bw, tcy + (rnd() - 0.5) * 0.46 - bw / 2));
          var dx = sx + bw / 2 - tcx, dy = sy + bw / 2 - tcy;
          var dist = Math.min(1, Math.hypot(dx, dy) / 0.33);
          var bh2 = (0.34 + rnd() * 0.22) * (1.35 - 0.65 * dist);
          var before = this.out.length;
          place(this, gx, gy, SLAB_TOP + 0.02, bw, bh2, pal.mat.grass, 'blade', rnd);
          var v = this.out[before];
          v.x = gx + sx; v.y = gy + sy;
          var ang = Math.atan2(dy, dx) + (rnd() - 0.5) * 0.8;
          var lim = 0.98;
          v.leanX = Math.max(-sx * lim, Math.min(((1 - bw) - sx) * lim, Math.cos(ang) * 0.34));
          v.leanY = Math.max(-sy * lim, Math.min(((1 - bw) - sy) * lim, Math.sin(ang) * 0.34));
        }
      }
    }
  };

  // --- species -----------------------------------------------------------
  /* CROWN WIDTH. Three of the four species converged on the same correction -
     radius x1.15, heights x0.85-0.95 - when swept against the reference. The
     crowns were uniformly about 15% too narrow and slightly too tall, which is
     why they read as tall lumps rather than canopies. Crown width over plot
     width lands near 0.60, matching the reference.

     The ginkgo is deliberately excluded. Its best fit is x1.40, but the target is
     borrowed: the reference only ever shows the cherry, and a eucalyptus
     genuinely is sparse and open-crowned. Widening it to match would cost the
     one thing that distinguishes its silhouette. Match the family, not the
     cherry's exact numbers - the willow likewise sits broader than tall.

     Only the RADIUS correction is applied. The accompanying height reduction
     was derived against a taller baseline than this one; applied here it drove
     the silhouette to 0.874-0.888, under the floor. Widening alone brings the
     crown aspect down without touching the silhouette, which is the part that
     was actually wrong.

     Proportions are tuned against a measured silhouette aspect (rendered
     diorama height / plot width at t=0), not by eye. The target band is
     0.90-1.05; a crown that tops out around 0.9n lands there. Anything much
     flatter reads as a disc floating over a plaza, and - because a flat crown
     has nothing behind its gaps - it is also what makes the matrix carving
     show through as lace.

     Every species leaves clear air between the ground blocks and the crown's
     underside, so the trunk is visible for roughly a fifth of tree height. */

  /* Spring. Short trunk, broad crown of overlapping puffs at staggered
     heights - layered rather than one ball, which is what separates its
     silhouette from the oak. */
  function plantSakura(c, n, cx, cy) {
    var rnd = c.rnd;
    var trunkH = n * 0.26;
    var R = n * 0.350;                       // the reference tree; the anchor
    c.trunk(cx, cy, 0, trunkH, 0.62);

    /* A cherry is TIERED, not spherical: broad horizontal shelves of blossom
       with the limbs showing between them. The previous crown was one cloud of
       radius R with four satellites at 0.55R and radius 0.66R - they sat
       entirely inside the parent, so the union was a smooth ellipsoid and read
       as a ball. Satellites now ride at 0.78R and are smaller than the gap
       they leave, so the outline is lobed and the sky comes through. */
    var LOBES = 7;
    // core: continuous, so the crown never shows a bite
    c.clump(cx + 0.5, cy + 0.5, trunkH + n * 0.33, R * 0.88, n * 0.24, 6);
    for (var i = 0; i < LOBES; i++) {
      var a = (i / LOBES) * Math.PI * 2 + rnd() * 0.45;
      var lift = (i % 2) ? 0.05 : 0.0;       // alternate heights = tiered outline
      c.clump(cx + 0.5 + Math.cos(a) * R * 0.60,
              cy + 0.5 + Math.sin(a) * R * 0.60,
              trunkH + n * (0.25 + lift), R * 0.40, n * 0.135, 3);
      // a limb out to each lobe, so the branching reads in the gaps
      c.limb(cx + 0.5, cy + 0.5, a, R * 0.72, trunkH * 0.92, n * 0.045, 0.34);
    }
    c.clump(cx + 0.5, cy + 0.5, trunkH + n * 0.62, R * 0.46, n * 0.155, 4);
  }

  /* Summer. Thick trunk, heavy forking limbs, deep rounded crown - taller and
     lumpier than the sakura. */
  function plantOak(c, n, cx, cy) {
    var rnd = c.rnd;
    var trunkH = n * 0.28;
    var R = n * 0.467;                       // biggest and broadest
    c.trunk(cx, cy, 0, trunkH, 0.82);
    c.trunk(cx + 1, cy, 0, trunkH * 0.7, 0.42);
    c.trunk(cx, cy + 1, 0, trunkH * 0.7, 0.42);

    var limbs = 5 + Math.floor(rnd() * 2);
    for (var i = 0; i < limbs; i++) {
      c.limb(cx + 0.5, cy + 0.5, (i / limbs) * Math.PI * 2 + rnd() * 0.6,
        R * (0.5 + rnd() * 0.4), trunkH * 0.66, n * 0.10, 0.48);
    }
    /* An oak crown is a cluster of heavy masses, not one dome. The lobes are
       deliberately uneven in radius and height - an oak is the lumpiest
       silhouette of the four and that irregularity is the species read. */
    c.clump(cx + 0.5, cy + 0.5, trunkH + n * 0.34, R * 0.82, n * 0.27, 7);
    var OLOBES = 7;
