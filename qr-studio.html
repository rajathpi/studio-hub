      out.push({ pts: ring([], px, py, r, r, 10), col: v.sideA || v.side });
      // a smaller disc offset up-sun keeps the audited top tone facing the sky
      out.push({ pts: ring([], px - r * 0.16, py - r * 0.20, r * 0.74, r * 0.74, 10),
                 col: v.top });
      return;
    }

    if (shape === 'cyl') {
      // body, then an elliptical cap - no vertical edges, no jitter
      var cx0 = projX(cam, x0 + bx, (y0 + y1) / 2 + by);
      var cx1 = projX(cam, x1 + bx, (y0 + y1) / 2 + by);
      var byy = projY(cam, (x0 + x1) / 2 + bx, (y0 + y1) / 2 + by, zb);
      var tyy = projY(cam, (x0 + x1) / 2 + tx, (y0 + y1) / 2 + ty, zt);
      var tcx0 = projX(cam, x0 + tx, (y0 + y1) / 2 + ty);
      var tcx1 = projX(cam, x1 + tx, (y0 + y1) / 2 + ty);
      /* The body is a vertical surface, so it goes edge-on in the plan view.
         Emit it only when the camera can actually see it - the box path
         already gates its sides the same way, and a zero-area polygon is a
         geometry-sweep failure even though the painter skips it. */
      if (cam.cp > EPS_FACE) {
        out.push({ pts: [cx0, byy, cx1, byy, tcx1, tyy, tcx0, tyy], col: v.sideA || v.side });
      }
      var ccx = (tcx0 + tcx1) / 2, crx = (tcx1 - tcx0) / 2;
      /* A horizontal circle foreshortens by sin(pitch), not cos: it is a full
         circle looking straight down and squashed at isometric. Using cos had
         it exactly backwards - the cap collapsed to a zero-area line in the
         plan view, which is the one view the code is read from. */
      out.push({ pts: ring([], ccx, tyy, crx, crx * cam.sp, 10), col: v.top });
      return;
    }

    if (shape === 'blade') {
      // tapered spike leaning along its splay
      var ax = projX(cam, x0 + bx, y0 + by), ay = projY(cam, x0 + bx, y0 + by, zb);
      var b2x = projX(cam, x1 + bx, y1 + by), b2y = projY(cam, x1 + bx, y1 + by, zb);
      var tipx = projX(cam, (x0 + x1) / 2 + tx, (y0 + y1) / 2 + ty);
      var tipy = projY(cam, (x0 + x1) / 2 + tx, (y0 + y1) / 2 + ty, zt);
      // a blade with no splay is edge-on from directly overhead
      var ar = Math.abs((b2x - ax) * (tipy - ay) - (tipx - ax) * (b2y - ay)) / 2;
      if (ar > EPS_AREA) out.push({ pts: [ax, ay, b2x, b2y, tipx, tipy], col: v.top });
      return;
    }

    // top face - always visible, and the only face that survives the plan view
    var top = [
      projX(cam, x0 + tx, y0 + ty), projY(cam, x0 + tx, y0 + ty, zt),
      projX(cam, x1 + tx, y0 + ty), projY(cam, x1 + tx, y0 + ty, zt),
      projX(cam, x1 + tx, y1 + ty), projY(cam, x1 + tx, y1 + ty, zt),
      projX(cam, x0 + tx, y1 + ty), projY(cam, x0 + tx, y1 + ty, zt)
    ];
    if (cam.showSideY) {
      out.push({ pts: [
        projX(cam, x0 + bx, y0 + by), projY(cam, x0 + bx, y0 + by, zb),
        projX(cam, x1 + bx, y0 + by), projY(cam, x1 + bx, y0 + by, zb),
        projX(cam, x1 + tx, y0 + ty), projY(cam, x1 + tx, y0 + ty, zt),
        projX(cam, x0 + tx, y0 + ty), projY(cam, x0 + tx, y0 + ty, zt)
      ], col: v.sideA || v.side });
    }
    if (cam.showSideX) {
      out.push({ pts: [
        projX(cam, x0 + bx, y0 + by), projY(cam, x0 + bx, y0 + by, zb),
        projX(cam, x0 + bx, y1 + by), projY(cam, x0 + bx, y1 + by, zb),
        projX(cam, x0 + tx, y1 + ty), projY(cam, x0 + tx, y1 + ty, zt),
        projX(cam, x0 + tx, y0 + ty), projY(cam, x0 + tx, y0 + ty, zt)
      ], col: v.sideB || v.side });
    }
    out.push({ pts: top, col: v.top });
  }

  // Depth key. The far corner in plan, and the TOP of the box in z: in the
  // plan view the visible surface is the top face, so the box whose top is
  // highest must be painted last.
  function depthKey(cam, v) {
    var vy = (v.x + v.w) * cam.sy + (v.y + v.d) * cam.cy;
    return vy * cam.cp - (v.z + v.h) * cam.sp;
  }

  function fillPoly(ctx, pts, col) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
  }

  /* Ground: background flood, slab, paving, dark tiles. Nothing here moves in
     the wind and nothing here overlaps, so the whole thing is one cacheable
     image. */
  function drawGround(ctx, scene, cam, W, H) {
    var pal = scene.palette, n = scene.n;
    ctx.save();
    ctx.fillStyle = pal.paving;
    ctx.fillRect(0, 0, W, H);

    /* --- slab, first and outside the sort -------------------------------
       It spans the whole plot and sits under every block, so no single depth
       key can order it against them - a centre-point key puts it in the middle
       of the run and it paints over the back half of the ground.

       Exactly (0,0)-(n,n): no half-module shift is applied anywhere in this
       file. If one is ever added, the slab's own x/y must cancel it or the
       slab juts past two edges and eats the quiet zone.

       The dark modules themselves are NOT drawn here. They are raised blocks,
       which genuinely overlap what stands on them, so they live in the sorted
       voxel list like everything else. That leaves this cache holding just the
       background flood and one box - still worth keeping, since wind forces a
       full repaint of the sorted list every frame. */
    var slab = { x: 0, y: 0, z: SLAB_BOTTOM, w: n, d: n, h: SLAB_TOP - SLAB_BOTTOM,
                 phase: 0, top: pal.paving, side: pal.slabSide,
                 sideA: pal.slabSide, sideB: Palette.darken(pal.slabSide, 0.14) };
    var faces = [];
    boxFaces(faces, cam, slab, 0, 0);
    for (var f = 0; f < faces.length; f++) {
      if (Math.abs(shoelace(faces[f].pts)) > EPS_AREA) fillPoly(ctx, faces[f].pts, faces[f].col);
    }

    ctx.restore();
  }

  // Faces of every standing voxel, depth sorted, ready to paint.
  function collectFaces(scene, cam, time, amp) {
    var vox = scene.voxels;
    var order = new Array(vox.length);
    for (var i = 0; i < vox.length; i++) order[i] = i;
    order.sort(function (a, b) { return depthKey(cam, vox[b]) - depthKey(cam, vox[a]); });

    var faces = [];
    for (var k = 0; k < order.length; k++) boxFaces(faces, cam, vox[order[k]], time, amp);
    return faces;
  }

  function drawVoxels(ctx, scene, cam, time, amp) {
    var faces = collectFaces(scene, cam, time, amp);
    for (var i = 0; i < faces.length; i++) {
      var f = faces[i];
      if (Math.abs(shoelace(f.pts)) <= EPS_AREA) continue;   // edge-on or degenerate
      fillPoly(ctx, f.pts, f.col);
    }
    return faces.length;
  }

  /* The stage carries cursor:pointer and a click handler but was tabIndex -1,
     so the on-screen hint instructed a gesture keyboard users could not
     perform. This gives it focus and a key path without changing the camera. */
  function attachStageKeys(el, onTap) {
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label',
      'Voxel tree. Press Enter to flip between the tree and the scannable code.');
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { onTap(); ev.preventDefault(); }
    });
  }

  /* Ambient life. Both renderers read these so the two builds agree on what
     the weather is doing; each draws it with its own primitives.

     Fall is expressed as descents per second: the old 0.6-1.7 meant a petal
     crossed the whole scene in well under two seconds, which read as rain
     rather than drift. Winter is snow - slower, larger, and it wanders. */
  /* kind drives the silhouette, and each one is its season: a cherry petal,
     a winged samara, a ginkgo fan, a six-spoke flake. SPECIES already declared
     these (petals / seeds / leaves / snow) and the renderers were drawing a
     square for three of the four. Counts come down as the sizes go up - the
     brief is a moderate amount of weather, not a blizzard. */
  var WEATHER = {
    sakura:  { kind: 'petal', fall: 0.13, spread: 0.10, size: 0.98, sway: 0.9, count: 54, snow: false },
    oak:     { kind: 'seed',  fall: 0.17, spread: 0.12, size: 0.90, sway: 1.2, count: 46, snow: false },
    ginkgo:  { kind: 'leaf',  fall: 0.15, spread: 0.11, size: 1.08, sway: 1.4, count: 50, snow: false },
    willow:  { kind: 'flake', fall: 0.10, spread: 0.07, size: 1.02, sway: 1.7, count: 66, snow: true }
  };
  /* Snow has to read against the paving, which is itself pale and warm
     (#edeae3). Near-white snow was invisible on it. A cool blue-grey
     separates by temperature rather than by lightness. */
  var SNOW_TINT = '#c3d1de';

  function weatherFor(species) { return WEATHER[species] || WEATHER.sakura; }

  /* One shape definition, both renderers. The canvas build calls this per
     particle; the WebGL build paints it once into an offscreen canvas and uses
     that as the point sprite, so the two builds cannot drift apart.
     Draws into a box of side `s` centred on (cx, cy). The caller sets
     fillStyle and strokeStyle. */
  function paintFallShape(ctx, kind, cx, cy, s, rot) {
    var r = s / 2;
    ctx.save();
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);
    if (kind === 'cap') {
      // a soft mound, wider than tall: snow lying on a leaf
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.98, r * 0.56, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    if (kind === 'flake') {
      ctx.lineWidth = Math.max(1, s * 0.15);
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (var i = 0; i < 3; i++) {
        var a = i * Math.PI / 3;
        ctx.moveTo(-Math.cos(a) * r, -Math.sin(a) * r);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      // short barbs, which is what separates a flake from an asterisk
      for (var j = 0; j < 6; j++) {
        var b = j * Math.PI / 3, bx = Math.cos(b) * r * 0.62, by = Math.sin(b) * r * 0.62;
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(b + 0.9) * r * 0.28, by + Math.sin(b + 0.9) * r * 0.28);
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(b - 0.9) * r * 0.28, by + Math.sin(b - 0.9) * r * 0.28);
      }
      ctx.stroke();
    } else if (kind === 'leaf') {
      // ginkgo: a fan, notched at the crown, on a short stalk
      ctx.beginPath();
      ctx.moveTo(0, r * 0.96);
      ctx.quadraticCurveTo(-r * 0.98, r * 0.18, -r * 0.66, -r * 0.74);
      ctx.quadraticCurveTo(-r * 0.22, -r * 0.46, 0, -r * 0.58);
      ctx.quadraticCurveTo(r * 0.22, -r * 0.46, r * 0.66, -r * 0.74);
      ctx.quadraticCurveTo(r * 0.98, r * 0.18, 0, r * 0.96);
      ctx.fill();
    } else if (kind === 'seed') {
      // samara: a seed body with one wing, the thing that spins as it falls
      ctx.beginPath();
      ctx.ellipse(0, r * 0.46, r * 0.32, r * 0.27, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, r * 0.34);
      ctx.quadraticCurveTo(r * 0.88, -r * 0.10, r * 0.22, -r * 0.96);
      ctx.quadraticCurveTo(-r * 0.06, -r * 0.18, 0, r * 0.34);
      ctx.fill();
    } else {
      // cherry petal: rounded, with the characteristic notch at the tip
      ctx.beginPath();
      ctx.moveTo(0, r * 0.92);
      ctx.bezierCurveTo(-r * 1.0, r * 0.40, -r * 0.82, -r * 0.58, -r * 0.16, -r * 0.90);
      ctx.quadraticCurveTo(0, -r * 0.62, r * 0.16, -r * 0.90);
      ctx.bezierCurveTo(r * 0.82, -r * 0.58, r * 1.0, r * 0.40, 0, r * 0.92);
      ctx.fill();
    }
    ctx.restore();
  }

  /* Birds: a few crossing the sky on slow circular arcs, well above the crown
     and outside the plot footprint, so they stay small disconnected blobs that
     the silhouette measurement discards. Deterministic in `time` - no state,
     so both renderers and the test harness agree frame for frame. */
  var BIRD_COUNT = 3;
  var BIRD_PERIOD = 26000;        // ms for a full circuit
  var BIRD_SPAN = 0.62;           // orbit radius, as a fraction of plot width

  function birdsAt(n, maxZ, time) {
    var out = [];
    for (var i = 0; i < BIRD_COUNT; i++) {
      var ph = (time / BIRD_PERIOD + i / BIRD_COUNT) * Math.PI * 2;
      var r = n * BIRD_SPAN * (0.82 + 0.18 * Math.sin(ph * 0.7 + i));
      out.push({
        x: n / 2 + Math.cos(ph) * r,
        y: n / 2 + Math.sin(ph) * r * 0.72,
        z: maxZ + n * (0.30 + 0.10 * Math.sin(ph * 1.7 + i * 2)),
        // wing phase drives the V opening; a flat V reads as a glide
        flap: Math.sin(time / 190 + i * 1.7),
        dir: Math.cos(ph) >= 0 ? 1 : -1
      });
    }
    return out;
  }

  return {
    attachStageKeys: attachStageKeys,
    weatherFor: weatherFor, birdsAt: birdsAt, SNOW_TINT: SNOW_TINT,
    paintFallShape: paintFallShape,
    BIRD_COUNT: BIRD_COUNT,
    DEG: DEG, QUIET: QUIET, SLAB_BOTTOM: SLAB_BOTTOM, SLAB_TOP: SLAB_TOP,
    WIND_AMP: WIND_AMP, WIND_FREQ: WIND_FREQ, WIND_DIR: WIND_DIR,
    EPS_AREA: EPS_AREA,
    easeInOutCubic: easeInOutCubic,
    makeCamera: makeCamera,
    projX: projX, projY: projY,
    windAt: windAt,
    shoelace: shoelace,
    boxFaces: boxFaces,
    depthKey: depthKey,
    collectFaces: collectFaces,
    drawGround: drawGround,
    drawVoxels: drawVoxels,
    fillPoly: fillPoly
  };
});

</script>

<script>
(() => {
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const MOD = isMac ? "⌘" : "Ctrl";
  document.querySelectorAll("[data-modkey]").forEach(e => e.textContent = MOD);
  document.querySelectorAll("[data-mod]").forEach(e => e.textContent = MOD + " C");
  document.querySelectorAll("[data-snip]").forEach(e => e.textContent = isMac ? "⌘ Shift 4" : "Win Shift S");
  const $ = id => document.getElementById(id);
  const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  const xml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2000); }
  async function copyText(s) { try { await navigator.clipboard.writeText(s); toast("Copied"); } catch { toast("Copy blocked by the browser"); } }

  // ================= content =================
  const TYPES = {
    link: { label: "Link / text", fields: [{ k: "text", label: "Link or text", area: true, ph: "https://" }] },
    wifi: { label: "Wi-Fi", fields: [
      { k: "ssid", label: "Network name" }, { k: "pass", label: "Password", pw: true },
      { k: "sec", label: "Security", opts: [["WPA", "WPA / WPA2 / WPA3"], ["WEP", "WEP"], ["nopass", "None (open network)"]] },
      { k: "hidden", label: "Hidden network", check: true }] },
    contact: { label: "Contact", fields: [{ k: "name", label: "Name" }, { k: "phone", label: "Phone", type: "tel" }, { k: "email", label: "Email", type: "email" }, { k: "org", label: "Company" }] },
    email: { label: "Email", fields: [{ k: "to", label: "To", type: "email" }, { k: "subject", label: "Subject" }, { k: "body", label: "Message", area: true }] },
    sms: { label: "SMS", fields: [{ k: "num", label: "Phone number", type: "tel" }, { k: "msg", label: "Message", area: true }] },
    phone: { label: "Phone", fields: [{ k: "num", label: "Phone number", type: "tel" }] },
  };
  const vals = {
    link: { text: "https://example.com" }, wifi: { ssid: "", pass: "", sec: "WPA", hidden: false },
    contact: { name: "", phone: "", email: "", org: "" }, email: { to: "", subject: "", body: "" },
    sms: { num: "", msg: "" }, phone: { num: "" },
  };
  let type = "link";

  // Wi-Fi strings escape \ ; , : " with a backslash.
  const wesc = s => String(s).replace(/([\\;,:"])/g, "\\$1");
  const vesc = s => String(s).replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\r?\n/g, "\\n");
  function payload() {
    const v = vals[type], t = s => (s || "").trim();
    if (type === "link") return t(v.text);
    if (type === "wifi") {
      if (!t(v.ssid)) return "";
      return `WIFI:T:${v.sec};S:${wesc(v.ssid)};${v.sec !== "nopass" ? `P:${wesc(v.pass)};` : ""}H:${v.hidden ? "true" : "false"};;`;
    }
    if (type === "contact") {
      if (![v.name, v.phone, v.email, v.org].some(t)) return "";
      const parts = t(v.name).split(/\s+/), last = parts.length > 1 ? parts.pop() : "", first = parts.join(" ");
      const L = ["BEGIN:VCARD", "VERSION:3.0", `N:${vesc(last)};${vesc(first)};;;`, `FN:${vesc(t(v.name))}`];
      if (t(v.org)) L.push(`ORG:${vesc(t(v.org))}`);
      if (t(v.phone)) L.push(`TEL;TYPE=CELL:${t(v.phone)}`);
      if (t(v.email)) L.push(`EMAIL:${t(v.email)}`);
      L.push("END:VCARD");
      return L.join("\r\n");
    }
    if (type === "email") {
      if (!t(v.to)) return "";
      const q = [];
      if (t(v.subject)) q.push("subject=" + encodeURIComponent(t(v.subject)));
      if (t(v.body)) q.push("body=" + encodeURIComponent(v.body.trim()));
      return "mailto:" + t(v.to) + (q.length ? "?" + q.join("&") : "");
    }
    if (type === "sms") return t(v.num) ? `SMSTO:${t(v.num)}:${(v.msg || "").trim()}` : "";
    if (type === "phone") return t(v.num) ? "tel:" + t(v.num).replace(/[^\d+]/g, "") : "";
    return "";
  }
  // Caption under framed styles, filled from the content unless the user typed one.
  // Host as typed (URL() would turn göteborg.se into punycode).
  const hostOf = s => ((s || "").trim().match(/^(?:[a-z][\w+.-]*:\/\/)?(?:[^@\/?#\s]*@)?([^\s\/?#:@.]+(?:\.[^\s\/?#:@.]+)+)/i) || [, ""])[1].replace(/^www\./i, "");
  function autoCaption() {
    const v = vals[type], t = s => (s || "").trim();
    if (type === "link") {
      const host = hostOf(v.text);
      return host ? { title: "Scan to open", sub: host } : { title: "Scan me", sub: "" };
    }
    if (type === "wifi") return { title: "Scan for Wi-Fi", sub: t(v.ssid) };
    if (type === "contact") return { title: "Scan to save contact", sub: t(v.name) || t(v.org) };
    if (type === "email") return { title: "Scan to email", sub: t(v.to) };
    if (type === "sms") return { title: "Scan to text", sub: t(v.num) };
    return { title: "Scan to call", sub: t(v.num) };
  }
  function autoInitial() {
    const v = vals[type];
    let s = type === "link" ? (hostOf(v.text) || v.text)
      : type === "wifi" ? v.ssid : type === "contact" ? (v.name || v.org) : type === "email" ? v.to : "";
    s = (s || "").trim();
    return s ? [...s][0].toUpperCase() : "Q";
  }

  const typeBox = $("types");
  Object.entries(TYPES).forEach(([k, d]) => {
    const b = h("button", { className: "tool" + (k === type ? " on" : ""), textContent: d.label });
    b.dataset.type = k;
    b.onclick = () => setType(k);
    typeBox.append(b);
  });
  function setType(k) {
    type = k;
    typeBox.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.type === k));
    $("print").hidden = k !== "wifi";
    buildFields(); renderAll();
  }
  function buildFields() {
    const box = $("fields"); box.replaceChildren();
    const v = vals[type];
    TYPES[type].fields.forEach(f => {
      if (f.check) {
        const c = h("input", { type: "checkbox", checked: !!v[f.k] });
        c.onchange = () => { v[f.k] = c.checked; renderAll(); };
        box.append(h("label", { className: "check" }, c, f.label));
        return;
      }
      let inp;
      if (f.opts) {
        inp = h("select");
        f.opts.forEach(([val, lab]) => inp.append(h("option", { value: val, textContent: lab })));
        inp.value = v[f.k];
        inp.onchange = () => { v[f.k] = inp.value; syncPw(); renderAll(); };
      } else {
        inp = f.area ? h("textarea", { rows: 3 }) : h("input", { type: f.pw ? "password" : (f.type || "text") });
        inp.value = v[f.k] || ""; inp.placeholder = f.ph || ""; inp.spellcheck = false;
        inp.oninput = () => { v[f.k] = inp.value; schedule(renderAll, 220); };
      }
      inp.dataset.k = f.k;
      let el = inp;
      if (f.pw) {
        const eye = h("button", { type: "button", textContent: "Show", title: "Show / hide" });
        eye.onclick = () => { inp.type = inp.type === "password" ? "text" : "password"; eye.textContent = inp.type === "password" ? "Show" : "Hide"; };
        el = h("div", { className: "pw" }, inp, eye);
      }
      box.append(h("label", { className: "field" }, h("span", { textContent: f.label }), el));
    });
    syncPw();
  }
  function syncPw() {   // an open network has no password
    if (type !== "wifi") return;
    const p = $("fields").querySelector('[data-k="pass"]');
    if (p) p.closest(".field").style.display = vals.wifi.sec === "nopass" ? "none" : "";
  }

    setMode("scan");
    if (!navigator.mediaDevices?.getUserMedia) return toast("No camera access in this browser");
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); }
    catch { return toast("Camera not available"); }
    const v = $("video"); v.srcObject = stream; await v.play().catch(() => {});
    $("empty").style.display = "none"; $("result").style.display = "none"; $("cam").style.display = "flex";
    $("camBtn").classList.add("on");
    const tick = () => {
      if (!stream) return;
      if (v.videoWidth) {
        const hit = decode(v, v.videoWidth, v.videoHeight);
        if (hit) { showShot(v, hit); stopCam(); return; }
      }
      camTimer = setTimeout(tick, 180);
    };
    tick();
  }
  function stopCam() {
    clearTimeout(camTimer);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $("camBtn").classList.remove("on");
    if ($("cam").style.display === "flex") { $("cam").style.display = "none"; if (!lastScan && $("result").style.display !== "flex") $("empty").style.display = ""; }
  }
  $("camBtn").onclick = () => stream ? stopCam() : startCam();
  $("pickCam").onclick = startCam;
  $("camStop").onclick = stopCam;

  // ---------- inputs ----------
  document.addEventListener("paste", e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    if (item) { e.preventDefault(); return scanBlob(item.getAsFile()); }
    if (mode === "scan" && !e.target.closest?.("input, textarea")) toast("No image on the clipboard. Take a screenshot first");
  });
  scanEl.addEventListener("dragover", e => { e.preventDefault(); scanEl.classList.add("dropping"); });
  scanEl.addEventListener("dragleave", () => scanEl.classList.remove("dropping"));
  scanEl.addEventListener("drop", e => { e.preventDefault(); scanEl.classList.remove("dropping"); scanBlob(e.dataTransfer.files[0]); });
  // Dropping an image anywhere in Make reads it too.
  $("make").addEventListener("dragover", e => e.preventDefault());
  $("make").addEventListener("drop", e => { e.preventDefault(); scanBlob(e.dataTransfer.files[0]); });
  $("open").onclick = $("pick").onclick = () => $("file").click();
  $("file").onchange = e => { scanBlob(e.target.files[0]); e.target.value = ""; };

  // ---------- mode ----------
  let mode = "make";
  function setMode(m) {
    if (m === mode) return;
    mode = m; document.body.dataset.mode = m;
    document.querySelectorAll("header [data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    if (m === "make") stopCam();
    history.replaceState(null, "", m === "scan" ? "#scan" : location.pathname + location.search);
  }
  document.querySelectorAll("header [data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));

  document.addEventListener("keydown", e => {
    if (e.target.closest?.("input, textarea, select")) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mode === "make" && mod && k === "c" && !String(getSelection())) { e.preventDefault(); copyImg(); }
    else if (mode === "make" && mod && k === "s") { e.preventDefault(); savePng(); }
    else if (mode === "make" && !mod && (k === "arrowright" || k === "arrowleft")) { e.preventDefault(); select((sel + (k === "arrowright" ? 1 : styles.length - 1)) % styles.length); }
    else if (k === "escape" && mode === "scan") resetScan();
  });

  // Exposed for testing.
  window.qrStudio = { payload, styles, cards, decode, parse, setType, vals, renderAll, renderCard, select, render, check, renderSvg, pngBlob, palette, mosaicModel, matrix, buildCustom };

  buildFields(); buildCustom();
  if (location.hash === "#scan") setMode("scan");
  (document.fonts?.ready || Promise.resolve()).then(renderAll);
})();
</script>
<!-- studio-hub theme slider -->
<div class="hub-theme" title="Light / dark"><button type="button" role="switch" aria-label="Dark theme" aria-checked="false"><i></i></button></div>
<script>
(() => {
  const root = document.documentElement, wrap = document.querySelector(".hub-theme"), btn = wrap.querySelector("button"), knob = btn.querySelector("i");
  const slot = document.querySelector("[data-hub-theme-slot]");
  if (slot) { slot.append(wrap); wrap.classList.add("docked"); }  // app pages: sit at the end of the toolbar
  const sync = () => btn.setAttribute("aria-checked", String(root.dataset.theme === "dark"));
  const set = (t) => {
    root.dataset.theme = t; knob.style.left = ""; sync();
    try { localStorage.setItem("hubTheme", t); } catch (e) {}
    window.dispatchEvent(new CustomEvent("hubthemechange", { detail: t }));
  };
  // Click toggles; a drag snaps to whichever end it is released nearer.
  let drag = null, skipClick = false;
  const frac = (e) => { const r = btn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left - 10) / (r.width - 20))); };
  btn.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, moved: false }; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) { drag.moved = true; wrap.classList.add("dragging"); }
    if (drag.moved) knob.style.left = 2 + frac(e) * 30 + "px";
  });
  btn.addEventListener("pointerup", (e) => {
    wrap.classList.remove("dragging");
    if (drag && drag.moved) { set(frac(e) > 0.5 ? "dark" : "light"); skipClick = true; }
    drag = null;
  });
  btn.addEventListener("click", () => { if (skipClick) { skipClick = false; return; } set(root.dataset.theme === "dark" ? "light" : "dark"); });
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") set("light"); if (e.key === "ArrowRight") set("dark"); });
  // Another tab changed it: follow along.
  window.addEventListener("storage", (e) => { if (e.key === "hubTheme") { root.dataset.theme = e.newValue === "dark" ? "dark" : "light"; sync(); } });
  sync();
})();
</script>
